const TGP2=[["Quá trình tiêu hóa Triacylglycerol (TG) diễn ra mạnh mẽ và hoàn chỉnh nhất ở vị trí nào trong ống tiêu hóa?",["Miệng","Dạ dày","Tá tràng và hổng tràng","Đại tràng"],2,"Triacylglycerol chủ yếu được tiêu hóa mạnh mẽ và hoàn chỉnh nhất tại tá tràng và hổng tràng nhờ sự phối hợp của dịch mật và dịch tụy."],["Lipid trong thức ăn được nhũ tương hóa tại ruột non nhờ thành phần nào sau đây?",["Lipase tụy","Muối mật","Cholecystokinin (CCK)","Isomerase"],1,"Muối mật chứa cấu trúc phân cực và không phân cực giúp nhũ tương hóa lipid, làm giảm sức căng bề mặt và hình thành các hạt micelle."],["Hormone Cholecystokinin (CCK) do tế bào niêm mạc tá tràng tiết ra có vai trò chính nào trong tiêu hóa lipid?",["Thủy phân trực tiếp liên kết ester của Triacylglycerol","Kích thích co bóp túi mật (tiết muối mật) và kích thích tụy tiết enzyme tiêu hóa","Ức chế hoàn toàn hoạt tính của Lipase tụy","Hoạt hóa enzyme Lipoprotein Lipase ở thành mao mạch"],1,"Khi lipid đi vào tá tràng, tế bào tại đây tiết CCK gây co bóp túi mật bài tiết dịch mật và kích thích tụy tiết các enzyme tiêu hóa."],["Lipase tụy thủy phân Triacylglycerol tại các vị trí liên kết ester nào của glycerol để tạo sản phẩm chủ yếu?",["Thủy phân liên kết ester ở C2 tạo 1-monoacylglycerol","Thủy phân liên kết ester ở C1 và C3 tạo acid béo tự do và 2-monoacylglycerol","Thủy phân toàn bộ 3 liên kết ester giải phóng glycerol tự do ngay lập tức","Chỉ thủy phân liên kết ester ở C2 tạo 1,3-diacylglycerol"],1,"Lipase tụy thủy phân đặc hiệu liên kết ester ở vị trí C1 và C3 của Triacylglycerol, giải phóng 2 acid béo tự do và 2-monoacylglycerol (2-MAG)."],["Lipase tụy hoạt động tối ưu ở khoảng độ pH bằng bao nhiêu?",["pH 1.5 – 2.0","pH 4.0 – 5.0","pH 6.0","pH 8.5 – 9.0"],2,"Enzyme Lipase tụy chỉ hoạt động ở pH tối ưu = 6.0 trong môi trường dịch ruột."],["Lipase lưỡi và Lipase dạ dày chủ yếu thủy phân loại Triacylglycerol nào?",["Triacylglycerol chứa acid béo chuỗi dài (C \u003e 18)","Triacylglycerol chứa acid béo mạch ngắn và trung bình (C \u003c 12)","Cholesteryl ester chứa acid béo không bão hòa","Phospholipid màng tế bào"],1,"Lipase lưỡi và Lipase dạ dày hoạt động ở pH acid, ưu tiên thủy phân TG chứa các acid béo chuỗi ngắn và trung bình (C \u003c 12)."],["Sau khi khuếch tán vào tế bào niêm mạc ruột non, các sản phẩm thủy phân của Triacylglycerol (2-monoacylglycerol và acid béo) được xử lý như thế nào?",["Được oxy hóa ngay tạo năng lượng cho tế bào ruột","Được tái tổng hợp lại thành Triacylglycerol và đóng gói vào Chylomicron","Đưa trực tiếp vào tĩnh mạch cửa về gan dạng tự do","Chuyển hóa hoàn toàn thành thể Ceton"],1,"Tại tế bào biểu mô ruột non, 2-monoacylglycerol và acid béo được tái tổng hợp lại thành Triacylglycerol, sau đó đóng gói cùng apoprotein thành Chylomicron."],["Cấu trúc hạt micelle hỗn hợp được hình thành bởi muối mật có tác dụng sinh học quan trọng nào?",["Vận chuyển trực tiếp Triacylglycerol vào hệ bạch huyết","Làm giảm pH môi trường dịch ruột xuống 2.0","Làm tăng diện tích tiếp xúc của các hạt Triacylglycerol với enzyme Lipase tụy","Bất hoạt các enzyme esterase của tụy"],2,"Muối mật phân tán các giọt mỡ thành vô số hạt micelle kích thước nhỏ, làm tăng diện tích tiếp xúc cho enzyme Lipase tụy tác động."],["Lipoprotein nào có kích thước lớn nhất, tỷ trọng thấp nhất và chứa hàm lượng Triacylglycerol cao nhất (~85%)?",["VLDL","LDL","HDL","Chylomicron (CM)"],3,"Chylomicron là loại Lipoprotein có kích thước hạt lớn nhất, tỷ trọng thấp nhất và chứa hàm lượng Triacylglycerol cao nhất (85%). BỘ 40 CÂU HỎI TRẮC NGHIỆM CHUYỂN HÓA TRIACYLGLYCEROL                                                 CHUYỂN HÓA LIPID"],["Chylomicron được tổng hợp tại đâu và đảm nhận vai trò vận chuyển lipid nào?",["Tổng hợp tại Gan; vận chuyển Lipid nội sinh","Tổng hợp tại Tế bào biểu mô ruột non; vận chuyển Lipid ngoại sinh (từ thức ăn) đến các mô","Tổng hợp tại Mô mỡ; vận chuyển Lipid về gan","Tổng hợp trong Máu; vận chuyển Cholesterol từ mô về gan"],1,"Chylomicron do tế bào biểu mô ruột non tổng hợp, vận chuyển Triacylglycerol ngoại sinh từ thức ăn qua hệ bạch huyết rồi vào máu đến các mô."],["Enzyme Lipoprotein Lipase (LPL) ở thành mao mạch các mô (mỡ, cơ, tuyến vú) được hoạt hóa bởi apoprotein nào trên hạt Chylomicron và VLDL?",["ApoA-I","ApoB-48","ApoC-II","ApoE"],2,"ApoC-II nằm trên vỏ hạt Chylomicron và VLDL có vai trò hoạt hóa enzyme Lipoprotein Lipase (LPL) ở màng mao mạch các mô."],["Số phận của acid béo tự do sau khi giải phóng từ thủy phân TG của Chylomicron/VLDL tại tế bào cơ và tế bào mỡ khác nhau như thế nào?",["Tế bào mỡ oxy hóa acid béo tạo năng lượng; Tế bào cơ tích lũy thành hạt mỡ","Tế bào cơ oxy hóa acid béo tạo năng lượng (ATP); Tế bào mỡ tái tổng hợp TG dự trữ trong các hạt mỡ nội bào","Cả hai mô đều chuyển acid béo thành Glucose","Cả hai mô đều biến đổi acid béo thành thể Ceton"],1,"Tế bào cơ thu nhận acid béo để beta-oxy hóa tạo ATP năng lượng; tế bào mỡ thu nhận acid béo để tái tổng hợp Triacylglycerol dự trữ."],["Thụ thể trên bề mặt tế bào gan nhận diện apoprotein nào để thu nhận Chylomicron tàn dư (remnant CM) nhập bào?",["ApoA-I","ApoB-100","ApoE","ApoC-III"],2,"Thụ thể màng tế bào gan nhận diện ApoE trên hạt Chylomicron tàn dư, cho phép hạt tàn dư nhập bào và phóng thích cholesterol thoái hóa tại gan."],["Khi cơ thể hấp thu dư thừa acid béo và Glucose hơn nhu cầu, tế bào Gan sẽ tái tổng hợp thành Triacylglycerol và đóng gói xuất tiết dưới dạng Lipoprotein nào?",["Chylomicron","VLDL (Very Low Density Lipoprotein)","LDL","HDL"],1,"Lượng acid béo và glucose dư thừa tại gan được tổng hợp thành Triacylglycerol, đóng gói và xuất tiết vào máu dưới dạng VLDL."],["Triacylglycerol chiếm tỷ lệ bao nhiêu % trong thành phần cấu tạo của hạt VLDL?",["85%","50%","10%","4%"],1,"VLDL gồm: 50% Triacylglycerol, 10% Protein, 18% Phospholipid, 7% Cholesterol tự do và 12% Cholesteryl ester."],["Glycerol giải phóng từ quá trình thủy phân Triacylglycerol của Chylomicron/VLDL bởi LPL ở mao mạch sẽ được sử dụng theo con đường nào?",["Đào thải hoàn toàn qua nước tiểu","Tế bào mỡ tái sử dụng trực tiếp nhờ enzyme glycerol kinase","Vận chuyển về tế bào gan hoặc các mô có enzyme glycerol kinase để đi vào đường phân, tân tạo đường hoặc tái tổng hợp TG","Chuyển hóa thành muối mật tại ruột"],2,"Glycerol theo dòng máu về tế bào gan (hoặc các mô có glycerol kinase) để tham gia đường phân, tân tạo đường hoặc tái tổng hợp TG."],["Hai nguyên liệu khởi đầu trực tiếp chính để sinh tổng hợp Triacylglycerol trong tế bào là gì?",["Acetyl-CoA và Malonyl-CoA","Glycerol-3-phosphate và Fatty Acyl-CoA","Cholesterol tự do và Mevalonate","Acetoacetate và Succinyl-CoA"],1,"Quá trình tổng hợp Triacylglycerol cần 2 nguyên liệu trực tiếp là Glycerol-3-phosphate và 3 phân tử Fatty Acyl-CoA."],["Sự khác biệt quan trọng nhất về enzyme khởi đầu tổng hợp Glycerol-3-phosphate giữa tế bào Gan và tế bào Mô mỡ là gì?",["Tế bào gan thiếu enzyme Glycerol-3-phosphate dehydrogenase","Tế bào mô mỡ KHÔNG CÓ enzyme Glycerol kinase","Tế bào gan không thể tạo Glycerol-3-phosphate từ DHAP","Tế bào mô mỡ có hoạt tính Glycerol kinase mạnh gấp 10 lần gan"],1,"Tế bào mô mỡ không có enzyme Glycerol kinase, do đó không thể phosphoryl hóa trực tiếp glycerol tự do thành Glycerol-3-phosphate. BỘ 40 CÂU HỎI TRẮC NGHIỆM CHUYỂN HÓA TRIACYLGLYCEROL                                                 CHUYỂN HÓA LIPID"],["Do không có enzyme Glycerol kinase, tế bào Mô mỡ bắt buộc phải tổng hợp Glycerol-3-phosphate từ tiền chất nào của đường phân?",["Pyruvate","Dihydroxyacetone phosphate (DHAP)","Oxaloacetate","Phosphoenolpyruvate"],1,"Ở mô mỡ, Glycerol-3-phosphate bắt buộc phải được tạo thành từ DHAP (sản phẩm đường phân từ Glucose) nhờ enzyme Glycerol-3-phosphate dehydrogenase."],["Enzyme nào xúc tác phản ứng hoạt hóa trực tiếp Glycerol thành Glycerol-3-phosphate tiêu tốn 1 ATP tại tế bào Gan?",["Glycerol kinase","Glycerol-3-phosphate dehydrogenase","Phosphatidate phosphatase","Acyl-CoA synthetase"],0,"Tại gan, Glycerol + ATP -\u003e Glycerol-3-phosphate + ADP nhờ xúc tác của enzyme Glycerol kinase."],["Phản ứng chuyển Dihydroxyacetone phosphate (DHAP) thành Glycerol-3-phosphate trong bào tương sử dụng coenzyme nào?",["NADPH + H+","FADH2","NADH + H+","Biotin"],2,"Phản ứng khử DHAP thành Glycerol-3-phosphate bởi enzyme Glycerol-3-phosphate dehydrogenase tiêu tốn 1 phân tử NADH + H+."],["Trong quá trình tổng hợp Triacylglycerol, hai phân tử Fatty Acyl-CoA lần lượt gắn vào Glycerol-3-phosphate tạo thành hợp chất trung gian nào?",["Diacylglycerol (DAG)","Monoacylglycerol (MAG)","Acid phosphatidic (Phosphatidate)","Lysophosphatidylcholine"],2,"Glycerol-3-phosphate lần lượt nhận 2 gốc Acyl-CoA tại vị trí C1 và C2 để tạo thành Acid phosphatidic (Phosphatidate)."],["Enzyme Phosphatidate phosphatase xúc tác tách nhóm phosphate khỏi Acid phosphatidic để tạo thành sản phẩm trung gian nào?",["Triacylglycerol","Diacylglycerol (DAG)","Monoacylglycerol (MAG)","Glycerol"],1,"Acid phosphatidic tách nhóm Phosphate vô cơ (Pi) nhờ enzyme Phosphatidate phosphatase để tạo thành Diacylglycerol (DAG)."],["Giai đoạn cuối cùng của quá trình sinh tổng hợp Triacylglycerol là phản ứng nào?",["Ester hóa Diacylglycerol (DAG) với phân tử Fatty Acyl-CoA thứ 3","Phosphoryl hóa Diacylglycerol thành Triacylglycerol","Cắt nhóm acyl ở vị trí C2 của Diacylglycerol","Thủy phân Diacylglycerol tạo Triacylglycerol và Glycerol"],0,"Diacylglycerol (DAG) tiếp nhận phân tử Fatty Acyl-CoA thứ 3 (nhờ enzyme DAG acyltransferase) để tạo thành Triacylglycerol hoàn chỉnh."],["Sản phẩm Triacylglycerol sau khi được tổng hợp tại Gan sẽ có số phận như thế nào?",["Tích lũy vĩnh viễn trong tế bào gan","Đóng gói vào các hạt VLDL và tiết vào dòng máu","Thủy phân ngay thành Acetyl-CoA","Đào thải trực tiếp qua dịch mật"],1,"Triacylglycerol tổng hợp tại gan được đóng gói cùng apoB100, cholesterol, phospholipid thành VLDL rồi xuất tiết vào máu."],["Tại tế bào Mô mỡ, Triacylglycerol sau khi tổng hợp xong được cất giữ ở đâu?",["Ti thể tế bào mỡ","Lưới nội bào nhẵn","Các hạt mỡ (giọt mỡ) nội bào","Hệ bạch huyết"],2,"Triacylglycerol tổng hợp tại mô mỡ được tích lũy và dự trữ trong các hạt mỡ nội bào nằm trong bào tương tế bào mỡ."],["Enzyme then chốt chịu trách nhiệm thủy phân Triacylglycerol dự trữ trong mô mỡ giải phóng acid béo tự do khi cơ thể ở trạng thái đói là gì?",["Lipoprotein Lipase (LPL)","Hormone-Sensitive Lipase (HSL)","Lipase tụy","Phospholipase A2"],1,"Hormone-Sensitive Lipase (HSL) là enzyme mấu chốt ở mô mỡ, chịu sự điều hòa của hormone để thủy phân TG thành acid béo và glycerol khi đói."],["Ở trạng thái đói (Glucagon/Adrenaline cao, Insulin thấp), cơ chế hoạt hóa enzyme Hormone-Sensitive Lipase (HSL) trong tế bào mỡ diễn ra như thế nào?",["Tăng nồng độ cAMP -\u003e hoạt hóa Protein Kinase A (PKA) -\u003e phosphoryl hóa hoạt hóa HSL","Giảm nồng độ cAMP -\u003e hoạt hóa Phosphatase -\u003e khử phosphoryl HSL","Gắn trực tiếp Insulin vào HSL","Tăng nồng độ Malonyl-CoA ức chế HSL"],0,"Glucagon/Adrenaline kích thích màng tế bào -\u003e tăng cAMP -\u003e hoạt hóa Protein Kinase A -\u003e phosphoryl hóa hoạt hóa enzyme HSL. BỘ 40 CÂU HỎI TRẮC NGHIỆM CHUYỂN HÓA TRIACYLGLYCEROL                                               CHUYỂN HÓA LIPID"],["Acid béo tự do (FFA) sau khi giải phóng từ mô mỡ vào dòng máu được vận chuyển đến các mô ngoại vi nhờ liên kết với protein nào?",["Hemoglobin","Albumin huyết tương","Globulin","Transferrin"],1,"Acid béo tự do giải phóng vào máu không tan trong nước, phải liên kết với Albumin huyết tương để vận chuyển đến tế bào cơ, gan..."],["Hormone nào có tác dụng ỨC CHẾ sự thủy phân Triacylglycerol ở mô mỡ (giảm giải phóng acid béo tự do vào máu)?",["Glucagon","Adrenaline","ACTH","Insulin"],3,"Insulin làm giảm cAMP và hoạt hóa phosphatase khử phosphoryl của HSL, do đó ức chế mạnh quá trình thủy phân TG ở mô mỡ."],["Tập hợp các hormone nào sau đây làm TĂNG thoái hóa / thủy phân Triacylglycerol ở mô mỡ?",["Insulin, Prostaglandin","Adrenaline, Glucagon, ACTH","Insulin, Estrogen","Prostaglandin, Growth Hormone"],1,"Các hormone kích thích thoái hóa lipid/TG ở mô mỡ gồm: Adrenaline, Glucagon, ACTH (thông qua tăng cAMP)."],["Glycerol giải phóng từ sự thủy phân Triacylglycerol ở mô mỡ khi đói sẽ đi đâu?",["Tế bào mỡ tái sử dụng ngay lập tức thành Glycerol-3-phosphate","Theo máu về Gan để đi vào con đường tân tạo đường (gluconeogenesis) hoặc đường phân","Chuyển hóa thành acid uric ở thận","Đào thải nguyên vẹn qua phổi"],1,"Mô mỡ thiếu glycerol kinase nên glycerol giải phóng sẽ theo máu về gan để tham gia tân tạo đường hoặc đường phân."],["Tỷ lệ cAMP tăng cao trong tế bào mỡ dẫn đến kết quả sinh hóa nào?",["Tăng tổng hợp Triacylglycerol dự trữ","Hoạt hóa HSL, tăng giải phóng acid béo tự do và glycerol vào máu","Ức chế Beta-oxy hóa acid béo","Tăng hoạt tính enzyme Glycerol kinase"],1,"cAMP tăng cao hoạt hóa PKA -\u003e phosphoryl hóa hoạt hóa HSL -\u003e tăng thủy phân TG giải phóng acid béo tự do và glycerol vào máu."],["Hiện tượng khoảng 75% acid béo sinh ra từ quá trình thủy phân TG (ở gan và mô mỡ) được tái tổng hợp trở lại thành Triacylglycerol được gọi là gì?",["Chu trình Krebs","Chu trình Triacylglycerol (TG cycle)","Chu trình Urea","Chu trình Randle"],1,"Chu trình TG ở gan và mô mỡ: 75% acid béo giải phóng được dùng để tái tổng hợp trở lại TG, giúp cơ thể dự trữ năng lượng cho tình huống khẩn cấp."],["Enzyme PEPCK (Phosphoenolpyruvate carboxykinase) tham gia điều hòa tổng hợp Triacylglycerol ở mô mỡ thông qua con đường nào?",["Beta-oxy hóa acid béo","Tân tạo Glycerol-3-phosphate từ Pyruvate (Glyceroneogenesis)","Tổng hợp Cholesterol","Chu trình Pentose Phosphate"],1,"PEPCK xúc tác phản ứng trong tân tạo glucose và tân tạo Glycerol-3-phosphate (từ pyruvate) cung cấp khung glycerol cho tổng hợp TG."],["Tác động của hormone Glucocorticoid lên sự biểu hiện gen PEPCK ở Mô mỡ và ở Gan khác nhau như thế nào?",["Ức chế phiên mã PEPCK ở Mô mỡ, nhưng Kích thích phiên mã PEPCK ở Gan","Kích thích PEPCK ở Mô mỡ, ức chế PEPCK ở Gan","Kích thích PEPCK ở cả Mô mỡ và Gan","Ức chế PEPCK ở cả Mô mỡ và Gan"],0,"Glucocorticoid làm giảm (ức chế) giải mã gen PEPCK ở mô mỡ, nhưng lại làm tăng (kích thích) giải mã gen PEPCK tại tế bào gan."],["Ở bệnh nhân Đái tháo đường type 2 (giảm tác dụng Insulin và tăng Glucocorticoid), nồng độ Acid béo tự do và Triacylglycerol trong máu thay đổi như thế nào?",["Cả Acid béo tự do và Triacylglycerol trong máu đều giảm mạnh","Cả Acid béo tự do và Triacylglycerol trong máu đều TĂNG CAO","Acid béo tự do tăng nhưng Triacylglycerol giảm","Không có sự thay đổi nồng độ lipid máu"],1,"Giảm insulin làm tăng lipolysis ở mô mỡ (tăng FFA máu). Tăng glucocorticoid làm kích thích PEPCK ở gan tăng tổng hợp TG/VLDL -\u003e Cả FFA và TG máu đều tăng cao. BỘ 40 CÂU HỎI TRẮC NGHIỆM CHUYỂN HÓA TRIACYLGLYCEROL                                                CHUYỂN HÓA LIPID"],["Insulin có tác dụng TỨC THỜI nào đối với sự tổng hợp và dự trữ Triacylglycerol ở mô mỡ?",["Kích thích phiên mã gen HSL","Tăng thu nhận Glucose vào tế bào mỡ (cung cấp DHAP tạo Glycerol-3-P) và giảm thủy phân TG","Bất hoạt hoàn toàn enzyme Glycerol-3-phosphate dehydrogenase","Tăng phân giải VLDL ở gan thành LDL"],1,"Tác dụng tức thời của Insulin: tăng thu nhận Glucose vào tế bào mỡ -\u003e tăng tạo DHAP/Glycerol-3-P -\u003e tăng tổng hợp TG và giảm thủy phân TG."],["Tác dụng KÉO DÀI của Insulin đối với chuyển hóa Triacylglycerol là gì?",["Kích thích giải mã/phiên mã các gen mã hóa cho những enzyme của quá trình tổng hợp và dự trữ TG","Bất hoạt gen Acetyl-CoA carboxylase (ACC)","Tăng phá hủy các hạt Chylomicron trong máu","Kích thích thoái hóa mỡ tạo thể Ceton"],0,"Điều hòa kéo dài của Insulin: kích thích giải mã (biểu hiện) các gen mã hóa cho các enzyme phục vụ quá trình tổng hợp và dự trữ Triacylglycerol."],["Khi nồng độ Glucose và Insulin trong máu tăng cao sau bữa ăn giàu Carbohydrate, quá trình chuyển hóa Triacylglycerol diễn ra theo hướng nào?",["Tăng hoạt tính HSL, tăng thủy phân TG mô mỡ giải phóng acid béo","Ức chế tổng hợp VLDL ở gan","Tăng tổng hợp Triacylglycerol dự trữ ở mô mỡ và tăng tổng hợp VLDL ở gan","Chuyển toàn bộ Triacylglycerol thành thể Ceton"],2,"Sau bữa ăn, Insulin cao thúc đẩy thu nhận Glucose, tăng tổng hợp acid béo và Triacylglycerol dự trữ ở mô mỡ, đồng thời tăng tổng hợp VLDL tại gan."]];
const L="ABCD";
let items=[],ans={},done=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function build(shuffle){
  const p=$("part").value;
  const source={shpt:S,seq:SEQ,enzyme:ENZ,hormone:HOR,vitamin:VIT,lipid:LIP,translation:TRN,replication:REP,renal:REN,hepato:HEP,cardiac:CAR,applications:APP,tgP2:TGP2}[p]||D;
  items=source.map((d,i)=>({d,n:i+1})).filter(x=>source!==D||p==="all"||(p==="1"?x.n<=35:x.n>35));
  if(["renal","hepato","cardiac"].includes(p)){
    const positions=items.map((_,i)=>i%4);
    for(let i=positions.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[positions[i],positions[j]]=[positions[j],positions[i]]}
    items=items.map(({d,n},i)=>{
      const correct=d[1][d[2]],distractors=d[1].filter((_,j)=>j!==d[2]);
      for(let j=distractors.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[distractors[j],distractors[k]]=[distractors[k],distractors[j]]}
      const answer=positions[i],options=distractors.slice();
      options.splice(answer,0,correct);
      return {n,d:[d[0],options,answer,d[3]]};
    });
  }
  const titles={shpt:["Ôn tập Kỹ thuật SHPT cơ bản","Dựa trên bài giảng Các kỹ thuật SHPT cơ bản – ThS. BS. Nguyễn Hưng Thịnh (PNT)."],seq:["Ôn tập Kỹ thuật giải trình tự DNA – 40 câu","Bộ câu hỏi về giải trình tự DNA/Gen, Sanger, điện di mao quản và NGS."],enzyme:["Ôn tập Enzyme – 50 câu","Bộ câu hỏi trắc nghiệm chuyên đề Enzyme."],hormone:["Ôn tập Hormone – 50 câu","Bộ câu hỏi trắc nghiệm chuyên đề Hormone."],vitamin:["Ôn tập Vitamin – 50 câu","Bộ câu hỏi trắc nghiệm chuyên đề Vitamin."],lipid:["Ôn tập Hóa học và Chuyển hóa Lipid – 100 câu","Bộ đề ôn tập gồm 50 câu Hóa học Lipid và 50 câu Chuyển hóa Lipid."],translation:["Ôn tập Dịch mã – Sinh tổng hợp protein (Bài 14)","Bộ 70 câu hỏi trắc nghiệm về quá trình dịch mã."],replication:["Ôn tập Nhân đôi và sửa chữa DNA – 50 câu","Bộ câu hỏi về nhân đôi DNA và các cơ chế sửa chữa DNA."],renal:["Ôn tập Hóa sinh mô thận – 70 câu","Bộ câu hỏi trắc nghiệm ôn tập hóa sinh lâm sàng về thận."],hepato:["Ôn tập Hóa sinh gan, mật, tụy – 70 câu","Bộ câu hỏi trắc nghiệm ôn tập hóa sinh lâm sàng về gan, mật và tụy."],cardiac:["Ôn tập Hóa sinh cơ tim – 70 câu","Bộ câu hỏi trắc nghiệm ôn tập hóa sinh lâm sàng về cơ tim."],applications:["Ôn tập Ứng dụng sinh học phân tử – 90 câu","Bộ câu hỏi về ứng dụng SHPT trong bệnh di truyền, bệnh lý nhiễm và ung thư."],all:["Ôn tập Glucide – 70 câu trắc nghiệm","Dựa trên bài giảng Hóa học Glucide và Chuyển hóa Glucide – Th.S Nguyễn Thu Hà (PNT)."],"1":["Ôn tập Glucide – Phần Hóa học","Dựa trên bài giảng Hóa học Glucide – Th.S Nguyễn Thu Hà (PNT)."],"2":["Ôn tập Glucide – Phần Chuyển hóa","Dựa trên bài giảng Chuyển hóa Glucide – Th.S Nguyễn Thu Hà (PNT)."]};
  $("title").textContent="Ôn tập trắc nghiệm";document.title="Ôn tập trắc nghiệm";
  if(shuffle)for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
  ans={};done=false;$("res").className="res";render();
}
function render(){
  const inst=$("inst").checked;
  $("list").innerHTML=items.map((x,k)=>{
    const [q,o,c,e]=x.d,a=ans[x.n],show=done||(inst&&a!==undefined);
    return `<div class="q"><h3><span>Câu ${x.n}.</span> ${esc(q)}</h3>`+o.map((t,i)=>{
      let cl="o";
      if(show){if(i===c)cl+=" ok";else if(i===a)cl+=" no"}else if(i===a)cl+=" sel";
      return `<button class="${cl}" data-n="${x.n}" data-i="${i}"><b>${L[i]}.</b><span>${esc(t)}</span></button>`}).join("")+
      `<div class="ex ${show?"s":""}"><b>Đáp án: ${L[c]}.</b> ${esc(e)}</div></div>`}).join("");
  const n=Object.keys(ans).length;
  $("pg").style.width=(items.length?n/items.length*100:0)+"%";
}
$("list").onclick=e=>{
  const b=e.target.closest(".o");if(!b||done)return;
  const n=+b.dataset.n;
  if($("inst").checked&&ans[n]!==undefined)return;
  ans[n]=+b.dataset.i;render();
};
$("sub").onclick=()=>{
  done=true;let s=0;
  items.forEach(x=>{if(ans[x.n]===x.d[2])s++});
  const t=items.length,un=t-Object.keys(ans).length;
  $("res").innerHTML=`<big>${s}/${t}</big> câu đúng (${Math.round(s/t*100)}%)${un?` · ${un} câu chưa làm`:""}<br>Kéo xuống để xem đáp án và giải thích từng câu.`;
  $("res").className="res s";render();window.scrollTo({top:0,behavior:"smooth"});
};
$("shuf").onclick=()=>build(true);
$("rst").onclick=()=>build(false);
$("part").onchange=()=>build(false);
$("inst").onchange=render;
build(false);
</script>
