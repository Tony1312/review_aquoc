  ["Tiêu chí căn bản nhất để phân biệt Lipid thuần và Lipid tạp là gì?",["Khả năng hòa tan trong dung môi hữu cơ","Thành phần nguyên tố (Lipid thuần chỉ có C, H, O; Lipid tạp có thêm P, N, S...)","Độ dài chuỗi carbon của acid béo","Trạng thái lỏng hay rắn ở nhiệt độ phòng"],1,"Lipid thuần chỉ chứa C, H, O; trong khi Lipid tạp chứa thêm các nguyên tố phi kim khác như P, N, S trong cấu trúc phân tử."],
  ["Đặc điểm cấu tạo nào sau đây là của Acid béo bão hòa (no)?",["Chứa một hoặc nhiều liên kết đôi C=C","Chỉ chứa các liên kết đơn C-C trong chuỗi hydrocarbon","Có vòng benzene trong phân tử","Luôn có chuỗi carbon ngắt nhánh"],1,"Acid béo bão hòa (no) chứa toàn bộ liên kết đơn C-C trong chuỗi carbon, không có liên kết đôi."],
  ["Hormone Progesterone sinh ra từ Cholesterol có chức năng sinh học chính là gì?",["Kiểm soát chu kỳ kinh nguyệt và duy trì thai kỳ","Tăng huyết áp","Thủy phân mỡ ở mô mỡ","Tiêu hóa tinh bột ở ruột"],0,"Progesterone là hormone progestin từ cholesterol có vai trò chuẩn bị niêm mạc tử cung, kiểm soát kinh nguyệt và duy trì thai kỳ."],
  ["Tóm lại, lipid đảm nhận những vai trò sinh học quan trọng nào đối với cơ thể?",["Dự trữ năng lượng và cấu tạo màng tế bào","Dẫn truyền tín hiệu và cách nhiệt bảo vệ","Tham gia thành phần hormone và vitamin","Tất cả các vai trò trên"],3,"Lipid đóng đa vai trò sinh học: dự trữ năng lượng (TG), cấu tạo màng (PL, Cholesterol), tín hiệu (PIP2, Steroid), bảo vệ cách nhiệt (Mỡ, Sáp) và chức năng vitamin."],
  ["Sự tiêu hóa Triacylglycerol chứa acid béo mạch ngắn và trung bình (C < 12) bắt đầu ở đâu?",["Tại miệng nhờ Amylase","Tại Dạ dày nhờ Lipase dạ dày / lưỡi","Tại Ruột già nhờ vi khuẩn","Tại Máu nhờ LPL"],1,"Lipase dạ dày (và lipase lưỡi) hoạt động ở pH acid của dạ dày, chủ yếu thủy phân TG chứa các acid béo mạch ngắn và trung bình (C < 12)."],
  ["Quá trình tiêu hóa lipid diễn ra mạnh mẽ và triệt để nhất tại đoạn nào của ống tiêu hóa?",["Thực quản","Dạ dày","Tá tràng và hổng tràng (ruột non)","Ruột già"],2,"Tiêu hóa lipid diễn ra mạnh mẽ nhất tại tá tràng và hổng tràng nhờ tác dụng nhũ tương hóa của dịch mật và các enzyme tụy."],
  ["Hormone nào do tế bào niêm mạc tá tràng tiết ra kích thích co bóp túi mật và tiết dịch tụy?",["Insulin","Cholecystokinin (CCK)","Glucagon","Secretin"],1,"Thức ăn chứa lipid vào tá tràng kích thích tế bào tại đây tiết Cholecystokinin (CCK), làm co bóp túi mật bơm muối mật và kích thích tụy tiết enzyme."],
  ["Muối mật đóng vai trò quan trọng nhất gì trong sự tiêu hóa và hấp thu lipid ở ruột non?",["Thủy phân liên kết ester của TG","Nhũ tương hóa chất béo tạo hạt micelle hỗn hợp","Hoạt hóa enzyme LCAT trong máu","Đóng gói Chylomicron"],1,"Muối mật phân chia các hạt mỡ lớn thành các hạt mỡ cực nhỏ (nhũ tương hóa), tăng diện tích tiếp xúc cho enzyme lipase tác dụng."],
  ["Enzyme Lipase tụy thủy phân phân tử Triacylglycerol ưu tiên ở những vị trí liên kết ester nào?",["Vị trí C-2","Vị trí C-1 và C-3","Thủy phân đồng thời cả 3 vị trí","Chỉ cắt vị trí C-3"],1,"Lipase tụy thủy phân đặc hiệu liên kết ester ở vị trí C-1 và C-3 của glycerol, tạo sản phẩm chính là 2-monoglyceride và 2 acid béo tự do."],
  ["Enzyme nào của tụy xúc tác phản ứng thủy phân Cholesterol ester thành Cholesterol tự do?",["Lipase","Cholesterol esterase","Phospholipase A2","Isomerase"],1,"Cholesterol esterase do tụy tiết ra cắt gốc acyl giải phóng Cholesterol tự do và acid béo."],
  ["Enzyme Phospholipase A2 xúc tác cắt liên kết ester ở vị trí C-2 của Phospholipid tạo ra sản phẩm gì?",["Lysophospholipid và Acid béo","Glycerol và Phosphat","Sphingosine","Choline tự do"],0,"Phospholipase A2 cắt loại bỏ acid béo ở C-2 của phospholipid, sinh ra Lysophospholipid và acid béo tự do."],
  ["Sản phẩm thủy phân lipid sau khi tái tổng hợp lại trong tế bào biểu mô ruột sẽ đóng gói thành dạng gì?",["VLDL","Chylomicron (CM)","LDL","HDL"],1,"Tế bào biểu mô ruột non tái tổng hợp TG, PL, CE và đóng gói cùng Apolipoprotein tạo thành hạt Chylomicron (CM)."],
  ["Chylomicron (CM) vận chuyển lipid ngoại sinh từ ruột non đi vào hệ thống tuần hoàn qua đường nào?",["Tĩnh mạch cửa về gan trực tiếp","Động mạch chủ","Hệ bạch huyết trung tâm -> Tĩnh mạch dưới đòn trái","Ống mật chủ"],2,"CM kích thước lớn không vào thẳng mao mạch máu mà qua mạch bạch huyết ruột -> ống ngực -> tĩnh mạch dưới đòn trái đi vào máu."],
  ["Lipoprotein lipase (LPL) là enzyme ngoại bào định vị ở đâu?",["Trong lòng ống ruột non","Trong chất nền ti thể tế bào gan","Ở thành mao mạch của mô mỡ, mô cơ tim, cơ xương, tuyến vú","Trong dịch não tủy"],2,"LPL nằm ở bề mặt tế bào nội mạc mao mạch của các mô ngoại vi (mô mỡ, cơ xương, cơ tim, tuyến vú)."],
  ["Apoprotein nào trên hạt CM và VLDL có vai trò hoạt hóa enzyme Lipoprotein lipase (LPL)?",["Apo A-I","Apo B-100","Apo C-II","Apo E"],2,"Apo C-II có vai trò bắt buộc là hoạt hóa Lipoprotein lipase (LPL) để thủy phân TG trong CM và VLDL."],
  ["Loại Lipoprotein nào có kích thước lớn nhất, tỷ trọng thấp nhất và chứa hàm lượng TG cao nhất (85%)?",["VLDL","LDL","HDL","Chylomicron (CM)"],3,"CM là hạt lipoprotein lớn nhất, kém cô đặc nhất (tỷ trọng < 1,006 g/mL) và giàu TG ngoại sinh nhất (85%)."],
  ["Apoprotein liên kết lõi đặc trưng chỉ có ở Chylomicron và Chylomicron tàn dư là gì?",["Apo B-100","Apo B-48","Apo A-I","Apo C-III"],1,"Apo B-48 do tế bào ruột tổng hợp là apoprotein đặc trưng dành riêng cho Chylomicron."],
  ["Thụ thể tế bào gan nhận diện Apoprotein nào trên hạt CM tàn dư (remnant CM) để nhập bào tiêu hủy?",["Apo C-II","Apo E","Apo A-I","Apo B-100"],1,"Tế bào gan có các thụ thể nhận diện Apo E trên CM tàn dư để bắt giữ và nhập bào CM tàn dư."],
  ["Lipoprotein VLDL được tổng hợp tại đâu và mang nhiệm vụ chính là gì?",["Tại Ruột, vận chuyển lipid thức ăn","Tại Gan, vận chuyển Triacylglycerol nội sinh đến mô mỡ và cơ","Tại Thận, đào thải mỡ","Tại Máu, thu nhận cholesterol"],1,"VLDL được tổng hợp tại Gan từ các lipid nội sinh (dư thừa glucose/AB), vận chuyển TG nội sinh đến các mô."],
  ["Apoprotein liên kết lõi chính của VLDL và LDL do gan sản xuất là gì?",["Apo B-48","Apo B-100","Apo A-I","Apo C-I"],1,"Apo B-100 do tế bào gan tổng hợp là apoprotein cốt lõi cấu tạo nên VLDL, IDL và LDL."],
  ["Lipoprotein nào chứa hàm lượng Cholesteryl este cao nhất (37%) và được gọi là 'Cholesterol xấu'?",["HDL","LDL (Low Density Lipoprotein)","VLDL","Chylomicron"],1,"LDL rất giàu cholesterol/cholesteryl ester (37%), vận chuyển cholesterol đến các mô, nếu tăng cao gây lắng đọng mạch máu ('Cholesterol xấu')."],
  ["Sự gia tăng nồng độ LDL-C kết hợp với giảm HDL-C trong máu là yếu tố nguy cơ hàng đầu của bệnh lý nào?",["Viêm gan cấp","Xơ vữa động mạch và bệnh tim mạch","Viêm tụy cấp","Suy thận mạn"],1,"Tăng LDL và giảm HDL làm tăng đọng cholesterol ở thành mạch, gây xơ vữa động mạch và biến chứng tim mạch."],
  ["HDL ('Cholesterol tốt') được tổng hợp ở gan/ruột có vai trò sinh học quan trọng nào?",["Vận chuyển TG từ ruột vào máu","Thu nhận Cholesterol thừa từ các mô ngoại vi vận chuyển về Gan","Đóng gói mỡ vào mô mỡ dự trữ","Gây vữa xơ mạch máu"],1,"HDL thực hiện quá trình vận chuyển ngược cholesterol, dọn dẹp cholesterol thừa ở mô ngoại vi mang về gan xử lý."],
  ["Enzyme LCAT (Lecithin-cholesterol acyltransferase) trên hạt HDL có chức năng gì?",["Thủy phân Triacylglycerol","Este hóa Cholesterol tự do thành Cholesteryl este","Cắt chuỗi acid béo","Bắt giữ VLDL"],1,"LCAT chuyển gốc acyl từ lecithin sang cholesterol tự do để tạo cholesteryl este giấu vào lõi hạt HDL."],
  ["Apoprotein chính của HDL đóng vai trò hoạt hóa enzyme LCAT là gì?",["Apo A-I","Apo B-100","Apo C-II","Apo E"],0,"Apo A-I là apoprotein cấu tạo chính của HDL và là chất hoạt hóa mạnh mẽ enzyme LCAT."],
  ["Quá trình Oxy hóa acid béo (Beta-oxy hóa) ở người diễn ra chủ yếu ở bào quan nào của tế bào?",["Nhân tế bào","Bộ máy Golgi","Ti thể (Mitochondria)","Lưới nội sinh chất hạt"],2,"Các enzyme của quá trình beta-oxy hóa acid béo hầu hết khu trú trong chất nền Ti thể."],
  ["Trước khi vận chuyển vào ti thể, acid béo tự do ở bào tương phải được hoạt hóa thành dạng nào và tốn bao nhiêu ATP?",["Thành Acyl-AMP, tốn 1 ATP","Thành Acyl-CoA, tiêu tốn tương đương 2 ATP","Thành Acetyl-CoA, tốn 3 ATP","Thành Malonyl-CoA, không tốn ATP"],1,"Acid béo được hoạt hóa ở bào tương thành Acyl-CoA nhờ enzyme thiokinase, tiêu tốn năng lượng tương đương 2 ATP (ATP -> AMP + PPi)."],
  ["Enzyme xúc tác phản ứng hoạt hóa Acid béo thành Acyl-CoA là enzyme nào?",["Acyl-CoA synthetase (Thiokinase)","Acetyl-CoA carboxylase","Lipoprotein lipase","HMG-CoA reductase"],0,"Acyl-CoA synthetase (thiokinase) có nhiều ở màng ngoài ti thể và lưới nội sinh chất xúc tác hoạt hóa acid béo."],
  ["Nhóm vận chuyển nào bắt buộc phải tham gia để đưa gốc Acyl trong Acyl-CoA từ bào tương qua màng ti thể vào chất nền ti thể?",["Albumin và Globulin","Carnitine và hệ thống enzym Carnitine acyltransferase (CPT-1 & CPT-2)","Citrate lyase","Biotin và ACC"],1,"Màng trong ti thể không cho Acyl-CoA qua trực tiếp; gốc Acyl phải gắn vào Carnitine nhờ CPT-1 và CPT-2 để vận chuyển vào."],
  ["Enzyme Carnitine acyltransferase I (CPT-1 / CAT-1) định vị tại vị trí nào?",["Trong chất nền ti thể","Ở màng ngoài ti thể","Trong bào tương","Ở nhân tế bào"],1,"CPT-1 (CAT-1) nằm ở màng ngoài ti thể, xúc tác ester hóa Carnitine với Acyl-CoA tạo Acyl-carnitine."],
  ["Mỗi một vòng Beta-oxy hóa acid béo cắt ngắn chuỗi carbon đi bao nhiêu nguyên tử C và giải phóng hợp chất nào?",["Cắt 1 carbon dạng CO2","Cắt 2 carbon dưới dạng 1 phân tử Acetyl-CoA","Cắt 3 carbon dạng Pyruvate","Cắt 4 carbon dạng Acetoacetate"],1,"Một lần beta-oxy hóa xảy ra tại carbon beta kể từ đầu carboxyl, cắt 2 carbon giải phóng 1 phân tử Acetyl-CoA."],
  ["Mỗi vòng Beta-oxy hóa acid béo trải qua 4 phản ứng hóa học và tạo trực tiếp ra các coenzyme khử nào?",["2 NADPH","1 FADH2 và 1 NADH, H+","2 NADH và 1 GTP","1 FMNH2"],1,"Mỗi vòng beta-oxy hóa tạo ra 1 FADH2 (ở phản ứng khử hydro thứ nhất) và 1 NADH, H+ (ở phản ứng khử hydro thứ hai)."],
  ["Khi oxy hóa hoàn toàn 1 phân tử Acid Palmitic (16C) qua Beta-oxy hóa và chu trình Krebs, tổng năng lượng ATP thuần thu được là:",["38 ATP","129 ATP","131 ATP","96 ATP"],1,"7 vòng beta-oxy hóa (14 ATP từ FADH2 + 21 ATP từ NADH) + 8 Acetyl-CoA (96 ATP) - 2 ATP (hoạt hóa) = 129 ATP."],
  ["Chất trung gian Malonyl-CoA đóng vai trò điều hòa Beta-oxy hóa thông qua cơ chế nào?",["Ức chế enzyme CPT-1 làm ngăn Acyl-CoA vào ti thể","Hoạt hóa thiokinase","Ức chế chu trình Krebs","Thủy phân Acetyl-CoA"],0,"Malonyl-CoA sinh ra từ quá trình sinh tổng hợp acid béo sẽ ức chế CPT-1, ngăn cản đưa acid béo vào ti thể để beta-oxy hóa."],
  ["Khi cơ thể ở trạng thái no (nồng độ Insulin trong máu tăng cao), quá trình Beta-oxy hóa thay đổi thế nào?",["Tăng mạnh hiệu suất","Giảm hiệu suất quá trình Beta-oxy hóa (do Insulin hoạt hóa ACC tạo Malonyl-CoA ức chế CPT-1)","Không bị ảnh hưởng","Dừng hẳn chu trình Krebs"],1,"Insulin hoạt hóa ACC làm tăng Malonyl-CoA -> ức chế CPT-1 -> làm giảm hiệu suất quá trình beta-oxy hóa."],
  ["Điểm khác biệt đặc trưng của phản ứng Beta-oxy hóa diễn ra trong Peroxisome so với ti thể là gì?",["Không cắt Acetyl-CoA","Phản ứng khử hydro lần 1 chuyển điện tử đến O2 tạo ra H2O2","Tạo ra 100 ATP","Không cần enzyme"],1,"Beta-oxy hóa trong peroxisome ở phản ứng khử hydro đầu tiên truyền điện tử trực tiếp cho O2 tạo ra độc chất H2O2 (sau đó bị catalase phân hủy)."],
  ["Ba hợp chất được gọi chung là các 'Thể ceton' (Ketone bodies) bao gồm:",["Acetone, Acetoacetate và D-beta-Hydroxybutyrate","Pyruvate, Lactate và Citrate","Palmitate, Stearate và Oleate","Glycerol, Choline và Serine"],0,"Ba thể ceton gồm: Acetone, Acetoacetate và D-beta-Hydroxybutyrate."],
  ["Thể ceton được tổng hợp chủ yếu ở chất nền ti thể của tế bào cơ quan nào?",["Tế bào Cơ xương","Tế bào Gan","Tế bào Não","Tế bào Thận"],1,"Các thể ceton được sinh tổng hợp chủ yếu tại ti thể của tế bào gan từ nguồn Acetyl-CoA dư thừa."],
  ["Vì sao tế bào Gan tổng hợp được thể ceton nhưng KHÔNG THỂ sử dụng thể ceton để tạo năng lượng?",["Do tế bào gan không có ti thể","Do tế bào gan thiếu enzyme Acetoacetate-CoA transferase (Thiophorase)","Do gan không có Glucose","Do thể ceton độc cho gan"],1,"Tế bào gan thiếu enzyme acetoacetate-CoA transferase (thiophorase) nên không thể hoạt hóa acetoacetate thành acetoacetyl-CoA để sử dụng."],
  ["khi oxy hóa hoàn toàn 1 phân tử D-beta-Hydroxybutyrate tại các mô ngoại vi sẽ cung cấp bao nhiêu ATP?",["12 ATP","21,5 ATP","36 ATP","129 ATP"],1,"Một phân tử D-beta-hydroxybutyrate sau khi oxy hóa hoàn toàn ở các mô ngoại vi cho 21.5 ATP."],
  ["Trong điều kiện đói kéo dài hoặc đái tháo đường, yếu tố chính thúc đẩy tăng tổng hợp thể ceton ở gan là:",["Nồng độ Oxaloacetate (OAA) giảm do bị kéo đi tân tạo Glucose làm Acetyl-CoA bị ứ đọng","Nồng độ Insulin tăng quá cao","Thiếu enzyme HMG-CoA synthase","Giảm phân giải mỡ ở mô mỡ"],0,"Khi đói, tế bào thiếu glucose làm tăng tân tạo glucose làm cạn kệt OAA -> Acetyl-CoA từ beta-oxy hóa không vào được Krebs -> dồn sang tạo thể ceton."],
  ["Quá trình sinh tổng hợp Acid béo ở tế bào diễn ra chủ yếu ở đâu?",["Trong chất nền ti thể","Trong Bào tương (Cytosol)","Trong nhân tế bào","Trong lysozyme"],1,"Sinh tổng hợp acid béo xảy ra chủ yếu ở bào tương tế bào (đặc biệt tế bào gan, mô mỡ, tuyến vú)."],
  ["Hệ thống vận chuyển nào đưa Acetyl-CoA từ ti thể ra bào tương để phục vụ tổng hợp acid béo?",["Thoi Carnitine","Hệ thống Citrate lyase (chuyển Citrate ra bào tương)","Thoi Malate-Aspartate","Vẫn chuyển chủ động bơm Na/K"],1,"Acetyl-CoA ngưng tụ với OAA thành Citrate qua màng ti thể ra bào tương, tại đây enzyme Citrate lyase cắt Citrate giải phóng Acetyl-CoA."],
  ["Enzyme mấu chốt (trung tâm) kiểm soát toàn bộ quá trình sinh tổng hợp acid béo là:",["Acyl-CoA synthetase","Acetyl-CoA carboxylase (ACC)","HMG-CoA reductase","Lipase tụy"],1,"ACC xúc tác chuyển Acetyl-CoA thành Malonyl-CoA, là enzyme quyết định và kiểm soát tốc độ tổng hợp acid béo."],
  ["Coenzyme (vitamin) nào là thành phần bắt buộc của enzyme ACC trong phản ứng carboxyl hóa gắn CO2?",["Thiamine (B1)","Biotin (Vitamin B7 / H)","Riboflavin (B2)","Niacin (B3)"],1,"ACC chứa Biotin làm coenzyme mang nhóm CO2 để gắn vào Acetyl-CoA tạo Malonyl-CoA."],
  ["Coenzyme khử nào đóng vai trò cung cấp H+ và điện tử cho các phản ứng khử của phức hợp Acid béo Synthase?",["NADH","NADPH, H+ (chủ yếu từ con đường Pentose Phosphate)","FADH2","FMNH2"],1,"NADPH, H+ sinh ra từ con đường HMP (Pentose Phosphate) cung cấp khử lực cho tổng hợp acid béo."],
  ["Sản phẩm acid béo đầu tiên được tạo ra từ hệ thống sinh tổng hợp Acid béo Synthase ở bào tương là:",["Acid stearic (18C)","Acid Palmitic (16C / Palmitate)","Acid oleic (18C)","Acid arachidonic (20C)"],1,"Phức hợp Acid béo Synthase kéo dài chuỗi C cho đến khi đạt 16 carbon giải phóng ra sản phẩm đầu tiên là Palmitate (Acid Palmitic)."],
  ["Chất nào sau đây đóng vai trò hoạt hóa dị lập thể enzyme Acetyl-CoA carboxylase (ACC)?",["Palmitoyl-CoA","Citrate","Glucagon","AMP"],1,"Citrate nồng độ cao (báo hiệu thừa năng lượng) là chất hoạt hóa dị lập thể dương của ACC."],
  ["Quá trình tổng hợp Cholesterol nội sinh xảy ra chủ yếu tại đâu từ nguyên liệu ban đầu nào?",["Ruột non từ acid béo","Bào tương tế bào Gan từ Acetyl-CoA","Thận từ Amino acid","Cơ từ Glucose"],1,"Tổng hợp Cholesterol diễn ra chủ yếu ở bào tương tế bào gan (70% nhu cầu) từ nguyên liệu ban đầu là Acetyl-CoA."],
  ["Enzyme mấu chốt giữ vai trò quyết định tốc độ tổng hợp Cholesterol trong phản ứng tạo Mevalonate là:",["HMG-CoA synthase","HMG-CoA reductase","LCAT","ACAT"],1,"HMG-CoA reductase xúc tác khử HMG-CoA thành Mevalonate, là enzyme mấu chốt điều hòa tổng hợp Cholesterol."],
  ["Các thuốc hạ mỡ máu dòng Statin (như Atorvastatin, Simvastatin) hạ cholesterol máu theo cơ chế nào?",["Ức chế Lipase tụy","Ức chế cạnh tranh enzyme HMG-CoA reductase","Kích thích CPT-1","Tăng hấp thu mỡ ở ruột"],1,"Statin có cấu trúc tương tự HMG-CoA, ức chế cạnh tranh HMG-CoA reductase làm giảm tổng hợp Cholesterol nội sinh ở gan."],
  ["Enzyme LCAT ester hóa cholesterol ở trong máu, còn enzyme nào thực hiện ester hóa Cholesterol bên trong tế bào gan?",["LCAT","ACAT (Acyl-CoA cholesterol acyltransferase)","Lipase","ACC"],1,"Tại tế bào gan, ACAT chuyển gốc acyl từ Acyl-CoA sang cholesterol để tạo Cholesterol ester dự trữ."],
  ["Tỷ lệ Cholesterol ester / Cholesterol toàn phần (CE/CT) bình thường trong máu là bao nhiêu và thay đổi ra sao khi tổn thương gan?",["Bình thường = 1/3, tăng khi xơ gan","Bình thường = 2/3, tỷ lệ này GIẢM trong bệnh lý tổn thương tế bào gan","Bình thường = 1/2, không đổi","Bình thường = 3/4, tăng khi viêm gan"],1,"Bình thường CE/CT = 2/3 (60-70%). Khi gan bị tổn thương, khả năng ester hóa của gan giảm làm tỷ lệ này giảm xuống."],
  ["Quá trình tổng hợp Triacylglycerol (TG) ở mô mỡ có điểm khác biệt căn bản nào so với tế bào Gan?",["Mô mỡ không tổng hợp được TG","Mô mỡ thiếu enzyme Glycerol kinase nên phải lấy Glycerol-3-phosphate từ DHAP của đường phân","Mô mỡ không cần acid béo","Mô mỡ chỉ tổng hợp Cholesterol"],1,"Mô mỡ không có enzyme Glycerol kinase để hoạt hóa trực tiếp glycerol, nên phải phụ thuộc vào đường phân tạo DHAP -> Glycerol-3-phosphate."]

const TRN=[
  ["Quá trình dịch mã (Translation) trong sinh học tế bào là quá trình:",["Tổng hợp chuỗi polynucleotide RNA từ khuôn mẫu DNA","Tổng hợp chuỗi polypeptide (protein) từ thông tin mã hóa trên phân tử mRNA","Nhân đôi chính xác phân tử DNA trong nhân tế bào","Cắt nối loại bỏ các intron trên phân tử pre-mRNA"],1,"Dịch mã (Translation) là quá trình giải mã thông tin di truyền chứa trong các bộ ba (codon) trên mRNA để tổng hợp chuỗi polypeptide tương ứng."],
  ["Enzyme xúc tác cho phản ứng hoạt hóa amino acid và gắn vào tRNA tương ứng là:",["Peptidyl transferase","Aminoacyl-tRNA Synthetase","RNA Polymerase III","DNA Ligase"],1,"Aminoacyl-tRNA Synthetase nhận biết chính xác từng amino acid và tRNA tương ứng để xúc tác phản ứng hoạt hóa tạo Aminoacyl-tRNA."],
  ["Phản ứng hoạt hóa amino acid đòi hỏi tiêu tốn năng lượng từ phân tử nào và tạo sản phẩm trung gian nào?",["Tiêu tốn GTP, tạo ra GDP + Pi","Tiêu tốn ATP, tạo ra phức hợp trung gian Aminoacyl-AMP và giải phóng Pyrophosphate (PPi)","Tiêu tốn CTP, tạo ra CMP","Tiêu tốn UTP, tạo ra UMP"],1,"Amino acid + ATP -> Aminoacyl-AMP + PPi; sau đó gốc Aminoacyl được chuyển sang đầu 3'-OH của tRNA giải phóng AMP."],
  ["Amino acid được gắn vào vị trí nucleotide nào trên phân tử tRNA?",["Đầu 5'-phosphate của tRNA","Đầu 3'-hydroxyl chứa trình tự CCA bảo tồn của tRNA","Vòng D-loop","Vòng Anticodon"],1,"Tất cả phân tử tRNA đều kết thúc bằng bộ ba CCA ở đầu 3'-OH; nhóm carboxyl của amino acid sẽ gắn vào nhóm 2'-OH hoặc 3'-OH của Adenosine cuối cùng."],
  ["Nhận định nào sau đây là ĐÚNG về bộ ba mở đầu dịch mã trên mRNA?",["UAG mã hóa cho Methionine","UGA mã hóa cho Formyl-methionine","AUG (hoặc đôi khi CUG) mã hóa cho Methionine ở Eukaryote và N-formylmethionine (fMet) ở Prokaryote","UAA mã hóa cho Valine"],2,"Codon mở đầu AUG quy định Methionine ở Eukaryote và N-formylmethionine (fMet) ở Prokaryote."],
  ["Trong tế bào nhân sơ (Prokaryote), amino acid mở đầu đi vào vị trí P của ribosome là:",["Methionine (Met)","N-formylmethionine (fMet)","Valine (Val)","Alanine (Ala)"],1,"Ở Prokaryote, nhóm amine của Methionine khởi đầu được gắn thêm nhóm formyl (-CHO) nhờ enzyme transformylase tạo fMet-tRNAfMet."],
  ["Điểm khác biệt quan trọng về amino acid khởi đầu giữa Eukaryote và Prokaryote là:",["Eukaryote dùng fMet, Prokaryote dùng Met","Eukaryote dùng Methionine không bị formyl hóa (Met-tRNAiMet), Prokaryote dùng N-formylmethionine (fMet-tRNAfMet)","Cả hai đều bắt buộc dùng N-formylmethionine","Eukaryote không cần amino acid mở đầu"],1,"Eukaryote sử dụng tRNAMet khởi đầu đặc biệt mang Methionine không bị formyl hóa (Met-tRNAiMet)."],
  ["Vai trò của vòng đối mã (Anticodon loop) trên phân tử tRNA là:",["Gắn với amino acid ở đầu 3'-OH","Bắt cặp bổ sung và đối song song (antiparallel) với bộ ba mã sao (Codon) trên mRNA","Tương tác với tiểu đơn vị lớn của ribosome","Xúc tác cắt liên kết peptide"],1,"Ba nucleotide của anticodon trên tRNA bắt cặp bổ sung theo nguyên tắc A-U, G-C với codon trên mRNA theo chiều đối song song."],
  ["Thuyết \"Wobble\" (bắt cặp linh hoạt của Crick) giải thích hiện tượng nào?",["Một tRNA có thể nhận biết nhiều hơn một codon nhờ sự bắt cặp không chặt chẽ ở vị trí nucleotide thứ 3 của codon (đầu 3') với vị trí thứ 1 của anticodon (đầu 5')","Sự biến tính của phân tử tRNA ở nhiệt độ cao","Sự cắt nối intron của pre-mRNA","Sự trượt của ribosome gây lệch khung"],0,"Tính linh hoạt (Wobble) ở bazơ thứ 3 của codon giúp tế bào chỉ cần khoảng 30-45 loại tRNA để giải mã toàn bộ 61 codon mã hóa amino acid."],
  ["Tính suy biến (Degeneracy) của mã di truyền có nghĩa là:",["Một codon có thể mã hóa cho nhiều loại amino acid","Nhiều codon khác nhau có thể cùng mã hóa cho một loại amino acid","Mã di truyền thay đổi tùy thuộc vào từng loài vi sinh vật","Mã di truyền gối lên nhau giữa các gen"],1,"Có 61 codon mã hóa cho 20 loại amino acid tiêu chuẩn, do đó hầu hết amino acid (trừ Met và Trp) được mã hóa bởi nhiều hơn 1 codon."],
  ["Hằng số lắng và thành phần tiểu đơn vị của Ribosome ở tế bào nhân sơ (Prokaryote) là:",["Ribosome 80S (gồm 40S và 60S)","Ribosome 70S (gồm tiểu đơn vị nhỏ 30S và tiểu đơn vị lớn 50S)","Ribosome 60S (gồm 20S và 40S)","Ribosome 50S (gồm 16S và 23S)"],1,"Prokaryote sở hữu ribosome 70S, cấu tạo từ hai tiểu đơn vị 30S (nhỏ) và 50S (lớn)."],
  ["Phân tử rRNA nào sau đây nằm trong tiểu đơn vị nhỏ 30S của Ribosome nhân sơ?",["18S rRNA","16S rRNA","23S rRNA","5S rRNA"],1,"Tiểu đơn vị 30S của vi khuẩn chứa phân tử 16S rRNA (dài khoảng 1540 nucleotide) cùng với 21 loại protein S (S1-S21)."],
  ["Các phân tử rRNA nằm trong tiểu đơn vị lớn 50S của Ribosome nhân sơ gồm:",["16S rRNA và 23S rRNA","23S rRNA và 5S rRNA","18S rRNA và 28S rRNA","5.8S rRNA và 28S rRNA"],1,"Tiểu đơn vị 50S chứa 2 phân tử rRNA là 23S rRNA và 5S rRNA cùng 31 loại protein L (L1-L31)."],
  ["Hằng số lắng và các tiểu đơn vị của Ribosome ở tế bào nhân thực (Eukaryote) là:",["Ribosome 70S (gồm 30S và 50S)","Ribosome 80S (gồm tiểu đơn vị nhỏ 40S và tiểu đơn vị lớn 60S)","Ribosome 90S (gồm 45S và 45S)","Ribosome 50S (gồm 20S và 30S)"],1,"Eukaryote có ribosome 80S trong bào tương, gồm tiểu đơn vị 40S (nhỏ) và 60S (lớn)."],
  ["Phân tử rRNA có mặt trong tiểu đơn vị nhỏ 40S của Eukaryote là:",["16S rRNA","18S rRNA","28S rRNA","5.8S rRNA"],1,"Tiểu đơn vị 40S của tế bào nhân thực chứa phân tử 18S rRNA tương đương về mặt tiến hóa với 16S rRNA của nhân sơ."],
  ["Tiểu đơn vị lớn 60S của Eukaryote chứa các phân tử rRNA nào sau đây?",["16S, 23S, 5S rRNA","28S, 5.8S và 5S rRNA","18S và 28S rRNA","16S và 18S rRNA"],1,"Tiểu đơn vị 60S của Eukaryote chứa 3 phân tử rRNA là 28S rRNA, 5.8S rRNA và 5S rRNA."],
  ["Ba vị trí liên kết tRNA trên ribosome theo thứ tự dịch chuyển từ 5' đến 3' trên mRNA là:",["Vị trí P, vị trí A, vị trí E","Vị trí A (Aminoacyl), vị trí P (Peptidyl), vị trí E (Exit)","Vị trí E, vị trí A, vị trí P","Vị trí T, vị trí R, vị trí N"],1,"Ba vị trí chức năng trên ribosome là A (nhận Aminoacyl-tRNA), P (giữ Peptidyl-tRNA) và E (Exit - nơi giải phóng tRNA rỗng)."],
  ["Chức năng chính của vị trí A (Aminoacyl site) trên ribosome là gì?",["Nơi chứa tRNA mang chuỗi polypeptide đang kéo dài","Nơi tiếp nhận và kiểm tra sự bắt cặp đúng của phức hợp aminoacyl-tRNA mới đi vào","Nơi giải phóng tRNA đã bị mất amino acid","Nơi xúc tác gắn mũ 5'-Cap"],1,"Vị trí A là cổng vào chuyên biệt tiếp nhận phức hợp aminoacyl-tRNA mới được đưa tới bởi yếu tố kéo dài EF-Tu/eEF1A."],
  ["Chức năng chính của vị trí P (Peptidyl site) trên ribosome là gì?",["Nơi tiếp nhận aminoacyl-tRNA mới đi vào","Nơi giữ tRNA mang chuỗi peptidyl đang kéo dài (hoặc tRNAMet khởi đầu)","Nơi thoát ra của tRNA tự do","Nơi tháo xoắn cấu trúc hairpin"],1,"Vị trí P chứa tRNA mang chuỗi polypeptide đang phát triển; đây cũng là vị trí duy nhất mà tRNAi khởi đầu đi vào trực tiếp."],
  ["Kênh thoát chuỗi polypeptide (Polypeptide exit tunnel) nằm ở tiểu đơn vị nào của ribosome?",["Tiểu đơn vị nhỏ (30S/40S)","Tiểu đơn vị lớn (50S/60S)","Nằm bên ngoài cấu trúc ribosome","Nằm ở khoảng trống giữa hai tiểu đơn vị"],1,"Kênh thoát dài khoảng 100Å đi xuyên qua tiểu đơn vị lớn (50S ở nhân sơ / 60S ở nhân thực) để đưa chuỗi polypeptide mới tổng hợp ra ngoài."],
  ["Trình tự định vị khởi đầu dịch mã trên mRNA ở vi khuẩn (Prokaryote) được gọi là gì?",["Trình tự Kozak","Trình tự Shine-Dalgarno (giàu purine 5'-AGGAGG-3')","Hộp TATA (TATA box)","Đuôi Poly(A)"],1,"Trình tự Shine-Dalgarno nằm phía trước codon khởi đầu AUG khoảng 8-10 nucleotide trên mRNA vi khuẩn giúp hướng dẫn 30S gắn đúng vị trí."],
  ["Trình tự Shine-Dalgarno trên mRNA vi khuẩn tương tác bắt cặp bổ sung với thành phần nào của Ribosome?",["Đầu 3' của 16S rRNA thuộc tiểu đơn vị 30S","Phân tử 23S rRNA thuộc tiểu đơn vị 50S","Protein S1 thuộc tiểu đơn vị 50S","Phân tử 5S rRNA"],0,"Đầu 3' của 16S rRNA chứa đoạn trình tự bổ sung (5'-CCUCCU-3') tương tác trực tiếp với trình tự Shine-Dalgarno trên mRNA."],
  ["Vai trò quan trọng của yếu tố khởi đầu IF-3 ở Prokaryote là gì?",["Gắn vào vị trí A ngăn tRNA đi vào","Gắn vào tiểu đơn vị 30S (tại vị trí E) để ngăn tiểu đơn vị lớn 50S kết hợp sớm với 30S khi chưa có mRNA và fMet-tRNA","Xúc tác cắt liên kết peptide","Thủy phân ATP"],1,"IF-3 hoạt động như yếu tố chống tái kết hợp (anti-association factor), giữ cho tiểu đơn vị 30S ở dạng tự do để chuẩn bị gắn phức hợp khởi đầu."],
  ["Yếu tố khởi đầu IF-1 ở Prokaryote gắn vào vị trí nào trên tiểu đơn vị 30S?",["Vị trí P","Vị trí E","Vị trí A, ngăn cản các aminoacyl-tRNA khác gắn không đúng vào vị trí A trong giai đoạn khởi đầu","Kênh thoát chuỗi"],2,"IF-1 bịt kín vị trí A của 30S trong quá trình khởi đầu, ép fMet-tRNAfMet đi thẳng vào vị trí P."],
  ["Yếu tố khởi đầu IF-2 ở Prokaryote liên kết với phân tử năng lượng nào và có nhiệm vụ gì?",["Liên kết với ATP, tháo xoắn mRNA","Liên kết với GTP (IF-2/GTP), mang fMet-tRNAfMet đến vị trí P của tiểu đơn vị 30S","Liên kết với CTP, xúc tác cắt intron","Liên kết với UTP, kéo 50S vào"],1,"IF-2 là một GTPase chuyên biệt nhận biết và vận chuyển tRNAMet đã được formyl hóa (fMet-tRNAfMet) vào vị trí P của 30S."],
  ["Phức hợp khởi đầu 30S (30S initiation complex) ở Prokaryote bao gồm các thành phần nào?",["Tiểu đơn vị 30S + mRNA + fMet-tRNAfMet + IF-1 + IF-2/GTP + IF-3","Tiểu đơn vị 50S + mRNA + Met-tRNA","Ribosome 70S + EF-Tu + GTP","30S + 50S + RF1"],0,"Phức hợp khởi đầu 30S đầy đủ gồm tiểu đơn vị 30S, phân tử mRNA, fMet-tRNAfMet cùng với cả 3 yếu tố khởi đầu IF1, IF2-GTP và IF3."],
  ["Sự kiện gì xảy ra ngay khi tiểu đơn vị 50S gắn vào phức hợp khởi đầu 30S ở Prokaryote?",["IF-1 và IF-3 giải phóng, IF-2 thủy phân GTP thành GDP + Pi rồi rời khỏi ribosome để tạo phức hợp 70S hoàn chỉnh","IF-2 gắn chặt mãi mãi vào vị trí P","Phân tử 16S rRNA bị phân hủy","ATP bị thủy phân tạo AMP"],0,"Sự gắn kết của 50S kích thích hoạt tính GTPase của IF-2; GTP bị thủy phân làm IF-1, IF-2/GDP và IF-3 giải phóng khỏi ribosome 70S."],
  ["Sau khi hoàn thành giai đoạn khởi đầu ở Prokaryote, fMet-tRNAfMet nằm ở vị trí nào trên ribosome 70S?",["Vị trí A (đang trống)","Vị trí P","Vị trí E","Đã rời khỏi ribosome"],1,"Phức hợp 70S khởi đầu hoàn chỉnh có fMet-tRNAfMet nằm yên vị tại vị trí P, trong khi vị trí A đang hoàn toàn trống để đón aa-tRNA tiếp theo."],
  ["Phân tử năng lượng nào bị thủy phân trực tiếp trong quá trình lắp ráp phức hợp 70S hoàn chỉnh ở Prokaryote?",["CTP","UTP","GTP (trên IF-2)","TTP"],2,"Thủy phân GTP bởi IF-2 là bước chốt hạ năng lượng để giải phóng các yếu tố IFs và cố định ribosome 70S."],
  ["Yếu tố nào tham gia kiểm tra tính đúng đắn của sự chọn lọc tRNAMet khởi đầu tại vị trí P ở vi khuẩn?",["Sự phối hợp của IF-3 và IF-2","Yếu tố EF-Tu","Yếu tố RF-1","Enzyme Peptidyl transferase"],0,"IF-3 kiểm tra sự bắt cặp codon-anticodon đúng, trong khi IF-2 nhận biết đặc hiệu nhóm formyl trên fMet-tRNAfMet."],
  ["Trình tự đồng thuận xung quanh bộ ba khởi đầu AUG giúp định vị dịch mã ở Eukaryote là gì?",["Trình tự Shine-Dalgarno","Trình tự Kozak (thường là 5'-(gcc)gccRccAUGG-3')","Vùng promoter TATA box","Trình tự nhân đôi oriC"],1,"Ở Eukaryote, trình tự Kozak chứa AUG giúp tiểu đơn vị 40S nhận biết bộ ba mở đầu tối ưu trong quá trình đọc lướt (scanning)."],
  ["Yếu tố eIF-2 ở tế bào nhân thực (Eukaryote) thực hiện vai trò nào sau đây?",["Tháo xoắn cấu trúc bậc hai của mRNA","Phối hợp với GTP (eIF-2/GTP) mang tRNAMet khởi đầu (Met-tRNAiMet) gắn vào tiểu đơn vị 40S","Nhận biết bộ ba kết thúc","Gắn đuôi Poly(A)"],1,"eIF-2 liên kết với GTP và Met-tRNAiMet tạo thành phức hợp ba phần (ternary complex) để đưa đến tiểu đơn vị 40S."],
  ["Phức hợp tiền khởi đầu 43S (43S pre-initiation complex) ở Eukaryote gồm có các thành phần nào?",["Tiểu đơn vị 40S + eIF-1 + eIF-1A + eIF-3 + Phức hợp (eIF-2/GTP/Met-tRNAiMet)","Tiểu đơn vị 60S + eIF-4F + mRNA","Ribosome 80S + eEF-1A + GTP","40S + eIF-5B + 60S"],0,"Phức hợp 43S được lắp ráp trước khi gắn vào mRNA, gồm 40S, eIF1, eIF1A, eIF3 và phức hợp eIF2-GTP-Met-tRNAiMet."],
  ["Phức hợp eIF4F gắn vào đầu 5' m7G-Cap của mRNA nhân thực gồm 3 tiểu đơn vị nào?",["eIF4E (gắn Cap 5'), eIF4A (Helicase tháo xoắn) và eIF4G (protein giàn giáo/scaffold)","eIF1, eIF2 và eIF3","eIF5A, eIF5B và eIF6","eEF1A, eEF1B và eEF2"],0,"eIF4F = eIF4E (Cap-binding) + eIF4A (RNA helicase) + eIF4G (Scaffold protein tương tác với eIF3 và PABP)."],
  ["Yếu tố nào thuộc phức hợp eIF4F trực tiếp liên kết với protein PABP ở đuôi Poly(A) 3' của mRNA?",["eIF4E","eIF4A","eIF4G","eIF4B"],2,"eIF4G có các miền gắn kết đa năng: gắn với eIF4E ở đầu 5', eIF3 trên 40S và gắn trực tiếp với PABP ở đuôi Poly(A) 3'."],
  ["Ý nghĩa sinh học quan trọng nhất của sự tương tác giữa eIF4G (đầu 5') và PABP (đầu 3') là gì?",["Làm uốn cong mRNA tạo cấu trúc vòng (circularization), bảo vệ mRNA khỏi nuclease và tăng cao hiệu suất tái sử dụng ribosome","Cắt bỏ đuôi Poly(A) sau khi dịch mã xong","Ức chế không cho ribosome di chuyển","Biến đổi bộ ba mã hóa thành codon kết thúc"],0,"Mô hình mRNA dạng vòng (circular mRNA) giúp ribosome sau khi kết thúc dịch mã ở đầu 3' nhanh chóng tái khởi đầu ngay ở đầu 5'."],
  ["Quá trình đọc lướt (scanning) của tiểu đơn vị 40S từ đầu 5'-Cap đến bộ ba AUG trên mRNA Eukaryote tiêu tốn năng lượng từ:",["Thủy phân GTP của eIF2","Thủy phân ATP bởi hoạt tính Helicase của eIF4A và eIF4B","Thủy phân CTP","Thủy phân UTP"],1,"eIF4A (cùng với eIF4B) là một ATP-dependent RNA helicase giúp tháo xoắn cấu trúc bậc hai trên vùng 5'-UTR để 40S đọc lướt."],
  ["Hiện tượng dịch mã không phụ thuộc đầu 5'-Cap (Cap-independent initiation) ở Eukaryote xảy ra nhờ cấu trúc nào?",["Trình tự Shine-Dalgarno","Cấu trúc IRES (Internal Ribosome Entry Site)","Đuôi Poly(A)","Mũ 7-methylguanosine"],1,"Cấu trúc IRES trên mRNA cho phép ribosome 40S gắn trực tiếp vào vùng nội bộ mRNA mà không cần nhận biết mũ 5'-Cap."],
  ["Sự dịch mã qua cấu trúc IRES thường được phát hiện trong trường hợp nào sau đây?",["Dịch mã ở vi khuẩn E. coli","Sự nhiễm Picornavirus (như virus Polio) hoặc khi tế bào nhân thực bị stress/apoptosis làm bất hoạt eIF4E","Dịch mã trong ty thể thực vật","Sự tổng hợp glycogen"],1,"Khi bị nhiễm Picornavirus hoặc tế bào đi vào Apoptosis, các enzyme protease cắt đứt eIF4G làm ngưng dịch mã phụ thuộc Cap, lúc này IRES giúp dịch mã ưu tiên các mRNA sinh tồn."],
  ["Sự kết hợp giữa tiểu đơn vị lớn 60S với phức hợp 48S để tạo ribosome 80S hoàn chỉnh ở Eukaryote cần yếu tố nào?",["Yếu tố eIF-5 và eIF-5B (xúc tác thủy phân GTP)","Yếu tố eEF-2","Yếu tố eRF-1","Yếu tố eIF-4E"],0,"eIF-5 hoạt hóa sự thủy phân GTP trên eIF-2, trong khi eIF-5B/GTP xúc tác sự lắp ráp tiểu đơn vị 60S và giải phóng các eIFs."],
  ["Trong giai đoạn kéo dài dịch mã ở Prokaryote, yếu tố nào vận chuyển aminoacyl-tRNA vào vị trí A của ribosome?",["EF-G/GTP","EF-Tu/GTP","EF-Ts","IF-2/GTP"],1,"EF-Tu liên kết với GTP và mang aminoacyl-tRNA đi vào vị trí A của ribosome."],
  ["Cơ chế đọc sửa (Proofreading) ở vị trí A của ribosome nhân sơ diễn ra như thế nào?",["Xảy ra trước khi aa-tRNA tới ribosome","Nếu codon-anticodon bắt cặp ĐÚNG, GTP trên EF-Tu bị thủy phân và EF-Tu/GDP rời đi; nếu SÀI, aa-tRNA bị đẩy ra ngoài trước khi tạo liên kết peptide","Xảy ra sau khi liên kết peptide đã tạo xong","Khi chuỗi polypeptide đã rời khỏi ribosome"],1,"Tốc độ thủy phân GTP của EF-Tu và sự rời đi của EF-Tu/GDP tạo ra khoảng thời gian trễ (accommodation) để ribosome loại bỏ các aa-tRNA bắt cặp sai."],
  ["Yếu tố EF-Ts có vai trò gì trong chu trình kéo dài dịch mã ở Prokaryote?",["Xúc tác tạo liên kết peptide","Tái sinh hoạt tính của EF-Tu bằng cách xúc tác trao đổi GDP thành GTP (EF-Tu/GDP + GTP -> EF-Tu/GTP + GDP)","Tháo rời hai tiểu đơn vị ribosome","Nhận biết codon kết thúc"],1,"EF-Ts đóng vai trò là yếu tố trao đổi guanine nucleotide (GEF), giải phóng GDP khỏi EF-Tu để EF-Tu gắn phân tử GTP mới."],
  ["Enzyme/hoạt tính xúc tác hình thành liên kết peptide giữa hai amino acid trên ribosome được gọi là:",["Aminoacyl-tRNA synthetase","Peptidyl transferase","RNA Polymerase II","Protease"],1,"Peptidyl transferase xúc tác phản ứng chuyển chuỗi peptidyl từ tRNA ở vị trí P sang nhóm amine của amino acid trên tRNA ở vị trí A."],
  ["Bản chất hóa sinh của Peptidyl transferase trong cấu trúc ribosome là gì?",["Một protein enzyme hòa tan trong bào tương","Một Ribozyme (hoạt tính xúc tác nằm ở phân tử rRNA: 23S rRNA ở Prokaryote / 28S rRNA ở Eukaryote)","Một phức hợp đường-protein","Một phân tử tRNA đặc biệt"],1,"Ribosome là một Ribozyme; cấu trúc tinh thể chứng minh trung tâm xúc tác peptidyl transferase chỉ chứa các nucleotide bảo tồn của rRNA mà không có acid amin nào."],
  ["Vùng xúc tác Peptidyl transferase nằm ở vị trí nào trong cấu trúc 23S rRNA của 50S Prokaryote?",["Vòng trung tâm Domain V của 23S rRNA (với vai trò cốt lõi của Adenine 2451)","Đầu 5' của 16S rRNA","Phân tử 5S rRNA","Protein L7/L12"],0,"Domain V của 23S rRNA hình thành trung tâm phản ứng peptidyl transferase (PT center), chứa nucleotide A2451 bảo tồn tuyệt đối."],
  ["Phản ứng hóa học tạo liên kết peptide diễn ra theo cơ chế thế nào?",["Nhóm -COOH của amino acid ở vị trí A tấn công nhóm -NH2 ở vị trí P","Nhóm -NH2 tự do của amino acid ở vị trí A tấn công nucleophile vào nhóm ester carbonyl (-C=O) của peptidyl-tRNA ở vị trí P","Nhóm -OH của ribose tấn công gốc phosphate","Nhóm phosphate tấn công gốc amine"],1,"Đôi điện tử tự do trên nitơ của nhóm alpha-amino ở vị trí A tấn công nucleophile vào cacbon carbonyl của liên kết ester nối chuỗi peptide với tRNA ở vị trí P."],
  ["Quá trình dịch chuyển (Translocation) của ribosome dọc theo mRNA ở Prokaryote được xúc tác bởi yếu tố nào?",["EF-Tu/GTP","EF-G/GTP (dịch chuyển ribosome theo chiều 5' -> 3')","EF-Ts","IF-1"],1,"EF-G (còn gọi là Translocase) gắn vào ribosome và thủy phân GTP để đẩy ribosome dịch chuyển đúng 1 codon dọc theo mRNA."],
  ["Mỗi bước dịch chuyển (Translocation) làm ribosome di chuyển một khoảng bằng bao nhiêu nucleotide trên mRNA?",["1 nucleotide","2 nucleotide","3 nucleotide (đúng bằng 1 bộ ba mã hóa / codon)","6 nucleotide"],2,"Mỗi bước translocase chuyển vị đẩy ribosome tiến về phía đầu 3' của mRNA đúng 3 nucleotide (1 codon)."],
  ["Yếu tố kéo dài eEF1A ở Eukaryote có chức năng tương đương với yếu tố nào ở Prokaryote?",["EF-Ts","EF-Tu (đưa aa-tRNA vào vị trí A)","EF-G","IF-2"],1,"eEF1A ở tế bào nhân thực là homolog hoàn hảo của EF-Tu ở vi khuẩn."],
  ["Yếu tố kéo dài eEF1B ở Eukaryote có chức năng tương đương với yếu tố nào ở Prokaryote?",["EF-Tu","EF-Ts (yếu tố trao đổi GDP thành GTP cho eEF1A)","EF-G","IF-3"],1,"eEF1B thực hiện chức năng tái sinh GTP cho eEF1A tương tự như EF-Ts tái sinh EF-Tu."],
  ["Yếu tố kéo dài eEF2 ở Eukaryote có chức năng tương đương với yếu tố nào ở Prokaryote?",["EF-Tu","EF-Ts","EF-G (xúc tác sự chuyển vị ribosome)","IF-1"],2,"eEF2 ở Eukaryote là translocase chịu trách nhiệm đẩy ribosome chuyển vị tương tự EF-G."],
  ["Hiện tượng mô phỏng hình dạng phân tử (Molecular mimicry) thể hiện rõ nhất giữa EF-G và phức hợp nào?",["Cấu trúc 3D của EF-G/GTP mô phỏng giống hệt phức hợp (EF-Tu / GTP / aminoacyl-tRNA)","EF-G mô phỏng phân tử mRNA","EF-G mô phỏng phân tử 16S rRNA","EF-G mô phỏng mũ 5'-Cap"],0,"Domain IV của EF-G có hình dạng 3D bắt chước hoàn hảo nhánh anticodon của tRNA trong phức hợp EF-Tu-GTP-tRNA để đi vào vị trí A đẩy tRNA đi."],
  ["Tính tổng cộng trong 1 chu kỳ kéo dài gắn thêm 1 amino acid, tế bào tiêu tốn bao nhiêu liên kết cao năng?",["1 GTP","4 liên kết cao năng (2 ATP cho phản ứng hoạt hóa aa + 1 GTP cho EF-Tu/eEF1A + 1 GTP cho EF-G/eEF2)","6 ATP","Không tốn năng lượng"],1,"Hoạt hóa 1 aa tốn 1 ATP -> AMP + 2Pi (tương đương 2 liên kết cao năng); kéo dài tốn 1 GTP ở vị trí A và 1 GTP ở bước chuyển vị = Tổng 4 liên kết cao năng."],
  ["Ngay sau khi xảy ra bước dịch chuyển (Translocation), trạng thái tại các vị trí A, P, E trên ribosome là:",["Vị trí A trống, vị trí P chứa peptidyl-tRNA, vị trí E chứa tRNA tự do sắp giải phóng","Vị trí A chứa peptidyl-tRNA, vị trí P trống","Cả 3 vị trí đều trống","Vị trí E chứa peptidyl-tRNA"],0,"Translocation đẩy peptidyl-tRNA từ A sang P, đẩy tRNA rỗng từ P sang E, để lại vị trí A hoàn toàn sẵn sàng đón aa-tRNA mới."],
  ["Các bộ ba kết thúc (Stop codons / Nonsense codons) phổ biến trên mRNA gồm có:",["UAA (Ochre), UAG (Amber) và UGA (Opal)","AUG, UAA và GUG","UAA, UAC và UGC","UGA, UGG và UGU"],0,"Ba bộ ba kết thúc tiêu chuẩn không mã hóa amino acid nào là UAA, UAG và UGA."],
  ["Ở vi khuẩn (Prokaryote), yếu tố giải phóng RF-1 nhận biết các bộ ba kết thúc nào?",["UAA và UAG","UAA và UGA","Chỉ UGA","UAG và UGA"],0,"RF-1 ở Prokaryote nhận biết hai codon kết thúc là UAA và UAG."],
  ["Ở vi khuẩn (Prokaryote), yếu tố giải phóng RF-2 nhận biết các bộ ba kết thúc nào?",["UAA và UAG","UAA và UGA","Chỉ UAG","AUG và UAA"],1,"RF-2 ở Prokaryote nhận biết hai codon kết thúc là UAA và UGA."],
  ["Điểm khác biệt cốt lõi giữa yếu tố giải phóng ở Eukaryote (eRF-1) so với Prokaryote là gì?",["eRF-1 chỉ nhận biết duy nhất bộ ba UAA","Một phân tử eRF-1 duy nhất có khả năng nhận biết cả 3 bộ ba kết thúc (UAA, UAG và UGA)","eRF-1 là phân tử tRNA đặc biệt","eRF-1 không cần nước để thủy phân"],1,"Ở Eukaryote, eRF-1 là yếu tố giải phóng vạn năng (omnipotent release factor) nhận biết được cả 3 bộ ba kết thúc."],
  ["Trình tự motif amino acid bảo tồn GGQ (Gly-Gly-Gln) trên các yếu tố giải phóng (RF1/RF2/eRF1) có vai trò gì?",["Gắn vào mRNA","Định vị chính xác tại trung tâm Peptidyl transferase để đưa 1 phân tử H2O vào thủy phân liên kết ester giải phóng chuỗi polypeptide","Gắn vào mũ 5'-Cap","Thủy phân ATP"],1,"Motif GGQ mô phỏng amino acid mang phân tử nước đi vào trung tâm Peptidyl transferase kích hoạt phản ứng thủy phân liên kết ester giữa chuỗi peptide và tRNA tại vị trí P."],
  ["Vai trò của yếu tố RF-3 (ở Prokaryote) và eRF-3 (ở Eukaryote) trong giai đoạn kết thúc là gì?",["Tháo xoắn DNA","Là các GTPase hỗ trợ sự gắn kết và xúc tác giải phóng RF1/RF2 (hoặc eRF1) ra khỏi ribosome sau khi chuỗi peptide được cắt","Nối các đoạn Okazaki","Tổng hợp đuôi Poly(A)"],1,"RF-3/eRF-3 liên kết với GTP và thúc đẩy sự rời đi của các yếu tố nhận biết bộ ba kết thúc RF1/RF2/eRF1 sau khi đã giải phóng chuỗi protein."],
  ["Yếu tố tái sử dụng ribosome RRF (Ribosome Recycling Factor) ở vi khuẩn phối hợp với yếu tố nào để tháo rời 70S?",["Yếu tố EF-G/GTP và IF-3","Yếu tố EF-Tu","Yếu tố RF-1","Yếu tố eIF-4E"],0,"RRF đi vào vị trí A, phối hợp với sự chuyển vị của EF-G/GTP để đẩy tRNA rỗng và mRNA ra, sau đó IF-3 gắn vào tách 30S và 50S."],
  ["Kháng sinh Puromycin có cơ chế tác dụng ức chế dịch mã độc đáo như thế nào?",["Ức chế enzyme RNA Polymerase","Cấu trúc 3D mô phỏng đầu 3' của Aminoacyl-tRNA, đi vào vị trí A và gắn vào chuỗi peptidyl tạo Peptidyl-Puromycin gây kết thúc chuỗi sớm","Ức chế quá trình tháo xoắn DNA","Ngăn cản sự tổng hợp ATP"],1,"Puromycin là một chất tương tự tyrosinyl-tRNA; nó đi vào vị trí A, nhận nhóm peptidyl từ vị trí P nhưng không thể tiếp tục kéo dài, làm giải phóng chuỗi peptide dở dang."],
  ["Kháng sinh Tetracycline ức chế quá trình tổng hợp protein ở vi khuẩn bằng cơ chế nào?",["Gắn vào tiểu đơn vị 30S, ngăn cản sự đi vào và gắn của Aminoacyl-tRNA tại vị trí A","Ức chế Peptidyl transferase trên 50S","Phân hủy phân tử mRNA","Ức chế enzyme DNA Gyrase"],0,"Tetracycline gắn vào tiểu đơn vị 30S cản trở vật lý không cho aminoacyl-tRNA mới đi vào vị trí A."],
  ["Kháng sinh Chloramphenicol ức chế quá trình dịch mã ở vi khuẩn qua cơ chế nào?",["Gắn vào tiểu đơn vị 50S và ức chế trực tiếp hoạt tính enzyme Peptidyl transferase","Gắn vào 30S gây đọc sai mã","Ngăn cản sự rời đi của RF-1","Bất hoạt yếu tố IF-2"],0,"Chloramphenicol gắn vào Domain V của 23S rRNA thuộc tiểu đơn vị 50S và ngăn cản phản ứng tạo liên kết peptide."],
  ["Kháng sinh Erythromycin (nhóm Macrolide) gắn vào tiểu đơn vị 50S của vi khuẩn và gây hậu quả gì?",["Bịt kín kênh thoát chuỗi peptide và cản trở sự dịch chuyển (Translocation) của ribosome","Phá hủy màng tế bào vi khuẩn","Cắt đứt sợi mRNA","Ức chế tổng hợp tRNA"],0,"Erythromycin gắn ở đầu kênh thoát chuỗi thuộc tiểu đơn vị 50S, làm ngưng trệ sự chuyển vị của chuỗi peptidyl-tRNA."],
  ["Kháng sinh Streptomycin (nhóm Aminoglycoside) gắn vào tiểu đơn vị 30S của vi khuẩn gây tác động gì?",["Gây biến dạng vị trí A khiến ribosome đọc sai mã (Misreading) hoặc ngăn cản sự hình thành phức hợp khởi đầu","Ức chế Peptidyl transferase","Cắt đuôi Poly(A)","Bất hoạt eEF2"],0,"Streptomycin gắn vào 16S rRNA thuộc 30S làm sai lệch sự kiểm duyệt ở vị trí A, dẫn đến gắn sai amino acid hoặc dịch mã bị ngừng trệ."],
  ["Độc tố Cycloheximide có đặc điểm tác dụng nào sau đây trong nghiên cứu sinh học?",["Ức chế đặc hiệu hoạt tính Peptidyl transferase trên tiểu đơn vị 60S của Eukaryote (không ảnh hưởng đến 50S vi khuẩn)","Ức chế đặc hiệu vi khuẩn nhân sơ","Gắn vào tiểu đơn vị 30S","Ức chế nhân đôi ADN"],0,"Cycloheximide là chất ức chế dịch mã chuyên biệt ở tế bào nhân thực (Eukaryote) bằng cách ngăn chặn sự kéo dài trên tiểu đơn vị 60S."],
  ["Độc tố Bạch hầu (Diphtheria toxin) làm ngừng trệ quá trình dịch mã ở tế bào Eukaryote bằng cơ chế nào?",["Xúc tác phản ứng ADP-ribosyl hóa gốc diphthamide làm bất hoạt vĩnh viễn yếu tố kéo dài eEF2","Bất hoạt EF-Tu của vi khuẩn","Ức chế enzyme RNA Polymerase I","Phân hủy 18S rRNA"],0,"Độc tố Bạch hầu chuyển gốc ADP-ribose từ NAD+ sang gốc diphthamide trên eEF2 làm ngưng hoàn toàn sự chuyển vị dịch mã ở người."],
  ["Yếu tố nào sau đây quyết định hiệu suất và độ chính xác của giai đoạn kết thúc dịch mã?",["Loại bộ ba kết thúc (UAA/UAG/UGA), trình tự nucleotide lân cận phía 3' và 2 amino acid cuối cùng trên chuỗi polypeptide","Độ dài đuôi Poly(A) duy nhất","Số lượng nguyên tử Hydro tự do","Nồng độ ion Na+ trong nội bào"],0,"Hiệu suất kết thúc dịch mã không chỉ dựa vào bộ ba Stop mà còn phụ thuộc vào ngữ cảnh trình tự xung quanh (tetranucleotide context) và cấu trúc đuôi C-terminus của chuỗi peptide."]
