const REP=[
  ["Các base nitơ thuộc nhóm Purine có cấu trúc vòng kép xuất hiện trong thành phần acid nucleic là gì?",["Adenine và Thymine","Adenine và Guanine","Cytosine và Thymine","Cytosine và Uracil"],1,"Nhóm Purine gồm Adenine (A) và Guanine (G) có cấu trúc nhân vòng kép. Nhóm Pyrimidine gồm Cytosine (C), Thymine (T) và Uracil (U) có cấu trúc nhân vòng đơn."],
  ["Trong cấu trúc hóa học của phân tử acid nucleic, thành phần Nucleoside được tạo thành từ:",["Base nitơ + Nhóm Phosphate","Đường pentose (ribose/deoxyribose) + Nhóm Phosphate","Base nitơ + Đường pentose (ribose/deoxyribose)","Base nitơ + Đường pentose + Nhóm Phosphate"],2,"Nucleoside = Base nitơ + Đường pentose. Khi Nucleoside gắn thêm nhóm Phosphate sẽ tạo thành Nucleotide hoàn chỉnh."],
  ["Theo danh pháp sinh hóa, Nucleoside tương ứng với base Purine Hypoxanthine có tên gọi là gì?",["Adenosine","Guanosine","Inosine","Xanthosine"],2,"Base Hypoxanthine kết hợp với đường ribose tạo thành nucleoside tên là Inosine. Adenine -> Adenosine; Guanine -> Guanosine."],
  ["Liên kết hóa học nối liền các nucleotide với nhau tạo nên chuỗi polynucleotide của DNA là liên kết gì?",["Liên kết Peptide","Liên kết 3',5'-phosphodiester","Liên kết Glycosidic","Liên kết Hydrogen"],1,"Các nucleotide liên kết với nhau theo chiều 5' -> 3' thông qua cầu nối liên kết 3',5'-phosphodiester giữa nhóm 3'-OH của đường trước với nhóm 5'-phosphate của nucleotide kế tiếp."],
  ["Theo quy tắc bổ sung Watson-Crick và Chargaff, liên kết hydro giữa các base đối diện trong mạch đôi DNA được thành lập theo tỷ lệ nào?",["A-T bằng 3 liên kết hydro; G-C bằng 2 liên kết hydro","A-T bằng 2 liên kết hydro; G-C bằng 3 liên kết hydro","A-C bằng 2 liên kết hydro; G-T bằng 3 liên kết hydro","A-U bằng 2 liên kết hydro; G-C bằng 3 liên kết hydro"],1,"Cặp A-T liên kết bởi 2 liên kết hydro; Cặp G-C liên kết bởi 3 liên kết hydro. Do đó đoạn DNA giàu G-C có nhiệt độ nóng chảy (Tm) cao hơn."],
  ["Phân tích thành phần base của một phân tử DNA mạch đôi thu được phần trăm nucleotide loại Adenine (A) là 28%. Tỷ lệ phần trăm loại Guanine (G) là bao nhiêu?",["28%","22%","44%","56%"],1,"Theo quy tắc Chargaff: %A = %T = 28%. Suy ra %G = %C = (100% - 28%*2) / 2 = 22%."],
  ["Ở điều kiện sinh lý tế bào, mô hình cấu trúc xoắn đôi B-DNA đặc trưng bởi đặc điểm rãnh chính (Major groove) và rãnh phụ (Minor groove) có ý nghĩa sinh học gì?",["Giúp DNA hòa tan hoàn toàn trong môi trường nước","Cho phép các enzyme và phức hợp protein sao mã/nhân đôi tiếp xúc và nhận biết trình tự base cụ thể","Ngăn cản sự biến tính của DNA khi nhiệt độ tăng cao","Giúp DNA gắn chặt vào màng nhân"],1,"Các rãnh chính và rãnh phụ trên bề mặt xoắn đôi B-DNA lộ ra các nguyên tử của base, tạo điều kiện cho các protein điều hòa (nhân tố phiên mã, enzyme) tiếp xúc nhận biết trình tự cụ thể."],
  ["Đơn vị cấu trúc cơ bản nhất của sợi Chromatin ở sinh vật nhân thực (Nucleosome) có đường kính dạng 'Beads-on-a-string' là bao nhiêu?",["2 nm","10 nm","30 nm","300 nm"],1,"Sợi đơn DNA có đường kính 2 nm. Mức cuộn xoắn thứ nhất dạng 'chuỗi hạt' (Beads-on-a-string) của nucleosome có đường kính 10 nm."],
  ["Thành phần lõi Octamer Histone trong một đơn vị Nucleosome bao gồm các phân tử protein nào?",["2 phân tử H1, 2 phân tử H2A, 2 phân tử H2B, 2 phân tử H3","2 phân tử H2A, 2 phân tử H2B, 2 phân tử H3, 2 phân tử H4","1 phân tử H1, 2 phân tử H2A, 2 phân tử H3, 3 phân tử H4","4 phân tử H3 và 4 phân tử H4"],1,"Lõi Octamer Histone gồm 8 phân tử: 2x(H2A, H2B, H3, H4). Đoạn DNA quấn quanh lõi octamer khoảng 1.65 - 2 vòng."],
  ["Loại Histone nào không nằm trong lõi octamer mà đóng vai trò kẹp khóa (linker histone) giữ ổn định đoạn DNA quấn quanh nucleosome?",["Histone H2A","Histone H2B","Histone H3","Histone H1"],3,"Histone H1 nằm ngoài lõi, liên kết với đoạn DNA nối (linker DNA) để giữ cố định cấu trúc và hỗ trợ cuộn xoắn thành sợi 30 nm."],
  ["Đường kính cuộn xoắn của Nhiễm sắc thể ở kỳ giữa (Metaphase chromosome) đạt mức ngưng kết tối đa là bao nhiêu?",["30 nm","300 nm","700 nm","1400 nm"],3,"Các mức cuộn xoắn Chromatin: DNA trần (2 nm) -> Nucleosome (10 nm) -> Sợi chromatin (30 nm) -> Vòng lặp không ngưng kết (300 nm) -> Vòng lặp ngưng kết (700 nm) -> Nhiễm sắc thể kỳ giữa (1400 nm)."],
  ["Các biến đổi hóa học xảy ra phổ biến trên các đuôi N-tận (N-terminal tails) của protein Histone bao gồm những phản ứng nào?",["Acetyl hóa, Methyl hóa, Phosphoryl hóa, Ubiquitin hóa, ADP-ribosyl hóa","Cắt bỏ peptide mồi và trùng hợp hóa","Thủy phân liên kết disulfide và glycosyl hóa","Biến tính nhiệt và khử cacboxyl"],0,"Các đuôi N-tận nhô ra ngoài của Histone chịu các biến đổi hóa học cải biến di truyền ngoài gen (Epigenetics): Acetyl hóa, Methyl hóa, Phosphoryl hóa, Ubiquitin hóa, ADP-ribosyl hóa để điều hòa giãn/nén chromatin."],
  ["Trong chu kỳ tế bào sinh vật nhân thực, quá trình nhân đôi DNA và tổng hợp Histone diễn ra đồng thời ở pha nào?",["Pha G1","Pha S","Pha G2","Pha M"],1,"Sự nhân đôi DNA và tổng hợp histone diễn ra độc quyền ở pha S (Synthesis phase) của chu kỳ tế bào."],
  ["Trình tự DNA lặp lại đặc trưng cấu tạo nên đầu mút Telomere ở nhiễm sắc thể người có chuỗi nucleotide là gì?",["5'-TATAAT-3'","5'-AGGAGG-3'","5'-TTAGGG-3'","5'-GATC-3'"],2,"Telomere ở người chứa hàng ngàn đoạn lặp lại liên tiếp của trình tự 5'-TTAGGG-3', kết thúc bằng đầu thò đơn 3' G-overhang."],
  ["Cấu trúc đặc biệt hình thành tại đầu mút Telomere nhờ sự bắt cặp Hoogsteen giữa các gốc Guanine tạo nên cấu trúc 4 mạch bền vững được gọi là:",["Zinc finger motif","Guanosine tetraplex (G-quadruplex)","Leucine zipper","Hairpin loop"],1,"Đoạn giàu G ở telomere có khả năng tự bắt cặp Hoogsteen tạo Guanosine tetraplex (G-quadruplex), góp phần hình thành T-loop và D-loop bảo vệ đầu mút NST."],
  ["Đặc điểm hoạt tính của enzyme Telomerase ở các loại tế bào trong cơ thể người là gì?",["Hoạt động mạnh ở tế bào soma, giảm ở tế bào ung thư","Hoạt động mạnh ở tế bào mầm và tế bào ung thư; giảm/bất hoạt ở tế bào soma","Đồng đều ở tất cả các loại tế bào","Chỉ hoạt động ở tế bào hồng cầu chín"],1,"Telomerase duy trì chiều dài telomere hoạt động mạnh ở tế bào mầm sinh dục, tế bào gốc và tế bào ung thư. Ở tế bào soma, telomerase bị suy giảm dẫn đến NST ngắn dần sau mỗi lần phân bào gây lão hóa."],
  ["Vị trí khởi đầu nhân đôi DNA (Origin of replication - Ori) trên phân tử DNA vi khuẩn có đặc điểm cấu tạo nổi bật nào?",["Rất giàu cặp base G-C","Rất giàu cặp base A-T","Chứa nhiều codon kết thúc UAA","Không chứa liên kết phosphodiester"],1,"Vị trí Ori giàu cặp A-T (chỉ có 2 liên kết hydro) giúp lực liên kết giữa 2 mạch yếu hơn, tạo điều kiện thuận lợi cho sự tách mạch đầu tiên."],
  ["Protein nào ở vi khuẩn E. coli nhận biết và gắn trực tiếp vào trình tự Ori để khởi đầu quá trình mở xoắn DNA?",["DnaA (Ori-binding protein)","DNA Polymerase I","DNA Ligase","Topoisomerase"],0,"Protein DnaA gắn vào các đoạn lặp lại tại Ori, gây biến tính vùng giàu A-T lân cận để chiêu mộ phức hợp tháo xoắn."],
  ["Phức hợp Primosome tham gia tháo xoắn và tạo mồi tại chạc tái bản gồm các thành phần protein chính nào ở E. coli?",["DnaA, DnaB, DNA Pol III","DnaB (Helicase), DnaC (gắn Helicase), DnaG (Primase)","SSB, Ligase, Gyrase","DNA Pol I, Pol II, Pol III"],1,"Primosome = DnaB (Helicase tháo xoắn) + DnaC (protein hỗ trợ gắn DnaB) + DnaG (Primase tổng hợp RNA mồi)."],
  ["Protein gắn mạch đơn SSB (Single-Strand Binding protein) đóng vai trò gì tại ngã ba nhân đôi?",["Tổng hợp đoạn mồi RNA","Nối các đoạn Okazaki","Cố định và duy trì 2 mạch đơn DNA ở trạng thái tách rời, ngăn tái kết hợp","Cắt bỏ các nucleotide lắp sai"],2,"SSB phủ lên các mạch đơn DNA ngay sau khi Helicase tháo xoắn, giữ cho 2 mạch không bị xoắn lại và bảo vệ mạch đơn khỏi sự tấn công của nuclease."],
  ["Enzyme Topoisomerase (DNA Gyrase ở vi khuẩn) đóng vai trò quan trọng gì trong quá trình nhân đôi DNA?",["Cắt bỏ đoạn mồi RNA","Giải tỏa lực căng siêu xoắn (supercoiling) phía trước ngã ba nhân đôi do Helicase tháo xoắn gây ra","Gắn dNTP vào đầu 3'-OH","Phát hiện đột biến mất đoạn"],1,"Sự tháo xoắn nhanh của Helicase tạo nên sức căng siêu xoắn dương phía trước chạc tái bản. Topoisomerase cắt tạm thời 1 hoặc 2 mạch DNA để giải tỏa sức căng rồi nối lại."],
  ["Tại sao các enzyme DNA Polymerase bắt buộc phải cần có đoạn mồi (RNA primer) để khởi đầu tổng hợp mạch DNA mới?",["Vì DNA Polymerase không nhận biết được mạch khuôn DNA","Vì DNA Polymerase không thể tự khởi đầu chuỗi polynucleotide mới mà bắt buộc phải gắn dNTP vào nhóm 3'-OH tự do có sẵn","Vì RNA primer cung cấp năng lượng ATP cho phản ứng","Vì RNA mồi giúp phân biệt mạch dẫn đầu và mạch chậm"],1,"DNA Polymerase chỉ có khả năng nối thêm dNTP vào đầu 3'-OH tự do. Do đó Primase (RNA Polymerase) phải tổng hợp đoạn mồi RNA ngắn tạo đầu 3'-OH khởi đầu."],
  ["Tất cả các enzyme DNA Polymerase đều thực hiện tổng hợp mạch polynucleotide mới theo chiều sinh học nào?",["Chiều 3' -> 5'","Chiều 5' -> 3'","Cả hai chiều tùy thuộc vào mạch khuôn","Chiều từ cực dương sang cực âm"],1,"DNA Polymerase chỉ xúc tác phản ứng tấn công ái nhân từ nhóm 3'-OH của chuỗi đang kéo dài vào nhóm 5'-alpha-phosphate của dNTP đi vào, nên chiều tổng hợp luôn là 5' -> 3'."],
  ["Phản ứng kéo dài chuỗi DNA của DNA Polymerase sử dụng chất nền dNTP giải phóng ra sản phẩm phụ là gì?",["AMP và H2O","Pyrophosphate (PPi)","ADP và Pi","GTP và Niacin"],1,"Tách 2 nhóm phosphate dưới dạng Pyrophosphate (PPi). Sự thủy phân PPi thành 2 Pi bởi pyrophosphatase cung cấp động lực nhiệt động học cho phản ứng tổng hợp."],
  ["Mạch dẫn đầu (Leading strand) tại chạc tái bản có đặc điểm tổng hợp nào?",["Tổng hợp gián đoạn tạo thành nhiều đoạn Okazaki","Tổng hợp liên tục theo chiều phát triển của ngã ba nhân đôi (5' -> 3')","Tổng hợp theo chiều 3' -> 5'","Không cần sự tham gia của DNA Polymerase III"],1,"Do mạch khuôn 3'->5' cùng chiều với hướng di chuyển chạc tái bản, mạch con mới được tổng hợp liên tục chiều 5'->3' và chỉ cần 1 đoạn mồi RNA duy nhất ở đầu."],
  ["Mạch đi theo/mạch chậm (Lagging strand) tại chạc tái bản được tổng hợp như thế nào?",["Tổng hợp liên tục theo chiều 5' -> 3'","Tổng hợp gián đoạn thành các đoạn Okazaki ngắn ngược chiều di chuyển chạc tái bản","Không cần đoạn mồi RNA","Chỉ do DNA Polymerase I tổng hợp từ đầu đến cuối"],1,"Do mạch khuôn có chiều 5'->3', mạch mới tổng hợp chiều 5'->3' phải đi ngược hướng chạc tái bản, tạo nên các đoạn Okazaki gián đoạn cần nhiều đoạn mồi RNA."],
  ["Enzyme chịu trách nhiệm chính thực hiện quá trình nhân đôi sơ cấp (tổng hợp chuỗi DNA chính) ở vi khuẩn E. coli là enzyme nào?",["DNA Polymerase I","DNA Polymerase II","DNA Polymerase III","RNA Polymerase II"],2,"DNA Polymerase III là holoenzyme chính thực hiện kéo dài cả mạch dẫn đầu và mạch chậm với tốc độ tổng hợp và tính liên tục (processivity) rất cao."],
  ["DNA Polymerase I ở E. coli sở hữu các hoạt tính xúc tác độc đáo nào sau đây?",["Chỉ có 5'->3' Polymerase","5'->3' Polymerase, 3'->5' Exonuclease (đọc sửa) và 5'->3' Exonuclease (loại mồi)","Chỉ có 3'->5' Exonuclease","Hoạt tính Helicase và Ligase"],1,"DNA Pol I có 3 hoạt tính: (1) 5'->3' polymerase điền khoảng khuyết, (2) 3'->5' exonuclease đọc sửa sai, (3) 5'->3' exonuclease cắt bỏ đoạn mồi RNA phía trước."],
  ["Chức năng sinh học quan trọng nhất của DNA Polymerase I trong quá trình nhân đôi DNA ở vi khuẩn là gì?",["Tháo xoắn phân tử DNA","Loại bỏ các đoạn mồi RNA, điền khoảng khuyết nucleotide DNA và tham gia sửa sai","Gắn protein SSB vào mạch đơn","Tổng hợp đoạn mồi RNA"],1,"Hoạt tính 5'->3' exonuclease của Pol I tiêu hủy mồi RNA trên đoạn Okazaki, đồng thời hoạt tính 5'->3' polymerase điền dNTP bổ sung vào khe khuyết đó."],
  ["Enzyme nào thực hiện phản ứng nối liền khung đường-phosphate giữa các đoạn Okazaki sau khi đoạn mồi RNA đã bị loại bỏ và điền đầy?",["DNA Helicase","DNA Ligase","Primase","Topoisomerase"],1,"DNA Ligase xúc tác tạo liên kết 3',5'-phosphodiester nối đầu 3'-OH của đoạn Okazaki này với đầu 5'-phosphate của đoạn Okazaki liền kề."],
  ["Hoạt tính 3' -> 5' Exonuclease của enzyme DNA Polymerase đóng vai trò trực tiếp trong cơ chế nào?",["Cắt bỏ đoạn mồi RNA","Kiểm tra và sửa sai tức thì (Proofreading) loại bỏ nucleotide lắp sai ngay trong khi tổng hợp","Tháo xoắn mạch đôi","Gắn nhóm methyl vào gốc Adenine"],1,"Khi gắn nhầm một base không bổ sung, DNA Polymerase tạm dừng, lùi lại và dùng hoạt tính 3'->5' exonuclease cắt bỏ nucleotide sai ở đầu 3' trước khi tiếp tục tổng hợp."],
  ["Điểm khác biệt căn bản về thời điểm diễn ra giữa cơ chế Sửa sai tức thì (Proofreading) và Sửa chữa bắt cặp sai (Mismatch Repair - MMR) là gì?",["Proofreading diễn ra hậu nhân đôi; MMR diễn ra đồng thời khi nhân đôi","Proofreading diễn ra đồng thời trong quá trình nhân đôi; MMR diễn ra hậu nhân đôi","Cả hai đều diễn ra trước khi nhân đôi bắt đầu","Cả hai chỉ diễn ra khi tế bào tiếp xúc ánh nắng mặt trời"],1,"Proofreading do chính DNA Pol thực hiện ngay khi đang tổng hợp. MMR là cơ chế quét dọn hậu nhân đôi (post-replication) để sửa những lỗi sót qua khỏi proofreading."],
  ["Trong cơ chế Sửa chữa bắt cặp sai (Mismatch Repair - MMR) ở vi khuẩn, hệ thống enzyme phân biệt mạch gốc ban đầu và mạch mới tổng hợp dựa vào yếu tố nào?",["Mạch gốc có chiều 5'->3', mạch mới có chiều 3'->5'","Mạch gốc được methyl hóa ở gốc Adenine thuộc trình tự 5'-GATC-3'; mạch mới chưa kịp methyl hóa","Mạch mới chứa uracil","Mạch gốc gắn với protein SSB"],1,"Enzyme Dam methylase methyl hóa gốc A trên chuỗi 5'-GATC-3' của mạch gốc. Mạch mới chưa kịp methyl hóa (bán methyl hóa) giúp hệ thống MMR nhận biết mạch có lỗi để cắt sửa."],
  ["Loại enzyme nào thực hiện cắt đứt liên kết N-glycosidic giải phóng base bị hỏng hoặc bất thường (như Uracil) ra khỏi khung đường-phosphate trong cơ chế BER?",["DNA Ligase","Uracil DNA Glycosylase","Excinuclease","Helicase"],1,"Trong cơ chế Sửa chữa cắt xén Base (BER), enzyme DNA Glycosylase (như Uracil DNA Glycosylase) nhận biết và cắt liên kết N-glycosidic giải phóng base hỏng tạo vị trí AP (apurinic/apyrimidinic)."],
  ["Phản ứng Khử amin tự nhiên (Deamination) của nucleotide loại Cytosine trong DNA sẽ chuyển đổi Cytosine thành base nào?",["Thymine","Uracil","Adenine","Hypoxanthine"],1,"Cytosine bị khử nhóm amino (-NH2) biến thành Uracil (U). Uracil là base không thuộc DNA nên bị Uracil DNA Glycosylase phát hiện và loại bỏ dễ dàng."],
  ["Tại sao phản ứng khử amin của 5-methylcytosine lại đặc biệt nguy hiểm và tạo nên 'điểm nóng' đột biến gen (CpG mutation hotspot)?",["Vì 5-methylcytosine biến đổi thành Uracil","Vì 5-methylcytosine bị khử amin tạo thành Thymine (T) - một base chuẩn của DNA nên hệ thống sửa sai không nhận biết được","Vì 5-methylcytosine làm đứt gãy khung phosphodiester","Vì phản ứng này làm mất hoàn toàn đường deoxyribose"],1,"5-methylcytosine bị deamination biến thành Thymine (T). Do T là base tự nhiên của DNA, tế bào không thể phân biệt mạch nào sai, tạo nên điểm nóng đột biến 5'-mCpG-3' chiếm >30% đột biến đơn base di truyền."],
  ["Tia cực tím (UV) chiếu vào tế bào thường gây nên loại tổn thương DNA đặc trưng nào kích hoạt cơ chế Sửa chữa cắt xén Nucleotide (NER)?",["Mất gốc Purine (AP site)","Khử amin của Adenine","Nhị hợp Thymine (Thymine dimer / Pyrimidine dimer)","Đứt gãy hai mạch đôi"],2,"Tia UV làm hai gốc Thymine liền kề trên cùng một mạch gắn kềnh càng với nhau tạo nhị hợp Thymine (Thymine dimer), làm biến dạng đường xoắn kép DNA."],
  ["Trong cơ chế Sửa chữa cắt xén Nucleotide (NER), phức hợp nuclease đặc hiệu (Excinuclease) thực hiện thao tác cắt như thế nào?",["Cắt duy nhất liên kết N-glycosidic của base hỏng","Cắt liên kết phosphodiester ở hai phía tạo một đoạn oligonucleotide ngắn (~30 nucleotide) chứa tổn thương rồi loại bỏ","Cắt đứt hoàn toàn cả 2 mạch DNA","Cắt bỏ Histone H1"],1,"Excinuclease cắt khung phosphodiester ở hai đầu cách tổn thương một khoảng, giải phóng đoạn đơn oligonucleotide ngắn (khoảng 30 nucleotide chứa dimer), sau đó DNA Pol beta/delta/epsilon và Ligase sửa chữa."],
  ["Bệnh di truyền Khô sắc tố da (Xeroderma pigmentosum - XP) ở người có nguyên nhân do đột biến gen liên quan đến cơ chế sửa chữa nào?",["Sửa chữa bắt cặp sai (MMR)","Sửa chữa cắt xén Nucleotide (NER)","Sửa chữa trực tiếp bởi Photolyase","Sửa chữa đứt gãy hai mạch"],1,"Bệnh nhân XP bị khiếm khuyết các gen trong con đường NER, không thể sửa chữa nhị hợp Thymine do tia UV, dẫn đến da cực kỳ nhạy cảm với ánh nắng và nguy cơ ung thư da tăng >1000 lần."],
  ["Hội chứng Werner (Werner's syndrome) đặc trưng bởi sự lão hóa non (lão hóa sớm nghiêm trọng) có nguyên nhân di truyền do đột biến gen mã hóa cho enzyme nào?",["DNA Polymerase I","DNA Helicase","RNA Polymerase II","Uracil DNA Glycosylase"],1,"Hội chứng Werner xuất phát từ đột biến gen mã hóa enzyme DNA Helicase (họ RecQ), làm tổn thương quá trình duy trì telomere và tái bản làm tế bào lão hóa rất nhanh."],
  ["Hội chứng Bloom (Bloom syndrome) gây nhạy cảm ánh nắng, suy giảm miễn dịch và tăng nguy cơ ung thư di truyền do đột biến gen mã hóa enzyme nào?",["DNA Helicase","DNA Ligase","Topoisomerase I","Primase"],0,"Hội chứng Bloom do đột biến gen BLM mã hóa cho DNA Helicase thuộc gia đình RecQ helicase, gây mất ổn định nhiễm sắc thể nghiêm trọng."],
  ["Bệnh di truyền Ataxia telangiectasia (hội chứng giãn mạch - thất công) làm bệnh nhân nhạy cảm đặc biệt với tia X và tăng nguy cơ ung thư vú xuất phát từ nguyên nhân nào?",["Thiếu hụt vitamin B12","Tổn thương hệ thống nhận biết và sửa chữa đứt gãy DNA do tia X","Tăng quá mức hoạt tính telomerase","Đột biến gen tổng hợp Histone H2A"],1,"Ataxia telangiectasia do đột biến gen ATM (serine/threonine kinase), vốn đóng vai trò phát hiện đứt gãy đôi DNA do bức xạ ionizing (tia X) để dừng chu kỳ tế bào sửa chữa."],
  ["Hội chứng Cockayne (Cockayne syndrome) làm bệnh nhân nhạy cảm với ánh nắng mặt trời và chậm phát triển có nguyên nhân do tổn thương hệ thống nào?",["Quá trình dịch mã ở ribosome","Ảnh hưởng đồng thời của quá trình sao mã (transcription) và sửa chữa DNA (TC-NER)","Sự tổng hợp quá mức chuỗi poly(A)","Thiếu hụt enzyme amylase"],1,"Cockayne syndrome do khiếm khuyết trong cơ chế sửa chữa cắt xén nucleotide liên kết với sao mã (Transcription-Coupled NER - TC-NER), khiến RNA Polymerase bị mắc kẹt khi gặp tổn thương."],
  ["Hội chứng Suy tủy xương bẩm sinh (Fanconi anemia) có đặc điểm nhạy cảm với tác nhân nào và suy giảm chức năng gì?",["Nhạy cảm với tia X và ánh nắng; suy giảm con đường sửa chữa tổn thương liên kết chéo DNA","Nhạy cảm với đường glucose; tăng tổng hợp mỡ","Không thể hấp thu sắt ở ruột","Mất hoàn toàn cấu trúc nucleosome"],0,"Fanconi anemia do đột biến các gen thuộc con đường FA repair, chịu trách nhiệm sửa chữa các liên kết chéo giữa hai mạch DNA (interstrand crosslinks), làm tăng nguy cơ suy tủy và ung thư máu."],
  ["Thành phần RNA có trong enzyme Telomerase (Ribonucleoprotein) đóng vai trò gì trong việc kéo dài đầu mút Telomere?",["Làm mồi cho DNA Polymerase I","Làm khuôn mẫu RNA (RNA template) mang trình tự bổ sung để tổng hợp chuỗi DNA lặp lại (TTAGGG)n","Cắt bỏ các nucleotide bị hỏng","Tháo xoắn vi thể"],1,"Telomerase là enzyme phiên mã ngược đặc biệt mang sẵn một đoạn khuôn mồi RNA (như 3'-CAAUCCCAAUC-5'), giúp tổng hợp kéo dài mạch thò 3' G-overhang của telomere."],
  ["Khái niệm 'Bán bảo tồn' (Semi-conservative) trong quá trình nhân đôi DNA có nghĩa là gì?",["Mỗi phân tử DNA con tạo thành chứa cả 2 mạch hoàn toàn mới","Mỗi phân tử DNA con gồm 1 mạch cũ của phân tử mẹ và 1 mạch mới được tổng hợp","Phân tử DNA mẹ được giữ nguyên vẹn, 1 phân tử mới hoàn toàn được tạo ra","Chỉ có 50% số gen trên DNA được nhân đôi"],1,"Nguyên tắc bán bảo tồn: 2 mạch đơn của DNA mẹ tách nhau ra làm khuôn, mỗi phân tử DNA con tạo thành sở hữu 1 mạch gốc ban đầu và 1 mạch mới tổng hợp."],
  ["Một đoạn DNA mạch đôi có 3000 nucleotide, trong đó số nucleotide loại Adenine chiếm 20%. Số liên kết Hydro của đoạn DNA này là bao nhiêu?",["3600","3900","3000","4200"],1,"N = 3000 nt. %A = %T = 20% -> A = T = 600. %G = %C = 30% -> G = C = 900. Số liên kết Hydro H = 2A + 3G = 2*600 + 3*900 = 1200 + 2700 = 3900."],
  ["Sự tổng hợp đoạn mồi RNA (RNA primer) được thực hiện bởi enzyme Primase. Bản chất của Primase là loại enzyme nào?",["DNA Polymerase phụ thuộc DNA","RNA Polymerase phụ thuộc DNA","Exonuclease 3'->5'","DNA Ligase"],1,"Primase là một RNA Polymerase đặc biệt xúc tác tổng hợp chuỗi oligo-ribonucleotide ngắn sử dụng mạch đơn DNA làm khuôn mẫu."],
  ["Khi xuất hiện đột biến hỏng gen mã hóa cho enzyme DNA Ligase ở vi khuẩn, hiện tượng nào sau đây sẽ quan sát thấy tại chạc tái bản?",["Quá trình tháo xoắn dừng lại ngay lập tức","Mạch dẫn đầu không thể tổng hợp","Các đoạn Okazaki trên mạch chậm được tổng hợp nhưng không thể nối liền với nhau","Tế bào bị mất hoàn toàn histone"],2,"DNA Ligase nối các khoảng khuyết liên kết phosphodiester giữa các đoạn Okazaki. Thiếu Ligase làm các đoạn Okazaki tích lũy gián đoạn không nối liền lại được."],
  ["Tỷ lệ sai sót ngẫu nhiên của quá trình nhân đôi DNA ở sinh vật nhân thực giảm xuống cực thấp (chỉ khoảng 1 lỗi trên 10^9 - 10^10 base) là nhờ sự phối hợp của những cơ chế nào?",["Chọn lọc dNTP chính xác + Sửa sai tức thì (Proofreading) + Sửa chữa bắt cặp sai (MMR)","Tác động của ánh nắng mặt trời và nhiệt độ","Hoạt động của Histone H1 và Telomerase","Chỉ dựa duy nhất vào enzyme DNA Ligase"],0,"Độ chính xác phi thường của nhân đôi DNA đạt được nhờ 3 lớp bảo vệ: (1) Tính lựa chọn base bổ sung của DNA Pol, (2) Khả năng sửa sai tức thời 3'->5' exonuclease (proofreading), (3) Hệ thống sửa chữa bắt cặp sai (MMR) hậu nhân đôi."]
];
const REN=[
  ["Đơn vị cấu trúc và chức năng cơ bản của thận là gì?",["Nephron","Cầu thận (Glomerulus)","Ống lượn gần","Tháp thận (Renal pyramid)"],0,"Nephron là đơn vị cấu trúc và chức năng cơ bản của thận, bao gồm cầu thận và hệ thống ống thận."],
  ["Thận được chia thành hai vùng giải phẫu chính là gì?",["Vỏ (Cortex) và Tủy (Medulla)","Bể thận và Đài thận","Nhu mô và Xoang thận","Tháp thận và Cột thận"],0,"Cấu trúc thận gồm 2 vùng rõ rệt: Vỏ thận (Cortex) ở bên ngoài và Tủy thận (Medulla) ở bên trong."],
  ["Chức năng sinh lý nào sau đây KHÔNG phải là chức năng chính của thận?",["Lọc các chất thải như urea, amoniac vào nước tiểu","Tổng hợp mật để nhũ tương hóa lipid","Điều hòa cân bằng điện giải, acid-base và huyết áp","Sản xuất các hormone như Erythropoietin, Renin, Vitamin D"],1,"Tổng hợp mật để nhũ tương hóa lipid là chức năng của gan, không phải của thận."],
  ["Hormone Erythropoietin do thận tiết ra có vai trò sinh học chính là gì?",["Kích thích tủy xương sản xuất hồng cầu","Điều hòa huyết áp qua hệ thống RAAS","Tăng tái hấp thu Ca2+ tại ruột","Tăng tái hấp thu nước ở ống góp"],0,"Erythropoietin (EPO) do tế bào quanh ống thận tiết ra khi thiếu oxy, có vai trò kích thích tủy xương sản xuất hồng cầu."],
  ["Enzyme 1-alpha-hydroxylase ở thận tham gia vào quá trình nào?",["Tổng hợp Creatine","Bổ sung nhóm hydroxyl tạo dạng Calcitriol 1,25-(OH)2-D3 có hoạt tính mạnh nhất","Chuyển Angiotensinogen thành Angiotensin I","Khử amin glutamate tạo amoniac"],1,"Tại thận, enzyme 1-alpha-hydroxylase gắn nhóm -OH vào vị trí C1 của 25-hydroxyvitamin D3 để tạo Calcitriol (1,25-(OH)2-D3) là dạng hoạt tính sinh học mạnh nhất."],
  ["Quá trình tân tạo đường (Gluconeogenesis) ở thận diễn ra chủ yếu ở vùng nào?",["Tủy thận","Vỏ thận","Bể thận","Quai Henle"],1,"Các enzyme mấu chốt của tân tạo đường (Pyruvate carboxylase, PEPCK, F-1,6-BPase, G-6-Pase) nằm chủ yếu ở tế bào vỏ thận."],
  ["Tại sao tế bào tủy thận KHÔNG thể giải phóng Glucose tự do vào tuần hoàn?",["Do thiếu enzyme Glucose-6-phosphatase","Do thiếu enzyme Hexokinase","Do thiếu enzyme Pyruvate kinase","Do không có nguồn Glycogen dự trữ"],0,"Tế bào tủy thận thiếu enzyme Glucose-6-phosphatase nên dù có thể đường phân nhưng không thể thủy phân G6P thành Glucose tự do để giải phóng vào máu."],
  ["Nguồn năng lượng chính cho tế bào tủy thận hoạt động là gì?",["Đường phân kỵ khí tạo ra lactate","Oxy hóa acid béo hiếu khí","Thoái hóa thể ceton","Oxy hóa trực tiếp Creatine"],0,"Tủy thận ở trong môi trường thiếu oxy tương đối nên ưu thế sử dụng đường phân kỵ khí từ Glucose tạo ra Lactate."],
  ["Trong tình trạng nhiễm toan chuyển hóa mãn tính, sự bài tiết chất nào tại thận gia tăng thích nghi?",["Amoniac (NH3/NH4+)","Urea","Creatinine","Acid uric"],0,"Nhiễm toan chuyển hóa kích thích tế bào ống thận tăng khử amin Glutamine tạo NH3, gắn H+ tạo NH4+ bài tiết vào nước tiểu để thải bớt H+."],
  ["Giai đoạn 1 của quá trình tổng hợp Creatine diễn ra tại cơ quan nào và nhờ enzyme nào?",["Tại Thận nhờ enzyme AGAT","Tại Gan nhờ enzyme GAMT","Tại Cơ nhờ enzyme CK","Tại Thận nhờ enzyme GAMT"],0,"Giai đoạn 1 diễn ra ở Thận: Arginine + Glycine -> Guanidinoacetic acid + Ornithine dưới tác dụng của enzyme AGAT."],
  ["Giai đoạn 2 của quá trình tổng hợp Creatine diễn ra tại đâu và cần chất cho nhóm methyl nào?",["Tại Thận, cần Choline","Tại Gan, cần S-adenosylmethionine (SAM) và enzyme GAMT","Tại Cơ, cần ATP","Tại Lách, cần Folic acid"],1,"Giai đoạn 2 diễn ra ở Gan: Guanidinoacetic acid nhận nhóm -CH3 từ SAM nhờ enzyme GAMT tạo thành Creatine."],
  ["Lượng Creatine trong cơ thể tập trung nhiều nhất ở đâu?",["95% ở cơ vân","50% ở gan","80% ở thận","90% ở não"],0,"Sau khi được tổng hợp ở gan và thận, Creatine theo máu đến lưu trữ chủ yếu ở cơ vân (chiếm khoảng 95%)."],
  ["Creatinine được tạo thành từ sự thoái hóa phi enzym bất thuận nghịch của chất nào?",["Phosphocreatine (2.6%/ngày) và Creatine (1.1%/ngày)","Urea (5%/ngày)","Arginine (10%/ngày)","Protein huyết tương (1%/ngày)"],0,"Creatinine là sản phẩm thoái hóa nội sinh liên tục, mất nước phi enzym từ Phosphocreatine (2.6%/ngày) và Creatine (1.1%/ngày)."],
  ["Nồng độ Creatinine máu nội sinh phụ thuộc chủ yếu vào yếu tố nào?",["Khối lượng cơ của cơ thể","Chế độ ăn nhiều đạm","Mức độ thoái hóa protein khẩu phần","Lượng nước uống hàng ngày"],0,"Tốc độ tạo Creatinine nội sinh là hằng định và tỷ lệ thuận trực tiếp với khối lượng cơ thể, không phụ thuộc chế độ ăn."],
  ["Chất nào được coi là 'tiêu chuẩn vàng' để đo độ lọc cầu thận (GFR) vì được lọc tự do, không tái hấp thu cũng không bài tiết ở ống thận?",["Inulin","Creatinine","Urea","Glucose"],0,"Inulin là chất ngoại sinh được lọc tự do qua cầu thận, không bị ống thận tái hấp thu hay bài tiết, do đó Clearance Inulin = GFR (~120 mL/phút)."],
  ["Nếu chỉ số bài tiết phân đoạn FE (Fractional Excretion) của một chất X có giá trị FE < 1.0, điều đó có nghĩa là gì?",["Chất X được tái hấp thu ròng tại ống thận","Chất X được bài tiết ròng tại ống thận","Chất X không được lọc qua cầu thận","Chất X bị phân hủy hoàn toàn tại cầu thận"],0,"FE = Cx / GFR. Khi FE < 1.0, lượng bài tiết ra nước tiểu ít hơn lượng lọc, chứng tỏ chất đó có sự tái hấp thu ròng ở ống thận."],
  ["Công thức Cockcroft-Gault dùng để ước tính độ thanh thải creatinine dựa trên các thông số nào?",["Tuổi, cân nặng, Creatinine serum, giới tính (nhân 0.85 cho nữ)","Chiều cao, diện tích da","Chỉ số BUN và Albumin","Tuổi và nồng độ Inulin máu"],0,"Cockcroft-Gault: ClCr = [(140 - Tuổi) x Cân nặng (kg)] / [72 x Cr_serum (mg/dL)], nếu là nữ nhân thêm 0.85."],
  ["Thể tích nước tiểu bình thường ở người trưởng thành trong 24 giờ là bao nhiêu?",["1500 - 2000 mL/24h","500 - 800 mL/24h","3000 - 4000 mL/24h","100 - 300 mL/24h"],0,"Lượng nước tiểu bình thường ở người lớn dao động từ 1500 đến 2000 mL/24 giờ."],
  ["Tình trạng Thiểu niệu (Oliguria) được định nghĩa khi thể tích nước tiểu 24h là bao nhiêu?",["< 500 mL/24h","< 100 mL/24h","> 2000 mL/24h","< 1000 mL/24h"],0,"Thiểu niệu (Oliguria) là khi lượng nước tiểu giảm xuống dưới 500 mL/24h (gặp trong sốt, mất nước, viêm thận cấp...)."],
  ["Tình trạng Vô niệu (Anuria) được xác định khi lượng nước tiểu 24h giảm xuống mức nào?",["< 100 mL/24h","< 500 mL/24h","< 1000 mL/24h","0 mL tuyệt đối"],0,"Vô niệu (Anuria) được định nghĩa là lượng nước tiểu < 100 mL/24h, thường do suy thận cấp nặng hoặc tắc nghẽn đường tiết niệu hoàn toàn."],
  ["Ở điều kiện bình thường, pH của nước tiểu có giá trị trong khoảng nào và do hệ đệm muối nào quyết định?",["pH = 5.3 - 6.8 do hiện diện của NaH2PO4 và KH2PO4","pH = 7.35 - 7.45 do hệ đệm Bicarbonate","pH = 8.0 - 9.0 do Amoniac","pH = 3.0 - 4.0 do Acetoacetate"],0,"Nước tiểu bình thường có tính acid nhẹ (pH 5.3 - 6.8) nhờ sự có mặt của các muối dihydrogen phosphate (NaH2PO4, KH2PO4)."],
  ["Chế độ ăn giàu thịt và protein sẽ làm thay đổi pH nước tiểu như thế nào?",["Làm nước tiểu nghiêng về tính acid hơn (pH giảm)","Làm nước tiểu nghiêng về tính kiềm hơn (pH tăng)","Không làm thay đổi pH nước tiểu","Làm nước tiểu trung tính hoàn toàn = 7.0"],0,"Ăn nhiều thịt/protein tạo ra nhiều sản phẩm chuyển hóa dạng acid (sulfate, phosphate) làm nước tiểu tăng tính acid."],
  ["Tỷ lệ phân bố nước trong cơ thể giữa Dịch nội bào (ICF) và Dịch ngoại bào (ECF) là bao nhiêu?",["ICF chiếm 2/3, ECF chiếm 1/3 tổng lượng nước cơ thể","ICF chiếm 1/3, ECF chiếm 2/3","ICF chiếm 1/2, ECF chiếm 1/2","ICF chiếm 3/4, ECF chiếm 1/4"],0,"Nước trong cơ thể chia làm 2 khu vực chính: Dịch nội bào (ICF) chiếm 2/3 và Dịch ngoại bào (ECF) chiếm 1/3."],
  ["Dịch ngoại bào (ECF) tiếp tục được chia thành hai thành phần nào với tỷ lệ tương ứng ra sao?",["Dịch kẽ (3/4) và Dịch nội mạch/Huyết tương (1/4)","Dịch kẽ (1/2) và Dịch bạch huyết (1/2)","Dịch não tủy (3/4) và Huyết tương (1/4)","Dịch mô (1/3) và Dịch khớp (2/3)"],0,"Dịch ngoại bào ECF bao gồm dịch kẽ (interstitial fluid) chiếm 3/4 và dịch nội mạch (plasma) chiếm 1/4."],
  ["Cation chính quyết định áp lực thẩm thấu của Dịch ngoại bào (ECF) là ion nào và nồng độ bình thường là bao nhiêu?",["Na+ với nồng độ ~ 135 - 145 mmol/L","K+ với nồng độ ~ 3.7 - 5.2 mmol/L","Ca2+ với nồng độ ~ 2.2 - 2.6 mmol/L","Mg2+ với nồng độ ~ 0.8 - 1.0 mmol/L"],0,"Na+ là cation chính của dịch ngoại bào, đóng vai trò then chốt giữ áp lực thẩm thấu ECF, nồng độ bình thường 135 - 145 mmol/L."],
  ["Cation chính nằm bên trong Dịch nội bào (ICF) là ion nào?",["K+","Na+","Cl-","HCO3-"],0,"K+ là cation chính bên trong tế bào (ICF nồng độ ~120 mmol/L, trong khi ở huyết tương chỉ khoảng 3.7 - 5.2 mmol/L)."],
  ["Công thức ước tính Áp lực thẩm thấu máu (Plasma osmolality) là gì?",["2 x [Na+] + [Glucose] + [Urea]","[Na+] + [K+] + [Glucose]","2 x [K+] + [Urea] / 2","[Na+] + [Cl-] + [HCO3-]"],0,"Áp lực thẩm thấu máu ước tính = 2 x [Na+] + [Glucose] + [Urea] (các nồng độ tính bằng mmol/L)."],
  ["Giá trị tham chiếu bình thường của Áp lực thẩm thấu máu là bao nhiêu?",["280 - 296 mOsm/L","150 - 200 mOsm/L","350 - 400 mOsm/L","100 - 120 mOsm/L"],0,"Áp lực thẩm thấu máu bình thường duy trì hằng định trong khoảng 280 - 296 mOsm/L."],
  ["Hormone ADH (Vasopressin) tác động lên thụ thể V2 ở thận gây ra hiệu ứng gì?",["Tăng tái hấp thu nước ở ống góp, làm giảm lượng nước tiểu","Tăng bài tiết Na+ vào nước tiểu","Co mạch ngoại vi tăng huyết áp","Kích thích tiết Renin"],0,"ADH gắn thụ thể V2 tại tế bào ống góp làm chèn kênh Aquaporin-2, tăng tái hấp thu nước cô đặc nước tiểu."],
  ["Tác động của Rượu (Alcohol) lên sự tiết ADH là gì dẫn đến hiện tượng đi tiểu nhiều?",["Rượu ức chế tiết ADH từ tuyến yên sau","Rượu kích thích tiết ADH","Rượu phân hủy ADH trong máu","Rượu gắn cạnh tranh vào thụ thể V2"],0,"Rượu ức chế giải phóng ADH từ tuyến yên, làm giảm tái hấp thu nước ở ống góp gây ra tác dụng lợi niệu (đi tiểu nhiều)."],
  ["Ống nghiệm chứa máu để làm xét nghiệm Ion đồ nên dùng chất chống đông nào?",["Lithium heparin","EDTA K2","Sodium citrate","Sodium fluoride"],0,"Mẫu máu xét nghiệm ion đồ dùng chất chống đông Lithium heparin (tránh dùng Na-heparin hay K-EDTA vì làm sai lệch kết quả Na+, K+)."],
  ["Yếu tố kĩ thuật nào khi lấy máu tĩnh mạch làm xét nghiệm K+ máu có thể gây TĂNG GIẢ kết quả K+?",["Buộc garot quá chặt và quá lâu, gây vỡ/tán huyết hồng cầu","Bệnh nhân nhịn ăn sáng","Dùng ống chống đông Lithium heparin","Tách huyết thanh nhanh sau khi lấy"],0,"Garot quá chặt/lâu hoặc vỡ hồng cầu (tán huyết) giải phóng lượng K+ rất cao từ nội bào ra huyết tương gây tăng giả K+ máu."],
  ["Ưu điểm của phương pháp Điện cực chọn lọc ion (ISE) so với phương pháp đo quang hóa học trong xét nghiệm Ion đồ là gì?",["Độ chính xác cao hơn và ứng dụng trên máy tự động hoàn toàn","Thực hiện thủ công nhanh hơn","Chi phí rẻ hơn rất nhiều","Không bị ảnh hưởng bởi nhiệt độ"],0,"Phương pháp ISE có độ chính xác và độ nhạy rất cao, chạy trên máy tự động hiện đại thay thế phương pháp đo quang hóa học cũ."],
  ["Hệ thống Renin-Angiotensin-Aldosterone (RAAS) được kích hoạt ban đầu khi có yếu tố kích thích nào tại thận?",["Giảm thể tích tuần hoàn hoặc giảm dòng máu đến tưới thận","Tăng huyết áp động mạch","Tăng nồng độ Na+ máu","Tăng áp lực thẩm thấu máu"],0,"Renin được tiết ra từ bộ máy cạnh cầu thận khi có sự giảm huyết áp, giảm thể tích tuần hoàn hoặc giảm nồng độ Na+ đến vết đặc (macula densa)."],
  ["Khái niệm 'Độ thanh thải' (Clearance) của một chất được định nghĩa là gì?",["Thể tích huyết tương được thận lọc sạch chất đó trong một đơn vị thời gian (mL/phút)","Khối lượng chất đó bài tiết ra nước tiểu trong 24h","Nồng độ chất đó trong nước tiểu chia nồng độ máu","Tỷ lệ tái hấp thu của chất đó tại ống thận"],0,"Clearance là thể tích huyết tương ảo được thận đào thải sạch hoàn toàn một chất nhất định tính theo đơn vị thời gian (mL/phút)."],
  ["Công thức tính Độ thanh thải Creatinine (ClCr) từ mẫu nước tiểu 24h là gì?",["ClCr = (U_Cr x V) / P_Cr","ClCr = (P_Cr x V) / U_Cr","ClCr = P_Cr / U_Cr","ClCr = U_Cr / (P_Cr x V)"],0,"ClCr = (U_Cr x V) / P_Cr; trong đó U_Cr là nồng độ Cr nước tiểu, V là thể tích nước tiểu (mL/phút), P_Cr là nồng độ Cr huyết thanh."],
  ["Xét nghiệm nào sau đây dùng để đánh giá khả năng cô đặc và pha loãng nước tiểu của ống thận?",["Đo áp lực thẩm thấu nước tiểu và Tỷ trọng nước tiểu","Định lượng BUN máu","Đo độ lọc cầu thận GFR","Định lượng Erythropoietin"],0,"Áp lực thẩm thấu và tỷ trọng nước tiểu phản ánh trực tiếp khả năng tái hấp thu nước và cô đặc/pha loãng của hệ thống ống thận."],
  ["Khi tế bào gan tổng hợp Guanidinoacetic acid ở bước 2, nó cần nhận nhóm methyl từ chất xúc tác nào do enzyme GAMT mang đến?",["S-adenosylmethionine (SAM)","Tetrahydrofolate","Vitamin B12","Choline"],0,"S-adenosylmethionine (SAM) cung cấp nhóm -CH3 cho Guanidinoacetic acid dưới tác dụng enzyme GAMT tạo Creatine."],
  ["Enzyme AGAT (L-Arginine:glycine amidinotransferase) nằm chủ yếu ở cơ quan nào?",["Thận","Gan","Tim","Cơ vân"],0,"AGAT thực hiện phản ứng đầu tiên chuyển nhóm amidino từ Arginine sang Glycine diễn ra chủ yếu ở Thận."],
  ["Hệ số lọc cầu thận eGFR tính theo công thức Schwartz thường áp dụng cho đối tượng nào?",["Trẻ em","Người già > 65 tuổi","Phụ nữ mang thai","Vận động viên thể hình"],0,"Công thức Schwartz (dựa vào chiều cao và Creatinine máu) là công thức tiêu chuẩn ước tính GFR ở trẻ em."],
  ["Nguyên nhân làm xuất hiện Protein niệu (Specific protein urea) trong nước tiểu là gì?",["Tổn thương màng lọc cầu thận làm tăng tính thấm với protein (như Albumin)","Ăn quá nhiều đường","Uống thiếu nước","Tăng tiết ADH quá mức"],0,"Bình thường màng lọc cầu thận ngăn protein lớn đi qua. Khi màng lọc bị tổn thương (viêm cầu thận, hội chứng thận hư), Albumin thoát ra nước tiểu."],
  ["Tình trạng Đa niệu (Polyuria) xảy ra khi lượng nước tiểu vượt quá mức nào?",["> 2000 mL/24h","> 1000 mL/24h","> 1500 mL/24h","> 5000 mL/24h"],0,"Đa niệu (Polyuria) được xác định khi lượng nước tiểu > 2000 mL/24h (hay > 2.5L/24h), gặp trong đái tháo đường, đái tháo nhạt, dùng thuốc lợi tiểu."],
  ["Biến chứng nguy hiểm nhất của rối loạn K+ máu nặng (tăng hoặc giảm K+ máu) trên lâm sàng là gì?",["Rối loạn nhịp tim cấp tính và ngừng tim","Suy gan cấp","Co giật do phù não","Gãy xương tự phát"],0,"K+ quyết định điện thế nghỉ màng tế bào cơ tim. Tăng hoặc giảm K+ máu nặng đều gây rối loạn dẫn truyền, rối loạn nhịp tim tử vong."],
  ["Trong phản ứng tạo amoniac ở thận từ Glutamine, enzyme nào xúc tác cắt nhóm amide giải phóng NH3?",["Glutaminase","Glutamate dehydrogenase","ALT","AST"],0,"Enzyme Glutaminase ở tế bào ống thận thủy phân Glutamine -> Glutamate + NH3."],
  ["Nồng độ Na+ máu tăng cao (Hypernatremia) sẽ gây nên hiện tượng gì đối với tế bào cơ thể?",["Tế bào bị teo/co lại (Shrunk) do nước bị kéo ra ngoại bào","Tế bào bị trương phồng và vỡ (Swollen)","Tế bào tăng tổng hợp protein","Không ảnh hưởng đến thể tích tế bào"],0,"Môi trường ngoại bào ưu trương (Na+ tăng) kéo nước từ nội bào ra ngoài làm tế bào bị co teo lại."],
  ["Nồng độ Na+ máu giảm thấp (Hyponatremia) sẽ dẫn đến hiện tượng nào đối với tế bào?",["Tế bào bị trương phồng (Swollen) do nước đi từ ngoại bào vào nội bào","Tế bào bị teo nhỏ","Tế bào mất nước hoàn toàn","Tăng áp lực thẩm thấu máu"],0,"Môi trường ngoại bào nhược trương (Na+ giảm) làm nước di chuyển vào trong tế bào gây trương phồng (nguy hiểm nhất là phù não)."],
  ["Hệ thống đệm chính giữ vai trò quan trọng nhất trong điều hòa cân bằng acid-base huyết tương là gì?",["Hệ đệm Bicarbonate (HCO3- / H2CO3)","Hệ đệm Phosphate","Hệ đệm Hemoglobin","Hệ đệm Proteinato"],0,"Hệ đệm Bicarbonate là hệ đệm ngoại bào quan trọng nhất, phối hợp cùng sự hô hấp của phổi và sự bài tiết của thận."],
  ["Lượng Glucose lọc qua cầu thận bình thường được tái hấp thu hoàn toàn ở đoạn nào của ống thận?",["Ống lượn gần","Quai Henle","Ống lượn xa","Ống góp"],0,"Bình thường 100% Glucose được lọc sẽ được tái hấp thu chủ yếu tại Ống lượn gần nhờ đồng vận chuyển SGLT2 và SGLT1."],
  ["Ngưỡng đường của thận (Renal threshold for glucose) là nồng độ glucose máu khoảng bao nhiêu mà khi vượt quá sẽ xuất hiện đường niệu?",["~ 180 mg/dL (10 mmol/L)","~ 126 mg/dL (7 mmol/L)","~ 250 mg/dL (14 mmol/L)","~ 100 mg/dL (5.5 mmol/L)"],0,"Ngưỡng thận đối với Glucose là khoảng 180 mg/dL (10 mmol/L). Khi glucose máu vượt mức này, khả năng tái hấp thu của ống lượn gần bị quá tải làm xuất hiện Glucose trong nước tiểu."],
  ["Aldosterone do vỏ thượng thận tiết ra tác động lên ống lượn xa và ống góp gây nên hiệu ứng gì?",["Tăng tái hấp thu Na+ và nước, tăng bài tiết K+ và H+","Tăng bài tiết Na+, tăng tái hấp thu K+","Ức chế tái hấp thu Ca2+","Tăng đào thải Urea"],0,"Aldosterone kích thích bơm Na+/K+-ATPase tại tế bào ống lượn xa và ống góp, làm tăng giữ Na+ và nước, đồng thời tăng đào thải K+ và H+."],
  ["Chất nào sau đây là sản phẩm chuyển hóa cuối cùng của Purine ở người được bài tiết qua thận?",["Acid uric","Urea","Creatinine","Allantoin"],0,"Acid uric là sản phẩm thoái hóa cuối cùng của nhân Purine (Adenine, Guanine) ở người và được đào thải chủ yếu qua nước tiểu."],
  ["Mẫu máu bị tán huyết nhẹ sẽ ảnh hưởng RÕ RỆT NHẤT đến chỉ số ion đồ nào?",["Tăng Kali (K+)","Giảm Natri (Na+)","Tăng Clo (Cl-)","Giảm Canxi (Ca2+)"],0,"K+ trong hồng cầu cao gấp ~30 lần ngoài huyết tương, nên tán huyết làm K+ từ hồng cầu thoát ra gây tăng giả K+ máu rất mạnh."],
  ["Chỉ số BUN (Blood Urea Nitrogen) phản ánh nồng độ nitơ của chất nào trong máu?",["Urea","Uric acid","Creatinine","Ammonia"],0,"BUN là lượng nitơ nằm trong cấu trúc Urea máu. Công thức chuyển đổi: Urea (mg/dL) = BUN (mg/dL) x 2.14."],
  ["Trong trường hợp suy thận cấp trước thận (như mất máu, giảm thể tích), tỷ lệ BUN/Creatinine máu thường thay đổi ra sao?",["Tỷ lệ BUN/Creatinine tăng cao (> 20:1)","Tỷ lệ BUN/Creatinine giảm (< 10:1)","Tỷ lệ giữ nguyên 10:1","BUN giảm còn Creatinine tăng"],0,"Khi giảm tưới máu thận, giảm GFR làm ống thận tăng tái hấp thu Urea thụ động làm BUN tăng vọt so với Creatinine (tỷ lệ > 20:1)."],
  ["Hiện tượng trụ hồng cầu trong cặn lắng nước tiểu là dấu hiệu đặc trưng của tổn thương ở vị trí nào?",["Cầu thận (viêm cầu thận cấp)","Bàng quang","Niệu đạo","Tuyến tiền liệt"],0,"Trụ hồng cầu xuất hiện khi hồng cầu từ cầu thận đi qua ống thận bị cô đặc và kết tủa cùng protein Tamm-Horsfall, dấu hiệu của bệnh cầu thận."],
  ["Protein Tamm-Horsfall (Uromodulin) do phần nào của nephron tiết ra?",["Nhánh lên dày quai Henle","Cầu thận","Ống lượn gần","Bể thận"],0,"Uromodulin là protein sinh lý do tế bào nhánh lên dày quai Henle tiết ra, tạo nên khung của các loại trụ niệu."],
  ["Khi huyết áp giảm nhẹ, bộ máy cạnh cầu thận sẽ tiết ra chất nào đầu tiên?",["Renin","Angiotensinogen","ACE","Aldosterone"],0,"Bộ máy cạnh cầu thận (JGA) trực tiếp cảm nhận sự giảm áp lực tưới máu động mạch vào và giải phóng enzyme Renin."],
  ["Enzyme ACE (Angiotensin Converting Enzyme) chuyển Angiotensin I thành Angiotensin II chủ yếu ở cơ quan nào?",["Phổi (mạch máu phổi)","Gan","Thận","Tim"],0,"ACE nằm trên bề mặt tế bào nội mô mạch máu, đặc biệt tập trung mật độ rất cao ở Phổi."],
  ["Tác dụng sinh học mạnh nhất của Angiotensin II là gì?",["Co tiểu động mạch đi, co mạch toàn thân nâng huyết áp và kích thích vỏ thượng thận tiết Aldosterone","Giãn mạch tụt huyết áp","Ức chế ADH","Tăng đào thải Na+"],0,"Angiotensin II là chất co mạch rất mạnh, co ưu tiên tiểu động mạch đi duy trì GFR, đồng thời kích thích tiết Aldosterone giữ muối nước."],
  ["Phát biểu nào sau đây đúng về quá trình đào thải Creatinine?",["Được lọc tự do qua cầu thận và một lượng nhỏ được bài tiết thêm ở ống thận","Được tái hấp thu 50% ở ống lượn gần","Được thoái hóa hoàn toàn ở ống thận","Không được lọc qua cầu thận"],0,"Creatinine được lọc tự do qua cầu thận và có khoảng 10-15% được bài tiết thêm tại ống lượn gần."],
  ["Triệu chứng nào là hậu quả trực tiếp của suy giảm chức năng nội tiết sản xuất Erythropoietin ở bệnh nhân suy thận mãn?",["Thiếu máu đẳng sắc đẳng bào","Tăng hồng cầu","Tăng huyết áp do renin","Còi xương"],0,"Suy thận mãn làm giảm tế bào tiết EPO, dẫn đến thiếu kích thích tủy xương, gây nên tình trạng thiếu máu mãn tính."],
  ["Tỷ trọng nước tiểu bình thường nằm trong khoảng nào?",["1.005 - 1.030","1.000 - 1.002","1.050 - 1.080","0.990 - 1.000"],0,"Tỷ trọng nước tiểu bình thường dao động từ 1.005 đến 1.030 tùy thuộc vào trạng thái cô đặc nước tiểu của cơ thể."],
  ["Hiện tượng Tỷ trọng nước tiểu cố định ở mức 1.010 (Isosthenuria) gợi ý tổn thương gì?",["Mất khả năng cô đặc và pha loãng của ống thận (suy thận mãn)","Đái tháo đường kiểm soát tốt","Nhiễm trùng đường tiết niệu nhẹ","Uống quá nhiều nước"],0,"Khi ống thận bị tổn thương nặng (suy thận mãn), nước tiểu ra có tỷ trọng bằng đúng tỷ trọng dịch lọc cầu thận không đạm (~1.010)."],
  ["Chất nào sau đây xuất hiện trong nước tiểu là dấu hiệu sớm của bệnh lý thận do đái tháo đường (Diabetic nephropathy)?",["Microalbumin niệu (30 - 300 mg/24h)","Glucose niệu vết","Thể ceton niệu","Trụ mỡ"],0,"Xét nghiệm Microalbumin niệu (30-300 mg/24h) giúp phát hiện tổn thương màng lọc cầu thận giai đoạn sớm ở bệnh nhân đái tháo đường."],
  ["Hormone ANP (Atrial Natriuretic Peptide) do tâm nhĩ tiết ra có tác dụng đối kháng với hệ RAAS như thế nào?",["Tăng thải Na+ và nước qua nước tiểu, hạ huyết áp","Tăng giữ Na+ và nước","Kích thích tiết Aldosterone","Co mạch nâng huyết áp"],0,"ANP tiết ra khi căng tâm nhĩ (tăng thể tích), có tác dụng gây tăng thải muối Na+ và nước ở thận để hạ huyết áp."],
  ["Trong công thức tính eGFR MDRD hoặc CKD-EPI, thông số nào KHÔNG cần sử dụng?",["Cân nặng bệnh nhân","Creatinine máu","Tuổi","Giới tính"],0,"Các công thức MDRD và CKD-EPI tính eGFR chuẩn hóa theo diện tích da (1.73m2) nên KHÔNG cần nhập cân nặng (khác với Cockcroft-Gault cần cân nặng)."],
  ["Chế độ ăn nhịn ăn/đói kéo dài (Starvation) làm nước tiểu có phản ứng acid mạnh do sự xuất hiện của chất nào?",["Các thể Ceton (Acetoacetate, beta-hydroxybutyrate)","Urea tăng vọt","Lactate","Glucose"],0,"Khi nhịn ăn kéo dài, cơ thể tăng thoái hóa mỡ tạo thể Ceton mang tính acid thải ra nước tiểu làm pH nước tiểu giảm mạnh."],
  ["Khu vực dịch nào chiếm tỷ lệ lớn nhất trong tổng lượng nước toàn cơ thể?",["Dịch nội bào (ICF)","Dịch kẽ","Huyết tương","Dịch não tủy"],0,"Dịch nội bào (ICF) chiếm 2/3 tổng lượng nước cơ thể (~40% trọng lượng cơ thể)."],
  ["Phương trình Henderson-Hasselbalch tính pH máu dựa trên tỷ lệ giữa hai thành phần nào?",["[HCO3-] và pCO2","[Na+] và [K+]","[Urea] và [Creatinine]","[Albumin] và [Globulin]"],0,"pH = 6.1 + log ([HCO3-] / (0.03 x pCO2)). Phản ánh cân bằng giữa thận (HCO3-) và phổi (pCO2)."],
  ["Đặc điểm nào đúng khi nói về sự bài tiết Creatinine ở ống thận?",["Chiếm khoảng 10-15% tổng lượng creatinine xuất hiện trong nước tiểu","Chiếm 90% tổng lượng","Ống thận tái hấp thu 80% creatinine","Creatinine bị phân hủy hoàn toàn ở ống lượn xa"],0,"Khoảng 85-90% creatinine niệu do lọc cầu thận, 10-15% do ống lượn gần bài tiết thêm."]
];
const HEP=[
  ["Chức năng khử độc và chuyển hóa sinh học (Biotransformation) của gan có vai trò gì?",["Biến đổi hóa học các chất độc nội sinh/ngoại sinh thành dạng ít độc hơn và dễ đào thải","Tổng hợp glucose từ acid béo","Phân hủy trực tiếp hồng cầu già thành sắt","Tiết zymogen tiêu hóa vào máu"],0,"Gan là cơ quan trung tâm khử độc, biến đổi các hợp chất không tan/độc thành dạng tan trong nước để thải qua mật hoặc nước tiểu."],
  ["Ở trạng thái sau khi ăn no (Fed state), gan xử lý Glucose máu như thế nào?",["Tăng tổng hợp Glycogen (Glycogenesis) và tăng đường phân (Glycolysis)","Tăng tân tạo đường (Gluconeogenesis)","Tăng phân giải Glycogen (Glycogenolysis)","Ức chế tổng hợp acid béo"],0,"Khi no, Insulin tăng kích thích gan hấp thu glucose, tăng tổng hợp Glycogen tích trữ và tăng đường phân tạo năng lượng/acetyl-CoA."],
  ["Khi nhịn ăn hoặc đói kéo dài, gan duy trì đường huyết bằng hai quá trình nào?",["Phân giải Glycogen (giai đoạn đầu) và Tân tạo đường Gluconeogenesis (giai đoạn sau)","Đường phân hiếu khí và kỵ khí","Tổng hợp VLDL và Chylomicron","Khử amin và tổng hợp Albumin"],0,"Ban đầu gan phân giải Glycogen dự trữ. Khi Glycogen kiệt (sau 12-18h), gan đẩy mạnh tân tạo đường từ lactate, glycerol, amino acid."],
  ["Cơ quan duy nhất trong cơ thể có khả năng tổng hợp Mật và đào thải Cholesterol ra khỏi cơ thể là gì?",["Gan","Thận","Tụy","Ruột non"],0,"Gan là cơ quan duy nhất tổng hợp acid mật/muối mật từ cholesterol và bài tiết cholesterol qua dịch mật để đào thải."],
  ["Tại sao tế bào gan tổng hợp rất nhiều thể Ceton (Ketone bodies) khi đói nhưng lại KHÔNG THỂ sử dụng thể Ceton làm năng lượng?",["Do tế bào gan thiếu enzyme Thiophorase (Succinyl-CoA:3-ketoacid CoA transferase)","Do gan thiếu coenzyme CoA-SH","Do gan không có ti thể","Do thể ceton ức chế enzyme của gan"],0,"Gan tạo thể Ceton từ Acetyl-CoA để cung cấp cho mô ngoại vi (não, cơ, tim), nhưng bản thân gan không dùng được do thiếu enzyme Thiophorase."],
  ["Thành phần Nitơ trong chu trình Urea được cung cấp từ hai nguồn nào?",["Một nhóm -NH2 từ NH4+ tự do và một nhóm -NH2 từ Aspartate","Hai nhóm -NH2 từ Glutamine","Hai nhóm -NH2 từ Alanine","Một nhóm từ Alanine, một nhóm từ Glycine"],0,"Trong chu trình Urea tại gan: 1 nguyên tử N đến từ NH4+ tự do (nhờ CPS-I), 1 nguyên tử N do Aspartate cung cấp."],
  ["Albumin do gan tổng hợp có đặc điểm sinh hóa nào sau đây?",["Nồng độ huyết thanh 35 - 55 g/L, thời gian bán hủy t1/2 khoảng 20 ngày","Thời gian bán hủy ngắn chỉ 24 giờ","Là yếu tố đông máu cấp tính","Không có khả năng gắn giữ bilirubin"],0,"Albumin là protein huyết tương dồi dào nhất do gan tổng hợp (35-55 g/L), t1/2 ~ 20 ngày, giữ áp lực keo và vận chuyển các chất."],
  ["Các yếu tố đông máu nào do gan tổng hợp phụ thuộc vào sự có mặt của Vitamin K?",["Yếu tố II, VII, IX, X","Yếu tố I, V, VIII, XII","Yếu tố III, IV, XI","Chỉ có Fibrinogen"],0,"Các yếu tố đông máu II (Prothrombin), VII, IX, X cần Vitamin K để gamma-carboxylate gốc Glutamate tạo vị trí gắn Ca2+."],
  ["Bilirubin gián tiếp (chưa liên hợp) được tạo thành từ sự thoái hóa của Heme có tính chất sinh hóa gì?",["Độc, không tan trong nước, gắn chặt với Albumin trong máu, không xuất hiện trong nước tiểu","Tan tốt trong nước, đào thải qua nước tiểu","Liên hợp với acid glucuronic tại lách","Có màu xanh lục"],0,"Bilirubin gián tiếp độc, không tan trong nước nên phải gắn Albumin để di chuyển trong máu, không thể lọc qua cầu thận."],
  ["Enzyme nào tại tế bào gan xúc tác phản ứng liên hợp Bilirubin gián tiếp với Acid Glucuronic tạo Bilirubin trực tiếp?",["UDP-Glucuronosyltransferase (UGT)","Biliverdin reductase","Heme oxygenase","Glutathione S-transferase"],0,"UGT (UDP-glucuronosyltransferase) ở lưới nội chất tế bào gan gắn acid glucuronic vào bilirubin tạo Bilirubin liên hợp (trực tiếp)."],
  ["Bilirubin trực tiếp (liên hợp) có đặc điểm nào khác biệt so với Bilirubin gián tiếp?",["Tan trong nước, ít độc, bài tiết vào mật và có thể xuất hiện trong nước tiểu khi tăng cao","Không tan trong nước","Gắn rất chặt với Albumin","Không bị vi khuẩn ruột biến đổi"],0,"Bilirubin trực tiếp tan trong nước, theo mật xuống ruột. Khi tắc mật, nó trào ngược vào máu và lọc qua cầu thận gây Bilirubin niệu dương tính."],
  ["Sản phẩm chuyển hóa của Bilirubin liên hợp do vi khuẩn ruột tạo ra có vai trò tạo màu đặc trưng cho Phân là gì?",["Stercobilin","Urobilinogen","Biliverdin","Porfobilinogen"],0,"Tại ruột, vi khuẩn oxy hóa Urobilinogen thành Stercobilin có màu nâu sẫm tạo nên màu đặc trưng của phân."],
  ["Tình trạng Vàng da Trước gan (như Tán huyết cấp) sẽ làm thay đổi xét nghiệm Bilirubin máu ra sao?",["Tăng chủ yếu Bilirubin gián tiếp (chưa liên hợp) trong máu","Tăng chủ yếu Bilirubin trực tiếp","Bilirubin niệu dương tính mạnh","Phân bạc màu"],0,"Tán huyết ồ ạt tạo ra lượng lớn Bilirubin vượt quá khả năng liên hợp của gan, dẫn đến tăng vọt Bilirubin gián tiếp máu."],
  ["Vàng da Sau gan (Tắc mật cơ học như sỏi mật, u đầu tụy) có đặc điểm xét nghiệm điển hình nào?",["Tăng chủ yếu Bilirubin trực tiếp, Phân bạc màu, Bilirubin niệu dương tính","Tăng Bilirubin gián tiếp, phân sẫm màu","Urobilinogen niệu tăng rất cao","ALT/AST tăng gấp 50 lần"],0,"Tắc mật làm Bilirubin trực tiếp không xuống ruột được (phân bạc màu), dội ngược vào máu thải ra nước tiểu (Bilirubin niệu +)."],
  ["Hội chứng di truyền Gilbert gây tăng Bilirubin gián tiếp nhẹ do nguyên nhân nào?",["Giảm hoạt tính enzyme UDP-Glucuronosyltransferase (UGT)","Mất hoàn toàn gen UGT","Tắc ống mật chủ","Rối loạn bài tiết Bilirubin vào phế vị mật"],0,"Hội chứng Gilbert do đột biến vùng promoter gen UGT1A1 làm giảm tổng hợp enzyme UGT (~30% bình thường), gây tăng nhẹ Bil gián tiếp."],
  ["Hội chứng Crigler-Najjar tuýp I là bệnh lý di truyền rất nặng với nguy cơ vàng da nhân não ở trẻ sơ sinh do nguyên nhân nào?",["Thiếu hụt/mất hoàn toàn hoạt tính enzyme UGT","Tán huyết bẩm sinh","Tắc mật bẩm sinh","Giảm Albumin máu"],0,"Crigler-Najjar tuýp I do đột biến làm mất hoàn toàn hoạt tính UGT, làm Bilirubin gián tiếp tăng cực cao gây vàng da nhân não (Kernicterus)."],
  ["Hội chứng Dubin-Johnson và Rotor có đặc điểm chung là gì?",["Tăng Bilirubin trực tiếp (liên hợp) do khiếm khuyết bài tiết bilirubin từ tế bào gan vào mao mật","Tăng Bilirubin gián tiếp do tán huyết","Giảm enzyme ALT","Thiếu hụt Vitamin K"],0,"Dubin-Johnson và Rotor là hai bệnh di truyền lặn lành tính gây rối loạn vận chuyển bài tiết Bilirubin trực tiếp ra mao mật."],
  ["Enzyme Alanine Aminotransferase (ALT/GPT) có đặc điểm phân bố và ý nghĩa lâm sàng như thế nào?",["Tập trung chủ yếu ở bào tương tế bào gan, là chỉ số đặc hiệu cho tổn thương tế bào gan","Tập trung chủ yếu ở ti thể cơ tim","Tăng cao trong bệnh lý xương","Chỉ tăng khi tắc mật"],0,"ALT nằm chủ yếu trong bào tương hepatocyte, có độ đặc hiệu rất cao cho tổn thương tế bào gan (viêm gan cấp, nhiễm độc)."],
  ["Enzyme Aspartate Aminotransferase (AST/GOT) ngoài gan còn có nồng độ rất cao ở cơ quan nào?",["Cơ tim, cơ vân, thận, não","Tụy ngoại tiết","Ruột non","Tuyến nước bọt"],0,"AST hiện diện trong cả bào tương và ti thể của gan, cơ tim, cơ vân, thận... nên ít đặc hiệu cho gan hơn ALT."],
  ["Tỷ số De Ritis (AST / ALT) có giá trị >= 2.0 thường gợi ý nguyên nhân tổn thương gan nào?",["Bệnh gan do rượu (Alcoholic liver disease) hoặc Xơ gan","Viêm gan siêu vi cấp","Gan nhiễm mỡ không do rượu","Tắc mật cấp"],0,"Rượu gây độc ti thể (nơi chứa nhiều AST) và làm thiếu B6 (cần cho ALT), nên tổn thương gan do rượu làm AST/ALT >= 2.0."],
  ["Enzyme Alkaline Phosphatase (ALP) và Gamma-Glutamyltransferase (GGT) tăng cao vượt trội trong nhóm bệnh lý gan mật nào?",["Bệnh lý ứ mật (Cholestasis) hoặc tắc mật","Viêm gan siêu vi cấp giai đoạn sớm","Hội chứng Gilbert","Thiếu máu tan máu"],0,"ALP và GGT là các enzyme gắn màng mao mật. Khi có ứ mật/tắc mật, sự tổng hợp và giải phóng ALP, GGT tăng vọt."],
  ["Enzyme GGT rất nhạy cảm và thường được sử dụng làm chỉ số tầm soát yếu tố nào?",["Lạm dụng rượu mãn tính và tác dụng cảm ứng enzyme của thuốc (phenytoin, phenobarbital)","Tổn thương cơ tim","Viêm tụy cấp","Ung thư dạ dày"],0,"GGT tăng rất nhạy ở người uống nhiều rượu bia và người dùng các thuốc gây cảm ứng enzyme microrosom gan."],
  ["Tế bào nang tụy (Acinar cells) của tụy ngoại tiết có chức năng sinh học chính là gì?",["Tổng hợp và tiết các Zymogens (tiền enzyme tiêu hóa) như Trypsinogen, Chymotrypsinogen, Amylase, Lipase","Tiết Bicarbonate trung hòa acid","Tiết Insulin và Glucagon","Tiết Gastrin"],0,"Tế bào nang tụy (Acinar cells) chịu trách nhiệm tổng hợp các enzyme tiêu hóa dưới dạng zymogen không hoạt động đổ vào ống tụy."],
  ["Tế bào ống tụy (Ductal cells) tiết ra dịch chứa nồng độ ion nào rất cao để trung hòa chyme acid từ dạ dày xuống tá tràng?",["HCO3- (Bicarbonate)","Cl-","Na+","H+"],0,"Tế bào ống tụy tiết dịch giàu Bicarbonate (HCO3-) dưới sự kích thích của hormone Secretin để tạo môi trường kiềm nhẹ ở tá tràng."],
  ["Hormone Secretin do tế bào S ở niêm mạc tá tràng tiết ra khi có kích thích acid sẽ tác động lên tụy làm gì?",["Kích thích tế bào ống tụy tiết nhiều dịch chứa Bicarbonate (HCO3-)","Kích thích nang tụy tiết zymogens","Ức chế tiết dịch tụy","Tăng tiết Insulin"],0,"Khi thức ăn acid từ dạ dày xuống tá tràng, Secretin được giải phóng kích thích tế bào ống tụy tiết HCO3-."],
  ["Hormone Cholecystokinin (CCK) do ruột tiết ra có tác dụng chính nào lên hệ tụy - mật?",["Kích thích tế bào nang tụy tiết enzyme tiêu hóa và kích thích túi mật co bóp","Giãn túi mật","Ức chế tiết Amylase","Tăng tổng hợp Glycogen ở gan"],0,"CCK tiết ra khi có mỡ/protein ở tá tràng, làm co túi mật tống mật xuống ruột và kích thích tế bào nang tụy tiết enzyme."],
  ["Enzyme Lipase huyết thanh có ưu điểm gì hơn Amylase trong chẩn đoán Viêm tụy cấp?",["Độ đặc hiệu cao hơn cho tụy và thời gian tăng kéo dài lâu hơn (7-14 ngày)","Tăng sớm hơn sau 10 phút","Giá thành rẻ hơn","Có trong tuyến nước bọt"],0,"Lipase đặc hiệu cho tổn thương tụy hơn Amylase (Amylase có ở tuyến nước bọt) và Lipase tồn tại trong máu lâu hơn giúp chẩn đoán muộn."],
  ["Quá trình khử độc ở gan bằng phản ứng liên hợp thường sử dụng các chất nội sinh nào?",["Acid Glucuronic, Glutathione, Glycine, Sulfate","Urea và Creatinine","Cholesterol và Triglyceride","Bicarbonate và Na+"],0,"Phản ứng liên hợp pha II ở gan gắn chất độc với glucuronate, glutathione, glycine, sulfate... để tăng tính tan dễ đào thải."],
  ["Lipoprotein nào do gan tổng hợp có vai trò chính là vận chuyển Triglyceride nội sinh từ gan đến các mô ngoại vi?",["VLDL","Chylomicron","LDL","HDL"],0,"VLDL được tổng hợp tại gan để vận chuyển Triglyceride nội sinh ra mô mỡ và cơ."],
  ["Xét nghiệm Prothrombin Time (PT/INR) phản ánh chức năng nào của gan?",["Chức năng tổng hợp các yếu tố đông máu huyết tương (đặc biệt yếu tố VII có t1/2 ngắn)","Chức năng lọc cầu thận","Chức năng bài tiết mật","Khả năng khử độc rượu"],0,"PT/INR đánh giá con đường đông máu ngoại ngỏ. Do yếu tố VII có thời gian bán hủy rất ngắn (~6h), PT/INR là chỉ số nhạy đánh giá suy gan cấp."],
  ["Bệnh lý Xơ gan giai đoạn muộn thường dẫn đến sự thay đổi protein máu như thế nào?",["Giảm Albumin máu, tăng Globulin (đặc biệt IgA) dẫn đến hiện tượng đảo ngược tỷ lệ A/G (< 1.0)","Tăng Albumin máu","Giảm Globulin tuyệt đối","Không thay đổi protein máu"],0,"Xơ gan suy giảm tổng hợp Albumin trong khi hệ reticuloendothelial tăng tạo Globulin làm tỷ lệ A/G (bình thường 1.2-1.5) bị đảo ngược."],
  ["Muối mật (Bile salts) được tạo thành từ acid mật liên hợp với hai amino acid nào?",["Glycine và Taurine","Alanine và Glutamate","Leucine và Isoleucine","Lysine và Arginine"],0,"Acid mật sơ cấp (cholic acid, chenodeoxycholic acid) liên hợp với Glycine hoặc Taurine tạo thành muối mật."],
  ["Chu trình Gan - Ruột (Enterohepatic circulation) của muối mật giúp tái hấp thu khoảng bao nhiêu % muối mật trở lại gan?",["95%","50%","10%","100%"],0,"Khoảng 95% muối mật bài tiết xuống ruột sẽ được tái hấp thu chủ yếu ở hồi tràng (ileum) về tĩnh mạch cửa trở lại gan."],
  ["Sự xuất hiện của Thể Ceton trong nước tiểu (Ketostix +) thường do tình",["Đái tháo đường phụ thuộc insulin không kiểm soát hoặc Nhịn ăn đói kéo dài","Ăn quá nhiều đường","Viêm cầu thận cấp","Tắc mật"],0,"Khi thiếu Insulin hoặc thiếu Glucose nội bào, cơ thể tăng thoái hóa mỡ tạo vọt Acetyl-CoA vượt quá chu trình Krebs tạo ra thể ceton."],
  ["Biến chứng Tăng Amoniac máu (Hyperammonemia) ở bệnh nhân Xơ gan nặng gây ra hội chứng lâm sàng nguy hiểm nào?",["Bệnh não do gan (Hepatic encephalopathy) / Hôn mê gan","Suy thận cấp","Nhồi máu cơ tim","Viêm tụy cấp"],0,"Suy gan làm trệch chu trình Urea, NH3 tăng cao qua hàng rào máu não gắn Glutamate thành Glutamine gây phù tế bào thần kinh và hôn mê gan."],
  ["Khi tổn thương tế bào gan cấp tính (như viêm gan virus A, B cấp), enzyme nào tăng sớm và mạnh nhất?",["ALT và AST (có thể tăng > 10 - 100 lần giới hạn trên)","ALP","Amylase","LDH5"],0,"Viêm gan cấp gây hoại tử tế bào gan làm ALT và AST giải phóng hàng loạt vào máu, tăng hàng ngàn U/L."],
  ["Hiện tượng Vàng da sơ sinh sinh lý (Physiological jaundice) diễn ra do nguyên nhân chính nào?",["Hệ thống enzyme UGT ở gan trẻ chưa trưởng thành đầy đủ và tăng vỡ hồng cầu thai nhi","Tắc đường mật bẩm sinh","Bất đồng nhóm máu ABO","Nhiễm trùng gan"],0,"Trẻ sơ sinh có gan chưa hoàn thiện enzyme UGT kết hợp thoái hóa HbF làm tăng vừa phải Bilirubin gián tiếp trong những ngày đầu."],
  ["Phương pháp Chiếu đèn (Phototherapy) điều trị vàng da sơ sinh dựa trên cơ chế sinh hóa nào?",["Chuyển Bilirubin gián tiếp thành dạng đồng phân quang học (Lumbrirubin) tan trong nước để thải qua mật/nước tiểu","Kích thích gan tạo UGT","Phân hủy hoàn toàn bilirubin thành sắt","Diệt vi khuẩn ruột"],0,"Ánh sáng xanh (460-490 nm) biến đổi cấu trúc Bilirubin 4E,15E thành Lumirubin tan được trong nước mà không cần qua liên hợp gan."],
  ["Enzyme Amylase huyết thanh ngoài tụy ra còn do cơ quan nào tiết ra?",["Tuyến nước bọt","Gan","Thận","Dạ dày"],0,"Amylase có 2 isoenzyme chính: S-type (Salivary - tuyến nước bọt) và P-type (Pancreatic - tụy)."],
  ["Xét nghiệm phân thấy xuất hiện nhiều hạt mỡ trung tính và sợi cơ còn nguyên vẹn gợi ý suy giảm chức năng của cơ quan nào?",["Tụy ngoại tiết (Suy tụy ngoại tiết)","Dạ dày","Lách","Ruột già"],0,"Tụy tiết lipase tiêu mỡ và trypsin tiêu protein. Suy tụy ngoại tiết làm thức ăn không tiêu hóa được xuất hiện phân mỡ (Steatorrhea)."],
  ["Isoenzyme LDH5 (M4) tăng ưu thế trong serum gợi ý tổn thương ở cơ quan nào?",["Gan và Cơ vân","Cơ tim","Phổi","Thận"],0,"LDH5 gồm 4 chuỗi M (M4) tập trung nhiều ở mô gan và cơ vân."],
  ["Thành phần sinh hóa nào trong Dịch mật đóng vai trò quan trọng nhất giúp nhũ tương hóa mỡ trong thức ăn?",["Muối mật (Bile salts) và Lecithin","Bilirubin trực tiếp","Cholesterol tự do","Urea"],0,"Muối mật có tính chất lưỡng cực kết hợp với phospholipid Lecithin làm giảm căng bề mặt, nhũ tương hóa lipid hạt nhỏ cho lipase tác dụng."],
  ["Trong phản ứng khử độc Pha I tại gan, hệ thống enzyme nào đóng vai trò oxy hóa hàng đầu?",["Cytochrome P450 (CYP450)","UDP-glucuronosyltransferase","MAO","Alcohol dehydrogenase"],0,"Hệ thống enzyme Cytochrome P450 ở lưới nội chất trơn tế bào gan thực hiện các phản ứng oxy hóa, khử, thủy phân trong Pha I khử độc."],
  ["Chất nào sau đây là chỉ dấu Marker ung thư biểu mô tế bào gan (HCC)?",["AFP (Alpha-Fetoprotein)","CEA","CA 125","PSA"],0,"AFP là glycoprotein sản xuất ở gan thai nhi. Ở người lớn, AFP máu tăng cao (> 400 ng/mL) là chỉ dấu quan trọng gợi ý Ung thư gan nguyên phát (HCC)."],
  ["Nguyên nhân gây nên tình trạng Gan nhiễm mỡ do uống nhiều rượu là gì?",["Rượu chuyển hóa tạo quá nhiều NADH làm tăng tổng hợp acid béo và giảm beta-oxy hóa mỡ ở gan","Ức chế tổng hợp VLDL","Tăng phân giải mỡ ở mô mỡ","Thiếu cholesterol"],0,"Oxy hóa rượu qua ADH làm tỷ lệ NADH/NAD+ tăng vọt, khóa chu trình Krebs, ức chế beta-oxy hóa làm acid béo ứ đọng chuyển thành Triglyceride ở gan."],
  ["Hiện tượng Vàng da nhân não (Kernicterus) ở trẻ sơ sinh xảy ra khi dạng Bilirubin nào tự do tăng quá cao vượt qua hàng rào máu não?",["Bilirubin gián tiếp (chưa liên hợp)","Bilirubin trực tiếp","Biliverdin","Urobilinogen"],0,"Bilirubin gián tiếp tự do tan trong mỡ, khi tăng cao vượt mức gắn Albumin sẽ ngấm qua hàng rào máu vào các nhân xám trung ương gây độc não."],
  ["Xơ gan do đường mật hoặc Tắc mật kéo dài thường gây ra tình trạng thiếu hụt nhóm Vitamin nào do giảm hấp thu?",["Các Vitamin tan trong dầu (A, D, E, K)","Các Vitamin nhóm B","Vitamin C","Acid folic"],0,"Thiếu dịch mật/muối mật làm mỡ không nhũ tương hóa được, kéo theo giảm hấp thu các vitamin tan trong mỡ (A, D, E, K)."],
  ["Enzyme Caeruloplasmin do gan tổng hợp có vai trò sinh hóa gì?",["Vận chuyển Đồng (Cu) và có hoạt tính ferroxidase giúp chuyển Fe2+ thành Fe3+","Vận chuyển Sắt","Gắn giữ Hemoglobin tự do","Tổng hợp hóc môn tuyến giáp"],0,"Ceruloplasmin chứa Đồng, oxy hóa Fe2+ -> Fe3+ để gắn vào Transferrin. Giảm Ceruloplasmin là đặc trưng bệnh Wilson tích tụ đồng."],
  ["Triệu chứng Hạ đường huyết nặng khi đói có thể gặp trong bệnh lý gan nào?",["Suy gan cấp nặng hoặc Xơ gan giai đoạn cuối","Ứ mật nhẹ","Sỏi túi mật","Viêm tụy mãn nhẹ"],0,"Gan suy nặng làm mất khả năng dự trữ Glycogen và trệch đường tân tạo đường gây nên hạ đường huyết nguy hiểm."],
  ["Trong nghiệm pháp chẩn đoán Viêm tụy cấp, Amylase máu thường bắt đầu tăng sau bao lâu kể từ khi khởi phát đau tụy?",["2 - 12 giờ","24 - 48 giờ","7 ngày","Ngay lập tức sau 1 phút"],0,"Amylase máu bắt đầu tăng từ 2-12h sau khởi phát viêm tụy cấp, đạt đỉnh ở 12-72h và trở về bình thường sau 3-5 ngày."],
  ["Chất nào sau đây được gan tổng hợp để vận chuyển Sắt trong máu?",["Transferrin","Ferritin","Haptoglobin","Hemopexin"],0,"Transferrin do gan tổng hợp là glycoprotein chuyên chở Fe3+ trong tuần hoàn đến các mô."],
  ["Ferritin phản ánh thông số sinh hóa nào của cơ thể?",["Mức độ dự trữ Sắt trong cơ thể","Lượng Sắt tự do trong máu","Khả năng gắn sắt toàn phần","Tốc độ tạo hồng cầu"],0,"Ferritin là dạng protein dự trữ sắt chính ở gan, lách, tủy xương. Nồng độ Ferritin serum tỷ lệ thuận với dự trữ sắt cơ thể."],
  ["Protein Haptoglobin do gan sản xuất có vai trò gì khi có hiện tượng Tán huyết nội mạch?",["Gắn tự do với chuỗi Hemoglobin phóng thích ra để tránh mất sắt qua thận","Phân hủy Heme thành Bilirubin","Ức chế tủy xương","Tăng thải sắt qua nước tiểu"],0,"Haptoglobin gắn bắt lấy Hemoglobin tự do trong máu tạo phức hợp lớn không lọc qua cầu thận, bảo vệ thận và giữ lại sắt."],
  ["Sự suy giảm nghiêm trọng nồng độ Haptoglobin máu là chỉ dấu xét nghiệm gợi ý bệnh lý nào?",["Tán huyết nội mạch (Int intravascular hemolysis)","Tắc mật ngoài gan","Viêm tụy cấp","Xơ vữa động mạch"],0,"Khi tán huyết nội mạch, Haptoglobin bị tiêu thụ hết do phức hợp Hb-Haptoglobin bị hệ reticuloendothelial dọn dẹp làm Haptoglobin máu giảm rất thấp."],
  ["Hội chứng Crigler-Najjar tuýp II khác với tuýp I ở điểm nào?",["Tuýp II còn một phần nhỏ hoạt tính UGT (< 10%) và có đáp ứng giảm bilirubin khi dùng Phenobarbital","Tuýp II nặng hơn","Tuýp II do tắc mật","Tuýp II gây tăng bilirubin trực tiếp"],0,"Tuýp II còn một phần hoạt tính UGT nên nồng độ Bilirubin thấp hơn tuýp I và Phenobarbital giúp kích thích tổng hợp thêm UGT."],
  ["Lecithin-Cholesterol Acyltransferase (LCAT) do gan tiết vào máu có vai trò gì?",["Ester hóa Cholesterol tự do trên bề mặt HDL","Thủy phân Triglyceride ở Chylomicron","Tổng hợp Bile acid","Vận chuyển Glucose"],0,"LCAT chuyển nhóm acyl từ Lecithin sang Cholesterol tạo Cholesterol ester nằm ở lõi phân tử HDL trong quá trình vận chuyển ngược mỡ."],
  ["Sự xuất hiện phân màu đất sét/bạc màu (Clay-colored stool) là do thiếu thành phần nào xuống ruột?",["Bilirubin / Stercobilin","Lipase","Acid mỡ","Mucin"],0,"Khi tắc đường dẫn mật, sắc tố mật không xuống được ruột làm phân mất màu nâu truyền thống biến thành màu xám nhạt/bạc màu."],
  ["Xét nghiệm Nước tiểu có Bilirubin (+) và Urobilinogen (giảm hoặc âm tính) điển hình cho bệnh cảnh nào?",["Tắc mật hoàn toàn ngoài gan","Tán huyết do truyền nhầm nhóm máu","Viêm tuyến nước bọt","Hội chứng Gilbert"],0,"Tắc mật làm Bilirubin trực tiếp trào vào máu thải ra nước tiểu (Bilirubin +), đồng thời mật không xuống ruột nên không có Urobilinogen (Urobilinogen -)."],
  ["Việc lạm dụng Paracetamol quá liều gây ngộ độc hoại tử tế bào gan do tích tụ chất chuyển hóa trung gian độc hại nào?",["NAPQI (N-acetyl-p-benzoquinone imine)","Acetaldehyde","Formaldehyde","Glutathione"],0,"Khi quá liều Paracetamol, hệ CYP2E1 tạo vọt NAPQI làm cạn kiệt Glutathione tế bào gan gây hoại tử tế bào gan diện rộng."],
  ["Chất giải độc hiệu quả khi ngộ độc Paracetamol cấp giúp khôi phục nguồn Glutathione ở gan là gì?",["N-acetylcysteine (NAC)","Vitamin C","Ethanol","Atropine"],0,"N-acetylcysteine cung cấp Cysteine cho tế bào gan tái tổng hợp Glutathione để trung hòa NAPQI."],
  ["Chất nào sau đây do tụy tiết ra giúp bảo vệ các tế bào nang tụy không bị tự tiêu hóa bởi Trypsin?",["PSTI (Pancreatic Secretory Trypsin Inhibitor / SPINK1)","Enteropeptidase","Secretin","Glucagon"],0,"PSTI bất hoạt một lượng nhỏ Trypsin vô tình hoạt hóa sớm trong nang tụy để ngăn ngừa tự tiêu tụy."],
  ["Enzyme nào ở vi nhung mao niệu mạc ruột đóng vai trò khởi động chuỗi hoạt hóa zymogen tụy bằng cách cắt Trypsinogen thành Trypsin?",["Enteropeptidase (Enterokinase)","Chymotrypsin","Carboxypeptidase","Pepsin"],0,"Enteropeptidase ở tá tràng cắt đoạn peptide của Trypsinogen tạo Trypsin. Sau đó Trypsin quay lại hoạt hóa hàng loạt zymogen khác."],
  ["Amoniac (NH3) trong cơ thể được vận chuyển an toàn từ các mô cơ quan về Gan dưới dạng hai amino acid nào?",["Glutamine và Alanine","Aspartate và Glycine","Leucine và Valine","Serine và Threonine"],0,"NH3 độc được gắn vào Glutamate tạo Glutamine (ở hầu hết các mô) hoặc Alanine (từ cơ - chu trình Glucose-Alanine) đưa về gan xử lý."],
  ["Cơ chế chính làm Tăng ALP trong bệnh lý xương (như Bệnh Paget xương, ung thư xương) là do hoạt động của tế bào nào?",["Tạo xương bào (Osteoblasts)","Hủy xương bào (Osteoclasts)","Tế bào sụn","Tế bào tủy xương"],0,"Tạo xương bào (Osteoblasts) giàu enzyme ALP. Khi tăng tái tạo xương, ALP isoenzyme xương được giải phóng nhiều vào máu."],
  ["Sự phối hợp giữa GGT và ALP có ý nghĩa gì trên lâm sàng khi bệnh nhân có Tăng ALP máu?",["Xác định nguồn gốc tăng ALP: Nếu GGT tăng kèm -> Nguồn gốc Gan Mật; Nếu GGT bình thường -> Nguồn gốc Xương","Xác định viêm tụy","Chẩn đoán bệnh thận","Chẩn đoán tổn thương cơ tim"],0,"GGT có ở gan mật nhưng KHÔNG có ở xương. Tăng ALP kèm GGT tăng xác nhận bệnh lý gan mật; Tăng ALP nhưng GGT bình thường nghĩ đến bệnh lý xương."],
  ["Trong tổn thương gan mãn tính (như xơ gan do rượu), chỉ số nào phản ánh chính xác khả năng phục hồi hồi phục dự trữ protein gan hơn Albumin?",["Prealbumin (Transthyretin) do có t1/2 ngắn chỉ 2 ngày","Globulin","Transferrin","IgG"],0,"Prealbumin có thời gian bán hủy ngắn (2 ngày) nên là chỉ dấu nhạy đánh giá tình"],

  ["Thành phần lipid chiếm tỷ lệ cao nhất trong Dịch mật là gì?",["Phospholipid (chủ yếu Lecithin)","Triglyceride","Cholesterol tự do","Sphingomyelin"],0,"Phospholipid (Lecithin) chiếm khoảng 90% lượng lipid trong dịch mật, phối hợp với muối mật để hòa tan cholesterol."],
  ["Sỏi mật dạng Sỏi sắc tố (Pigment stones) có thành phần chính là gì?",["Calcium bilirubinate","Cholesterol tinh khiết","Triglyceride","Urate"],0,"Sỏi sắc tố nâu/đen hình thành do lắng đọng muối Calcium bilirubinate khi có tăng bilirubin gián tiếp dư thừa hoặc nhiễm trùng đường mật."],
  ["Nhiệm vụ của tuyến Tụy nội tiết là tiết các hormone trực tiếp vào máu từ vùng cấu trúc nào?",["Đảo tụy (Pancreatic Islets / Langerhans)","Tế bào nang tụy","Ống Wirsung","Ống Santorini"],0,"Các đảo tụy Langerhans chiếm 1-2% thể tích tụy chứa các tế bào alpha (Glucagon), beta (Insulin), delta (Somatostatin) đảm nhận chức năng nội tiết."]
