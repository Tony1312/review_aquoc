<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập Glucide – 70 câu trắc nghiệm</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7385;--bd:#d9dde8;--ac:#2f6fed;--ok:#1a8a4a;--okb:#e3f6ea;--no:#c62f3b;--nob:#fde8ea}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1e222d;--tx:#e8ebf2;--mu:#9aa3b5;--bd:#333a4a;--ac:#6d9bff;--ok:#5fd18a;--okb:#16301f;--no:#ff7b86;--nob:#3a1a1e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:820px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.5rem;margin:.2em 0}
.sub{color:var(--mu);margin:0 0 16px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--bd);margin-bottom:16px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
label.t{display:flex;gap:6px;align-items:center;color:var(--mu);font-size:.92rem}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.q h3{font-size:1rem;margin:0 0 10px}
.q h3 span{color:var(--ac)}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:9px;border:1px solid var(--bd);background:transparent}
.o b{min-width:1.4em;color:var(--mu)}
.o:hover{border-color:var(--ac)}
.o.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.o.ok{border-color:var(--ok);background:var(--okb)}
.o.no{border-color:var(--no);background:var(--nob)}
.ex{display:none;margin-top:8px;padding:10px 12px;border-radius:9px;background:var(--okb);border-left:4px solid var(--ok);font-size:.93rem}
.ex.s{display:block}
.res{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px;display:none}
.res.s{display:block}
.res big{font-size:1.6rem;font-weight:700}
</style>
</head>
<body>
<div class="w">
<h1>Ôn tập Glucide – 70 câu trắc nghiệm</h1>
<p class="sub">Dựa trên bài giảng Hóa học Glucide và Chuyển hóa Glucide – Th.S Nguyễn Thu Hà (PNT).</p>
<div class="bar">
<div class="ctl">
<select id="part"><option value="all">Cả 70 câu</option><option value="1">Phần 1: Hóa học (1–35)</option><option value="2">Phần 2: Chuyển hóa (36–70)</option></select>
<button id="shuf">Xáo trộn</button>
<label class="t"><input type="checkbox" id="inst"> Hiện đáp án ngay khi chọn</label>
<button class="p" id="sub">Nộp bài</button>
<button id="rst">Làm lại</button>
</div>
<div class="prog"><i id="pg"></i></div>
</div>
<div class="res" id="res"></div>
<div id="list"></div>
</div>
<script>
const D=[
["Công thức cấu tạo chung của carbohydrate là:",["(CH₂O)ₙ, n ≥ 2","(CH₂O)ₙ, n ≥ 3","(CHO)ₙ, n ≥ 3","(C₂H₄O)ₙ, n ≥ 3"],1,"Công thức chung (CH₂O)ₙ, n ≥ 3."],
["Glucid chiếm khoảng bao nhiêu trọng lượng khô của động vật (ĐV) và thực vật (TV)?",["80–90% ở ĐV, 2% ở TV","20% ở ĐV, 50% ở TV","10% ở ĐV, 30% ở TV","2% ở ĐV, 80–90% ở TV"],3,"Glucid chiếm 2% trọng lượng khô của ĐV và 80–90% của TV."],
["Đặc điểm nào sau đây đúng với monosaccharide (MS)?",["Là đơn vị cơ bản của carbohydrate, không thể thủy phân thành carbohydrate nhỏ hơn","Thủy phân tạo ra 2 phân tử đường đôi","Chỉ chứa nhóm chức acid carboxylic","Luôn có phân tử lượng rất lớn"],0,"MS là đơn vị cơ bản, không thủy phân thành carbohydrate nhỏ hơn."],
["MS gồm những nhóm chức nào?",["2 chức aldehyde + chức acid","1 chức ester + chức amin","1 chức khử (aldehyde/ketone) + chức alcol","1 chức acid + chức ketone"],2,"MS gồm 1 chức khử (aldehyde/ketone) và chức alcol."],
["Fructose thuộc loại:",["Aldohexose","Ketopentose","Aldopentose","Ketohexose"],3,"Fructose là ketohexose (6C, chức ketone)."],
["Ribulose thuộc loại:",["Aldopentose","Ketohexose","Ketopentose","Aldohexose"],2,"Ribulose là ketopentose; ribose là aldopentose."],
["Số lượng đồng phân quang học của một MS có n carbon bất đối (C*) là:",["n²","2n","2ⁿ","n!"],2,"Số đồng phân quang học = 2ⁿ, với n là số C*."],
["MS nào sau đây KHÔNG có carbon bất đối nên không có tính quang hoạt?",["Glyceraldehyde","Dioxyaceton","Erythrose","Ribose"],1,"Dioxyaceton không có C* nên không quang hoạt."],
["MS thuộc dạng D khi:",["Nhóm –OH đứng bên phải của carbon bất đối xứng xa nhóm carbonyl nhất","Nhóm –OH đứng bên trái của carbon bất đối xứng xa nhóm carbonyl nhất","Nhóm –OH bán acetal nằm cùng phía với –OH tự do","Có nhóm carbonyl ở vị trí C2"],0,"Dạng D có –OH bên phải của C* xa nhóm carbonyl nhất."],
["Glucose và fructose có mối quan hệ nào sau đây?",["Đồng phân lập thể enantiomer","Epimer","Đồng phân quang học","Đồng phân hóa học (khác nhau về chức aldehyde hoặc ketone)"],3,"Glucose (aldose) và fructose (ketose) là đồng phân hóa học."],
["Epimer là các đồng phân:",["Cùng công thức hóa học nhưng khác hoàn toàn cấu trúc phân tử","Chỉ khác nhau tại một trung tâm dị lập thể","Khác nhau về nhóm chức","Là ảnh gương hoàn toàn của nhau"],1,"Epimer chỉ khác nhau ở một trung tâm dị lập thể."],
["Mannose là epimer của glucose ở carbon số mấy?",["C-1","C-3","C-2","C-4"],2,"Mannose là C-2 epimer của glucose; galactose là C-4 epimer."],
["Trong công thức Haworth, dạng α có đặc điểm:",["Nhóm –OH bán acetal nằm cùng phía với nhóm –OH tự do của C* xa nhất","Không có nhóm –OH bán acetal","Có cấu trúc mạch thẳng","Nhóm –OH bán acetal nằm khác phía với nhóm –OH tự do của C* xa nhất"],3,"Dạng α: –OH bán acetal khác phía với –OH tự do của C* xa nhất. Dạng β thì cùng phía."],
["Sự chuyển đổi qua lại giữa hai đồng phân dạng α và β của glucose trong dung dịch nước được gọi là:",["Hiện tượng chuyển quay (mutarotation)","Hiện tượng thủy phân","Hiện tượng đồng phân hóa","Hiện tượng trùng hợp"],0,"Sự chuyển đổi α ⇄ β gọi là hiện tượng chuyển quay."],
["Ở trạng thái cân bằng động trong dung dịch nước, tỉ lệ các dạng của glucose xấp xỉ:",["α-D-glucose 37%; dạng thẳng 0,1%; β-D-glucose 63%","α-D-glucose 63%; dạng thẳng 0,1%; β-D-glucose 37%","α-D-glucose 50%; dạng thẳng 0%; β-D-glucose 50%","α-D-glucose 10%; dạng thẳng 80%; β-D-glucose 10%"],0,"Cân bằng: α ≈ 37%, dạng thẳng ≈ 0,1%, β ≈ 63%."],
["Cầu oxy (liên kết hemiacetal/hemicetal) ở MS được tạo thành do phản ứng giữa:",["Hai nhóm aldehyde với nhau","Nhóm carboxyl với nhóm amin","Nhóm aldehyde hoặc ceton với alcol","Hai nhóm alcol với nhau"],2,"Aldehyde hoặc ceton + alcol → bán acetal hoặc bán cetal (cầu oxy)."],
["Khi glucose bị oxy hóa ở C6 (nhóm alcol bậc 1) sẽ tạo thành:",["Glucuronic acid","Gluconic acid","Glucosaccharic acid","Sorbitol"],0,"Oxy hóa ở C6 tạo glucuronic acid. Ở C1 tạo gluconic acid, ở C1 và C6 tạo glucosaccharic acid."],
["Khi glucose hoặc fructose được khử (+H₂) sẽ tạo thành polyalcol là:",["Gluconic acid","Furfural","Glucuronic acid","Sorbitol"],3,"Khử glucose hoặc fructose bằng H₂ tạo sorbitol."],
["Phản ứng Molisch dựa trên tính chất nào của MS?",["Tính khử với muối kim loại nặng","Tác dụng với acid vô cơ mạnh đậm đặc, tạo furfural rồi kết hợp với phenol cho hợp chất màu","Tạo este với acid phosphoric","Tạo liên kết glycoside"],1,"Acid vô cơ đặc làm mất nước MS tạo furfural, kết hợp phenol cho hợp chất màu (Molisch, Seliwanoff)."],
["Các este quan trọng nhất của MS là:",["Este acetat","Este sulfat","Este phosphat (ví dụ Glucose-6-phosphate)","Este carbonat"],2,"Este phosphat là quan trọng nhất (G6P, F6P, F-1,6-diP)."],
["Nhóm –OH bán acetal của MS kết hợp với nhóm –NH₂ của chất khác sẽ tạo liên kết:",["N-glycoside","O-glycoside","Peptid","Ester"],0,"–OH bán acetal + –NH₂ → N-glycoside; với –OH → O-glycoside."],
["D-Ribose có vai trò:",["Thành phần của glycoprotein","Thành phần của lyxoflavin ở cơ tim","Có trong gôm Arabic","Thành phần cấu tạo của acid nucleic và các coenzyme (ATP, NAD, NADP)"],3,"D-Ribose là thành phần của acid nucleic và các coenzyme."],
["Pentose nào xuất hiện trong nước tiểu người bị bệnh pentose niệu?",["D-Ribose","L-Xylulose","D-Arabinose","D-Lyxose"],1,"L-Xylulose xuất hiện trong nước tiểu người bị bệnh pentose niệu."],
["Galactose có nguồn gốc chủ yếu từ:",["Thủy phân tinh bột","Thủy phân đường mía","Thủy phân lactose","Thủy phân cellulose"],2,"Galactose có từ sự thủy phân lactose."],
["Disaccharide (DS) không còn tính khử khi:",["Cả 2 nhóm –OH bán acetal (hoặc bán cetal) của 2 MS đều tham gia tạo liên kết glycosid","Còn nhóm –OH bán acetal tự do","Có chứa glucose","Có liên kết α-1,4"],0,"Cả 2 –OH bán acetal đều tham gia liên kết thì DS không còn tính khử."],
["Maltose được cấu tạo bởi:",["α-D-glucose và β-D-fructose nối bằng liên kết 1,2","β-D-galactose và α-D-glucose nối bằng liên kết 1,4","2 phân tử β-D-glucose nối bằng liên kết β-1,4","2 phân tử α-D-glucopyranose nối bằng liên kết α-1,4-glycosid; có tính khử"],3,"Maltose gồm 2 α-D-glucopyranose nối α-1,4, có tính khử."],
["Phát biểu đúng về lactose:",["Có nhiều trong mía và củ cải đường","Có trong sữa, gồm galactose nối glucose bằng liên kết 1,4-β-galactosid, có tính khử","Không còn tính khử","Được tạo thành do thủy phân tinh bột"],1,"Lactose có trong sữa, nối 1,4-β-galactosid, có tính khử."],
["Saccarose (sucrose):",["Có tính khử mạnh","Gồm 2 phân tử glucose","Gồm α-D-glucopyranose nối β-D-fructofuranose bằng liên kết 1,2, không còn tính khử","Có nhiều trong sữa"],2,"Saccarose nối α-glucose và β-fructose bằng liên kết 1,2, không còn tính khử."],
["Phát biểu đúng về amylose:",["Có nhiều mạch nhánh với liên kết α-1,6","Gồm các đơn vị β-D-glucose nối bằng liên kết β-1,4","Cho màu đỏ tím với iodine","Gồm vài trăm đến vài nghìn đơn vị α-D-glucose nối α-1,4, mạch thẳng, có thể xoắn, cho màu xanh tím với iodine"],3,"Amylose: mạch thẳng α-1,4, xoắn (6 đơn vị glucose/vòng), màu xanh tím với iodine."],
["Amylopectin khác amylose ở điểm:",["Có thêm liên kết α-1,6 glucosid tạo mạch nhánh (mỗi nhánh 24–30 đơn vị glucose), cho màu đỏ tím với iodine","Tan hoàn toàn trong nước","Chỉ có mạch thẳng","Cho màu xanh tím với iodine"],0,"Amylopectin có α-1,6 tạo nhánh (24–30 glucose/nhánh), màu đỏ tím với iodine."],
["Glycogen giống amylopectin nhưng:",["Ít nhánh hơn, nhánh dài hơn","Chỉ có ở thực vật","Nhiều nhánh hơn, mỗi nhánh ngắn hơn (8–12 gốc glucose), cho màu đỏ nâu với iodine","Không bị thủy phân tạo glucose"],2,"Glycogen nhiều nhánh hơn, mỗi nhánh 8–12 gốc glucose, màu đỏ nâu với iodine."],
["Về cellulose, phát biểu nào sau đây đúng?",["Gồm các đơn vị α-D-glucose nối bằng liên kết α-1,4","Là thành phần chủ yếu của màng tế bào thực vật, liên kết β-1,4, không có mạch nhánh","Người tiêu hóa được nhờ enzyme amylase","Tan tốt trong nước"],1,"Cellulose là thành phần chính của màng tế bào TV, nối β-1,4, không phân nhánh."],
["Dextran:",["Là homopolysaccharide của fructose","Có trong vỏ ĐV chân đốt","Dùng thăm dò mức lọc cầu thận","Do vi sinh vật sản xuất, là homopolysaccharide của α-D-glucose, có mạch nhánh, độ nhớt cao, dùng làm chất thay thế huyết tương"],3,"Dextran do VSV sản xuất, α-glucose, có nhánh, độ nhớt cao, dùng thay thế huyết tương."],
["Phát biểu đúng về heparin:",["Có nhiều ở gan, phổi, máu; là chất chống đông máu, được dùng trong y học","Có ở thủy tinh dịch, dịch khớp","Có trong mô sụn với 3 loại A, B, C","Là thành phần của kháng nguyên nhóm máu"],0,"Heparin có nhiều ở gan, phổi, máu; là chất chống đông máu."],
["Nhóm hormone nào sau đây có bản chất glycoprotein?",["Insulin, glucagon, adrenalin","Thyroxin, cortisol, estrogen","LH, FSH, TSH","Progesterone, testosterone, aldosteron"],2,"LH, FSH, TSH là hormone có bản chất glycoprotein."],
["Ở miệng, enzyme nào của tuyến nước bọt thủy phân liên kết α(1-4) glycoside trong tinh bột tạo thành dextrin?",["Maltase","α-amylase","Lactase","Sucrase"],1,"α-amylase nước bọt thủy phân liên kết α(1-4) tạo dextrin."],
["Tại dạ dày, quá trình tiêu hóa amylose và amylopectin diễn ra như thế nào?",["Được thủy phân hoàn toàn thành glucose","Được thủy phân thành maltose nhờ pepsin","Được thủy phân nhờ HCl thành fructose","Không có sự tiêu hóa vì tính acid của dịch vị làm mất hoạt động của α-amylase"],3,"Acid dịch vị làm mất hoạt động α-amylase nên dạ dày không tiêu hóa tinh bột."],
["Enzyme carbohydrase duy nhất có khả năng thủy phân liên kết α(1-6) glycoside ở viền bàn chải ruột non là:",["α-dextrinase","Maltase","Sucrase","Lactase"],0,"α-dextrinase là enzyme duy nhất thủy phân được liên kết α(1-6)."],
["Tốc độ hấp thu monosaccharide tại tế bào ruột từ nhanh đến chậm là:",["Glucose > Galactose > Fructose","Fructose > Glucose > Galactose","Galactose > Glucose > Fructose","Fructose > Galactose > Glucose"],2,"Tốc độ hấp thu: galactose > glucose > fructose."],
["SGLT1 ở tế bào ruột có chức năng:",["Đưa glucose, galactose, fructose ra máu","Vận chuyển đồng thời glucose (hoặc galactose) và Na⁺ vào tế bào biểu mô ruột","Chỉ vận chuyển fructose","Vận chuyển insulin"],1,"SGLT1 vận chuyển đồng thời glucose (galactose) và Na⁺ vào tế bào ruột."],

["Chất vận chuyển nào chỉ vận chuyển fructose mà không vận chuyển glucose?",["GLUT1","GLUT2","GLUT3","GLUT5"],3,"GLUT5 chỉ vận chuyển fructose, không vận chuyển glucose."],
["GLUT4 được biểu hiện chủ yếu ở:",["Hồng cầu và não","Gan và tế bào β tụy","Cơ xương, tim và tế bào mỡ","Tinh hoàn"],2,"GLUT4 có ở cơ xương, tim, tế bào mỡ trắng và mỡ nâu."],
["Phản ứng số 1 của đường phân (glucose → glucose-6-phosphate) được xúc tác bởi:",["Hexokinase, cần Mg²⁺ và ATP","Phosphofructokinase-1","Pyruvate kinase","Aldolase"],0,"Phản ứng 1: hexokinase, cần Mg²⁺ và ATP, tạo G6P."],
["Glucokinase ở gan phosphoryl hóa glucose khi:",["Glucose máu giảm thấp","Gan đang cạn kiệt ATP","Có mặt fluoride","Glucose máu tăng cao"],3,"Glucokinase ở gan chỉ hoạt động khi glucose máu tăng cao."],

const L="ABCD";
let items=[],ans={},done=false;
const $=id=>document.getElementById(id);
function build(shuffle){
  const p=$("part").value;
  items=D.map((d,i)=>({d,n:i+1})).filter(x=>p==="all"||(p==="1"?x.n<=35:x.n>35));
  if(shuffle)for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
  ans={};done=false;$("res").className="res";render();
}
function render(){
  const inst=$("inst").checked;
  $("list").innerHTML=items.map((x,k)=>{
    const [q,o,c,e]=x.d,a=ans[x.n],show=done||(inst&&a!==undefined);
    return `<div class="q"><h3><span>Câu ${x.n}.</span> ${q}</h3>`+o.map((t,i)=>{
      let cl="o";
      if(show){if(i===c)cl+=" ok";else if(i===a)cl+=" no"}else if(i===a)cl+=" sel";
      return `<button class="${cl}" data-n="${x.n}" data-i="${i}"><b>${L[i]}.</b><span>${t}</span></button>`}).join("")+
      `<div class="ex ${show?"s":""}"><b>Đáp án: ${L[c]}.</b> ${e}</div></div>`}).join("");
  const n=Object.keys(ans).length;
  $("pg").style.width=(items.length?n/items.length*100:0)+"%";
}
$("list").onclick=e=>{
  const b=e.target.closest(".o");if(!b||done)return;
  const n=+b.dataset.n;
  if($("inst").checked&&ans[n]!==undefined)return;
  ans[n]=+b.dataset.i;render();
};
$("sub").onclick=()=>{
  done=true;let s=0;
  items.forEach(x=>{if(ans[x.n]===x.d[2])s++});
  const t=items.length,un=t-Object.keys(ans).length;
  $("res").innerHTML=`<big>${s}/${t}</big> câu đúng (${Math.round(s/t*100)}%)${un?` · ${un} câu chưa làm`:""}<br>Kéo xuống để xem đáp án và giải thích từng câu.`;
  $("res").className="res s";render();window.scrollTo({top:0,behavior:"smooth"});
};
$("shuf").onclick=()=>build(true);
$("rst").onclick=()=>build(false);
$("part").onchange=()=>build(false);
$("inst").onchange=render;
build(false);
</script>
