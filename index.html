.ex{display:none;margin-top:8px;padding:10px 12px;border-radius:9px;background:var(--okb);border-left:4px solid var(--ok);font-size:.93rem}
.ex.s{display:block}
.res{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px;display:none}

["Trong tế bào nhân thực, các quả bóng nhân đôi trên DNA thường phát triển theo hướng nào?",["Một hướng duy nhất","Hai hướng từ điểm khởi đầu","Không có hướng xác định","Chỉ theo chiều 3′ → 5′"],1,"Từ điểm khởi đầu, hai chạc nhân đôi thường tiến ra hai hướng; nhiều điểm Ori có thể hoạt động trên chromosome."],

["Telomerase có vai trò chính nào?",["Giúp kéo dài telomere bằng cách bổ sung các trình tự lặp ở đầu mút chromosome","Sửa mọi loại sai cặp nucleotide","Thay thế DNA ligase","Khởi đầu dịch mã"],0,"Telomerase duy trì/kéo dài telomere ở những tế bào có hoạt tính enzyme này."],
["Sửa chữa sai cặp hậu nhân đôi ở vi khuẩn có thể phân biệt mạch mới với mạch gốc dựa vào:",["Trạng thái methyl hóa của mạch gốc","Sự hiện diện của codon AUG","Độ dài của telomere","Protein histone"],0,"Trong mô hình nêu ở bài giảng, mạch gốc được methyl hóa trước; mạch mới chưa methyl hóa giúp hệ sửa chữa nhận diện vị trí sai."],

];
const L="ABCD";
let items=[],ans={},done=false;
const $=id=>document.getElementById(id);
function build(shuffle){
  const p=$("part").value;
  const source=p==="protein"?P:p==="dna"?N:D;
  items=source.map((d,i)=>({d,n:i+1})).filter(x=>source!==D||p==="all"||(p==="1"?x.n<=35:x.n>35));
  const titles={all:["Ôn tập Glucide – 70 câu trắc nghiệm","Dựa trên bài giảng Hóa học Glucide và Chuyển hóa Glucide – Th.S Nguyễn Thu Hà (PNT)."],"1":["Ôn tập Glucide – Phần Hóa học","Dựa trên bài giảng Hóa học Glucide – Th.S Nguyễn Thu Hà (PNT)."],"2":["Ôn tập Glucide – Phần Chuyển hóa","Dựa trên bài giảng Chuyển hóa Glucide – Th.S Nguyễn Thu Hà (PNT)."],protein:["Ôn tập Bài 14 – Sinh tổng hợp protein","Câu hỏi về các giai đoạn dịch mã ở prokaryote và eukaryote."],dna:["Ôn tập Bài 3 – Sự nhân đôi và sửa chữa DNA","Câu hỏi về nhân đôi DNA, telomere và các cơ chế sửa chữa DNA."]};
  $("title").textContent=titles[p][0];$("subtitle").textContent=titles[p][1];document.title=titles[p][0];
  if(shuffle)for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}
  ans={};done=false;$("res").className="res";render();
}
function render(){
  const inst=$("inst").checked;
  $("list").innerHTML=items.map((x,k)=>{
    const [q,o,c,e]=x.d,a=ans[x.n],show=done||(inst&&a!==undefined);
    return `<div class="q"><h3><span>Câu ${x.n}.</span> ${q}</h3>`+o.map((t,i)=>{
      let cl="o";
      if(show){if(i===c)cl+=" ok";else if(i===a)cl+=" no"}else if(i===a)cl+=" sel";
      return `<button class="${cl}" data-n="${x.n}" data-i="${i}"><b>${L[i]}.</b><span>${t}</span></button>`}).join("")+
      `<div class="ex ${show?"s":""}"><b>Đáp án: ${L[c]}.</b> ${e}</div></div>`}).join("");
  const n=Object.keys(ans).length;
  $("pg").style.width=(items.length?n/items.length*100:0)+"%";
}
$("list").onclick=e=>{
  const b=e.target.closest(".o");if(!b||done)return;
  const n=+b.dataset.n;
  if($("inst").checked&&ans[n]!==undefined)return;
  ans[n]=+b.dataset.i;render();
};
$("sub").onclick=()=>{
  done=true;let s=0;
  items.forEach(x=>{if(ans[x.n]===x.d[2])s++});
  const t=items.length,un=t-Object.keys(ans).length;
  $("res").innerHTML=`<big>${s}/${t}</big> câu đúng (${Math.round(s/t*100)}%)${un?` · ${un} câu chưa làm`:""}<br>Kéo xuống để xem đáp án và giải thích từng câu.`;
  $("res").className="res s";render();window.scrollTo({top:0,behavior:"smooth"});
};
$("shuf").onclick=()=>build(true);
$("rst").onclick=()=>build(false);
$("part").onchange=()=>build(false);
$("inst").onchange=render;
build(false);
</script>
