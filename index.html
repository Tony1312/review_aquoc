const CAR=[
  ["Myoglobin là một protein cấu trúc chứa Heme có đặc điểm sinh hóa nào sau đây?",["Là chỉ dấu hoại tử cơ xuất hiện rất sớm trong máu (1-2h) nhưng KHÔNG đặc hiệu cho cơ tim","Đặc hiệu tuyệt đối cho tổn thương cơ tim","Chỉ tăng sau 24 giờ nhồi máu","Tồn tại kéo dài 14 ngày trong máu"],0,"Myoglobin có kích thước nhỏ nên phóng thích rất nhanh khi tổn thương cơ (1-2h), nhưng có cả ở cơ vân nên độ đặc hiệu cơ tim thấp."],
  ["Protein Dystrophin có vai trò sinh học quan trọng nào trong tế bào cơ?",["Liên kết khung xương tế bào (actin) với phức hợp glycoprotein màng tế bào cơ","Xúc tác phản ứng tạo ATP","Gắn Ca2+ để khởi động co cơ","Oxy hóa acid béo"],0,"Dystrophin neo giữ khung xương actin nội bào với màng tế bào sarcolemma, giúp màng cơ bền vững khi co giãn."],
  ["Bệnh Teo cơ Duchenne (DMD) khác với Bệnh Teo cơ Becker (BMD) về bản chất di truyền và lâm sàng như thế nào?",["DMD do đột biến mất đoạn làm mất hoàn toàn Dystrophin (bệnh nặng); BMD đột biến nhẹ hơn vẫn còn một phần Dystrophin (bệnh nhẹ hơn)","DMD nhẹ hơn BMD","BMD xuất hiện ngay từ lúc mới sinh","Cả hai đều do đột biến trên nhiễm sắc thể thường"],0,"DMD là đột biến lệch khung làm mất hẳn Dystrophin gây teo cơ nặng diễn tiến nhanh. BMD giữ được khung đọc nên còn một phần dystrophin chức năng, tiến triển chậm hơn."],
  ["Phức hợp Troponin cơ tim gồm 3 tiểu đơn vị nào?",["Troponin T (cTnT), Troponin I (cTnI), và Troponin C (TnC)","Troponin A, B, C","Troponin M, H, B","Troponin 1, 2, 3"],0,"Phức hợp Troponin điều hòa co cơ gồm 3 phân tử: Troponin T (gắn tropomyosin), Troponin I (ức chế), và Troponin C (gắn Ca2+)."],
  ["Tiểu đơn vị Troponin C (TnC) có đặc điểm gì khiến nó KHÔNG ĐƯỢC DÙNG làm chất chỉ điểm sinh học hoại tử cơ tim?",["Cấu trúc amino acid của TnC ở cơ tim hoàn toàn giống hệt với TnC ở cơ vân","TnC không giải phóng vào máu","TnC có trọng lượng phân tử quá lớn","TnC bị phân hủy ngay lập tức"],0,"TnC ở cơ tim và cơ vân có chuỗi acid amin giống nhau 100%, không có isoenzyme đặc hiệu tim nên không dùng làm marker cơ tim."],
  ["Chức năng sinh học của Troponin T (cTnT) trong phức hợp troponin là gì?",["Gắn phức hợp troponin với sợi Tropomyosin","Gắn ion Ca2+","Ức chế hoạt tính actin-myosin ATPase","Thủy phân ATP"],0,"Troponin T đảm nhận nhiệm vụ neo gắn toàn bộ phức hợp Troponin vào phân tử Tropomyosin trên sợi mỏng."],
  ["Chức năng sinh học của Troponin I (cTnI) khi KHÔNG có ion Ca2+ là gì?",["Gắn vào actin và ức chế enzyme actin-myosin ATPase, ngăn cản sự co cơ","Gắn Ca2+","Đẩy tropomyosin ra","Tổng hợp Myosin"],0,"Không có Ca2+, cTnI gắn chặt actin ức chế actin-myosin ATPase giữ cơ ở trạng thái dãn. Khi có Ca2+, TnC gắn Ca2+ làm cTnI rời khỏi actin cho phép co cơ."],
  ["Tỷ lệ Troponin hòa tan nằm tự do trong bào tương (cytosolic pool) của tế bào cơ tim là bao nhiêu?",["cTnT khoảng ~ 6%, cTnI khoảng ~ 3%","cTnT khoảng 50%, cTnI khoảng 50%","100% nằm tự do","0% tự do"],0,"Troponin phần lớn gắn sợi cơ, chỉ có một lượng nhỏ tự do trong bào tương: cTnT (~6%) và cTnI (~3%)."],
  ["Sự xuất hiện sớm của Troponin trong máu (từ 0-3h) sau khi tổn thương tế bào cơ tim là do giải phóng từ nguồn nào?",["Giải phóng từ lượng Troponin hòa tan tự do trong bào tương","Giải phóng do phân hủy sợi myofibril liên kết","Do tủy xương tăng tổng hợp","Do giảm đào thải qua thận"],0,"Khi màng tế bào cơ tim bị tổn thương/thấm muộn, lượng Troponin tự do trong bào tương lập tức thoát ra máu sớm (0-3h)."],
  ["Sự gia tăng Troponin kéo dài nhiều ngày (10 - 14 ngày) trong máu sau Nhồi máu cơ tim cấp là do quá trình nào?",["Sự ly giải chậm và liên tục của phức hợp Troponin gắn trong cấu trúc sợi cơ (myofibrils) bị hoại tử","Tế bào gan tiếp tục tiết troponin","Thận không đào thải được troponin","Troponin tự nhân lên trong máu"],0,"Sự hoại tử và phân hủy từ từ cấu trúc tơ cơ (bound pool) giúp Troponin duy trì nồng độ cao kéo dài trong máu nhiều ngày."],
  ["Dạng Troponin nào là dạng chính lưu hành trong máu sau tổn thương cơ tim do tính ổn định cao?",["cTnT tự do","cTnI tự do","TnC tự do","Phức hợp Actin-Myosin"],0,"cTnT tự do rất ổn định trong tuần hoàn và là dạng chỉ dấu chủ yếu. Trong khi cTnI dễ bị protease phân hủy thành nhiều mảnh."],
  ["Trọng lượng phân tử của cTnT và cTnI lần lượt là khoảng bao nhiêu?",["cTnT ~ 39 kDa và cTnI ~ 22.5 kDa","cTnT ~ 100 kDa và cTnI ~ 50 kDa","cTnT ~ 17 kDa và cTnI ~ 68 kDa","Hai chất bằng nhau ~ 30 kDa"],0,"Trọng lượng phân tử của cTnT là ~39 kDa, cTnI nhỏ hơn khoảng ~22.5 kDa."],
  ["Đặc điểm khác biệt quan trọng về Kỹ thuật xét nghiệm giữa cTnT và cTnI hiện nay là gì?",["cTnT đã được chuẩn hóa 1 giá trị đối chiếu toàn cầu; cTnI chưa chuẩn hóa có nhiều giá trị đối chiếu khác nhau giữa các hãng","cTnI đã chuẩn hóa còn cTnT thì chưa","Cả hai đều chưa chuẩn hóa","Cả hai dùng chung một hóa chất xét nghiệm"],0,"cTnT do duy nhất một hãng bản quyền sản xuất nên có 1 giá trị đối chiếu chuẩn hóa. cTnI do nhiều hãng sản xuất với các kháng thể khác nhau nên kết quả chênh lệch giữa các máy."],
  ["Động học xuất hiện và kéo dài của cTnT trong máu sau Nhồi máu cơ tim cấp như thế nào?",["Xuất hiện sau 0-3h, đạt đỉnh 12-24h, kéo dài đến 14 ngày","Xuất hiện sau 24h, đạt đỉnh 3 ngày, kéo dài 1 tháng","Xuất hiện sau 12h, biến mất sau 48h","Tăng liên tục không giảm"],0,"cTnT tăng sớm từ 0-3h, đạt đỉnh sau 12-24h và duy trì trong máu tới 14 ngày (cửa sổ chẩn đoán rất rộng)."],
  ["Động học trong máu của cTnI sau Nhồi máu cơ tim cấp là gì?",["Xuất hiện sau 0-3h, đạt đỉnh khoảng 24h, kéo dài đến 10 ngày","Xuất hiện sau 10h, kéo dài 2 ngày","Đạt đỉnh ngay sau 1h","Kéo dài 30 ngày"],0,"cTnI xuất hiện 0-3h, đạt đỉnh ~24h và kéo dài khoảng 10 ngày."],
  ["So với enzyme CK-MB, ưu thế vượt trội của Troponin (cTnT/cTnI) trong chẩn đoán tổn thương cơ tim là gì?",["Độ nhạy và độ đặc hiệu cao hơn hẳn, phát hiện được vi tổn thương/vi hoại tử và thời gian cửa sổ chẩn đoán dài hơn","Troponin giảm nhanh hơn CK-MB","Troponin rẻ tiền hơn","CK-MB đặc hiệu cho tim hơn troponin"],0,"Troponin thay thế CK-MB do có độ đặc hiệu cơ tim tuyệt đối, phát hiện được tổn thương vi hoại tử rất nhỏ mà CK-MB bỏ sót, cửa sổ kéo dài 10-14 ngày (CK-MB chỉ 48h)."],
  ["Mức điểm cắt (Cut-point) cTnT theo Tiêu chuẩn WHO cũ là bao nhiêu?",["> 0.1 ng/mL (µg/L)","> 0.05 ng/mL","> 0.014 ng/mL","> 1.0 ng/mL"],0,"Tiêu chuẩn WHO truyền thống lấy điểm cắt cTnT > 0.1 ng/mL làm ranh giới quyết định lâm sàng."],
  ["Mức ngưỡng bình thường (Bách phân vị thứ 99 - 99th percentile) trong dân số khỏe mạnh đối với hs-cTnT (Troponin T siêu nhạy) là bao nhiêu?",["0.014 ng/mL (14 pg/mL)","0.1 ng/mL","0.05 ng/mL","1.0 ng/mL"],0,"Ngưỡng bách phân vị 99th của hs-cTnT ở người bình thường là 0.014 ng/mL (tương đương 14 ng/L hay pg/mL)."],
  ["Để xác lập chẩn đoán Nhồi máu cơ tim cấp khi theo dõi động học cTnT lặp lại (sau 3h hoặc 6h), tỷ lệ thay đổi (Delta) cTnT cần đạt tối thiểu bao nhiêu đối với xét nghiệm thế hệ 4?",["Tăng >= 50% so với giá trị ban đầu","Tăng >= 10%","Không thay đổi","Giảm 50%"],0,"Theo khuyến cáo thế hệ 4, sự gia tăng động học Delta cTnT >= 50% sau 3h/6h giúp xác định tổn thương hoại tử cơ tim cấp tính."],
  ["Các tổ chức tim mạch uy tín toàn cầu nào đã chính thức đồng thuận công nhận cTnT là 'chỉ dấu tiêu chuẩn hóa để chẩn đoán NMCT cấp và Hội chứng mạch vành cấp'?",["ACC, ESC, AHA","WHO và UNICEF","CDC và FDA","NIH và NHS"],0,"ACC (Trường Môn Tim mạch Hoa Kỳ), ESC (Hội Tim mạch Châu Âu) và AHA (Hội Tim mạch Hoa Kỳ) đều đồng thuận lấy Troponin làm tiêu chuẩn vàng."],
  ["Giá trị tiên đoán âm (Negative Predictive Value) của hs-cTnT trong loại trừ Hội chứng vành cấp là bao nhiêu?",["> 85% (rất cao)","< 50%","Chỉ khoảng 20%","100% tuyệt đối"],0,"hs-cTnT có giá trị tiên đoán âm rất cao (>85-99%), nếu kết quả âm tính lặp lại giúp bác sĩ loại trừ an toàn Hội chứng vành cấp."],
  ["Thành phần Isoenzyme CK nào có tỷ lệ cao nhất trong cơ tim và được dùng làm chỉ dấu cơ tim truyền thống?",["CK-MB","CK-MM","CK-BB","CK-Mt"],0,"CK-MB chiếm khoảng 15-30% tổng lượng CK ở cơ tim (ở cơ vân CK-MM chiếm >98%), trước đây là tiêu chuẩn vàng chẩn đoán NMCT."],
  ["Isoenzyme LDH nào có nồng độ cao nhất ở cơ tim và tạo hiện tượng 'đảo ngược LDH' (LDH1 > LDH2) khi có Nhồi máu cơ tim?",["LDH1 (H4)","LDH5 (M4)","LDH3","LDH4"],0,"Bình thường LDH2 > LDH1 trong máu. Khi tổn thương cơ tim, lượng lớn LDH1 (H4) giải phóng làm tỷ lệ LDH1/LDH2 > 1.0 (đảo ngược LDH)."],
  ["Trong tế bào cơ tim, năng lượng ATP cung cấp cho sự co cơ được tái tạo nhanh nhất từ nguồn dự trữ nào?",["Phosphocreatine (PCr) nhờ enzyme Creatine Kinase (CK)","Glycogenolysis","Đường phân kỵ khí","Oxy hóa amino acid"],0,"Phosphocreatine đóng vai trò đệm năng lượng, chuyển nhanh nhóm phosphate cho ADP tái tạo ATP nhờ enzyme Creatine Kinase."],
  ["Nguyên nhân chính khiến cTnI bị thoái hóa và tồn tại dưới nhiều dạng phân tử phức tạp trong máu là gì?",["Tác động của các enzyme protease phân giải protein trong máu và trong mô tổn thương","Do tương tác với Glucose","Do lọc qua cầu thận","Do ánh sáng mặt trời"],0,"cTnI rất nhạy cảm với các enzyme protease huyết thanh, làm nó bị ly giải cắt đoạn thành vô số dạng tự do và phức hợp."],
  ["Để đạt được nồng độ phát hiện 0.1 ng/mL trong máu, thương tổn cơ tim yêu cầu đối với cTnI phải như thế nào so với cTnT?",["Cần sang thương tổn thương cơ tim lớn gấp khoảng 3.5 lần so với cTnT","Cần sang thương nhỏ hơn","Cần sang thương bằng nhau","Không liên quan đến kích thước sang thương"],0,"Do tỷ lệ hòa tan trong bào tương của cTnI (~3%) thấp hơn cTnT (~6%), nên để đạt nồng độ 0.1 ng/mL máu thì thể tích cơ tim hoại tử đối với cTnI phải lớn gấp 3.5 lần."],
  ["Troponin T siêu nhạy (hs-cTnT) có khả năng phát hiện nồng độ Troponin ở mức độ nào?",["Mức độ ng/L (pg/mL), nhạy gấp hàng chục lần so với xét nghiệm thế hệ cũ","Mức độ mg/dL","Mức độ g/L","Chỉ phát hiện khi cTnT > 1.0 ng/mL"],0,"hs-cTnT có độ nhạy cực cao, định lượng chính xác các nồng độ troponin siêu nhỏ ở mức ng/L (pg/mL)."],
  ["Trường hợp nào sau đây có thể làm TĂNG Troponin máu nhưng KHÔNG PHẢI do Hội chứng vành cấp (Non-ACS)?",["Suy thận mãn, Thuyên tắc phổi, Viêm cơ tim, Suy tim cấp","Viêm họng hạt","Gãy xương cẳng chân đơn thuần","Đái tháo đường chưa biến chứng"],0,"Troponin đặc hiệu cho tổn thương cơ tim nhưng KHÔNG đặc hiệu cho nguyên nhân. Suy thận, viêm cơ tim, suy tim, thuyên tắc phổi đều gây căng/tổn thương cơ tim làm tăng troponin."],
  ["Protein Myoglobin bắt đầu tăng trong máu sau tổn thương cơ tim cấp sau bao lâu?",["1 - 2 giờ","12 - 24 giờ","3 - 5 ngày","7 ngày"],0,"Myoglobin nhỏ gọn nên giải phóng rất sớm từ 1-2h sau đau ngực, đạt đỉnh 6-9h và trở về bình thường sau 24h."],
  ["Hormone BNP và NT-proBNP do tế bào cơ tâm thất tiết ra khi bị căng thành thất được dùng làm chỉ dấu sinh học tiêu chuẩn cho bệnh lý nào?",["Chẩn đoán và tiên lượng Suy tim (Heart Failure)","Chẩn đoán Viêm gan cấp","Chẩn đoán Viêm tụy cấp","Chẩn đoán Suy thượng thận"],0,"BNP và NT-proBNP giải phóng khi tâm thất bị quá tải áp lực/thể tích, là marker vàng trong chẩn đoán và theo dõi Suy tim."],
  ["Sự co cơ tim diễn ra khi ion Ca2+ gắn vào tiểu đơn vị nào của phức hợp Troponin?",["Troponin C (TnC)","Troponin T (cTnT)","Troponin I (cTnI)","Tropomyosin"],0,"Khi điện thế hoạt động mở kênh Ca2+, Ca2+ gắn vào TnC làm biến đổi cấu trúc kéo cTnI ra khỏi actin, khởi động chu kỳ co cơ."],
  ["Đặc điểm di truyền của Bệnh teo cơ Duchenne (DMD) là gì?",["Di truyền lặn liên kết nhiễm sắc thể X (chủ yếu gặp ở nam giới)","Di truyền trội trên NST thường","Di truyền qua ti thể","Di truyền liên kết NST Y"],0,"Gen Dystrophin nằm trên NST X. DMD là bệnh di truyền lặn liên kết X, mẹ mang gen bệnh truyền cho con trai."],
  ["Trong chẩn đoán Nhồi máu cơ tim cấp, việc lấy máu xét nghiệm Troponin lần 2 nên thực hiện vào thời điểm nào sau lần 1?",["Sau 3 giờ (hoặc 6 giờ)","Sau 24 giờ","Sau 7 ngày","Sau 30 phút"],0,"Khuyến cáo lâm sàng thực hiện xét nghiệm Troponin thời điểm ban đầu (0h) và lặp lại sau 3h (hoặc 6h) để đánh giá sự gia tăng động học (Delta)."],
  ["Tại sao cTnT lại có độ đặc hiệu cơ tim cao hơn so với enzyme CK-MB?",["Vì cTnT mang chuỗi acid amin đặc trưng chỉ có ở cơ tim, trong khi CK-MB vẫn có một lượng nhỏ ở cơ vân","Vì CK-MB không có trong tim","Vì cTnT tan hoàn toàn trong nước","Vì cTnT sản xuất ở gan"],0,"cTnT được mã hóa bởi gen riêng biệt ở cơ tim. CK-MB tuy ưu thế ở tim nhưng vẫn chiếm 1-3% ở cơ vân nên chấn thương cơ vân rộng vẫn làm tăng CK-MB."],
  ["Mô cơ tim sử dụng nguồn chất chất đốt nào làm năng lượng chính ở điều kiện hiếu khí bình thường?",["Acid béo tự do (chiếm 60 - 80%)","Glucose","Lactate","Amino acid"],0,"Cơ tim hoạt động liên tục hiếu khí, ưu tiên sử dụng Beta-oxy hóa Acid béo tự do cung cấp 60-80% ATP."],
  ["Khi có tình trạng Thiếu máu cơ tim cấp (Ischemia), sự chuyển hóa năng lượng ở cơ tim thay đổi ra sao?",["Chuyển từ oxy hóa acid béo sang đường phân kỵ khí, tích tụ Lactate và gây giảm pH nội bào","Tăng oxy hóa acid béo","Tăng tổng hợp glycogen","Không thay đổi"],0,"Thiếu oxy làm trệch chuỗi hô hấp tế bào, cơ tim buộc phải đường phân kỵ khí tạo Lactate làm toan hóa tế bào cơ tim."],
  ["Sự khác biệt về thời gian duy trì nồng độ cao trong máu giữa cTnT (14 ngày) và CK-MB (48h) có ý nghĩa lâm sàng gì?",["cTnT giúp chẩn đoán NMCT ở bệnh nhân đến viện muộn sau vài ngày; CK-MB giúp phát hiện tái nhồi máu cấp (Re-infarction) sớm hơn","cTnT chỉ dùng cho ngày đầu","CK-MB dùng chẩn đoán muộn hơn","Không có ý nghĩa"],0,"cTnT kéo dài giúp phát hiện NMCT muộn. Tuy nhiên vì cTnT kéo dài 2 tuần nên nếu có tái nhồi máu mới sau vài ngày, CK-MB (trở về bình thường sau 48h) sẽ giúp nhận biết đợt tăng mới tốt hơn."],
  ["Giá trị cTnT thế hệ 4 từ bao nhiêu ng/mL được xem là ngưỡng giới hạn quan sát (Observation limit)?",["> 0.05 ng/mL","> 0.1 ng/mL","> 0.014 ng/mL","> 0.5 ng/mL"],0,"Theo phân loại xét nghiệm cTnT thế hệ 4, ngưỡng quan sát là > 0.05 ng/mL (khi đó cần theo dõi Delta sau 3-6h, nếu tăng >=50% xác lập NMCT)."],
  ["Trường hợp bệnh nhân bị Suy thận mãn giai đoạn cuối thường có tăng cTnT mãn tính nhẹ do cơ chế nào?",["Giảm độ thanh thải qua thận kết hợp với tổn thương vi hoại tử cơ tim âm thầm mãn tính","Thận tự sản xuất cTnT","Sai số máy xét nghiệm","Tăng tổng hợp ở xương"],0,"Bệnh nhân suy thận mãn vừa giảm đào thải troponin vừa có bệnh cơ tim thiếu máu/phì đại thất trái vi tổn thương làm cTnT tăng nền mãn tính."],
  ["Chỉ số hs-cTnT (High-sensitivity Troponin T) tuân thủ theo tiêu chuẩn kĩ thuật nào?",["Định lượng được troponin ở > 50% người bình thường và có hệ số biến thiên CV < 10% tại ngưỡng 99th percentile","Chỉ định lượng được khi troponin rất cao","Độ biến thiên CV > 30%","Không thể chạy trên máy tự động"],0,"Tiêu chuẩn định nghĩa hs-cTn là phát hiện được cTn ở >=50% người khỏe mạnh và có độ chụm cao (CV <= 10%) ở ngưỡng bách phân vị 99th."],
  ["Tổn thương hoại tử cơ tim trong Viêm cơ tim (Myocarditis) làm thay đổi biểu đồ Troponin máu như thế nào?",["Tăng Troponin máu kéo dài hoặc tạo nhiều đỉnh nhỏ do tình trạng viêm hoại tử rải rác","Không làm tăng Troponin","Troponin giảm xuống 0","Chỉ tăng Myoglobin"],0,"Viêm cơ tim gây tổn thương viêm và hoại tử tế bào cơ tim làm giải phóng Troponin vào máu (thường kéo dài và dao động tùy mức độ viêm)."],
  ["Enzyme Creatine Kinase (CK) là một dimer gồm 2 loại chuỗi bán đơn vị nào?",["M (Muscle) và B (Brain)","H (Heart) và M (Muscle)","Alpha và Beta","A và B"],0,"CK cấu tạo từ 2 chuỗi M và B, tạo nên 3 isoenzyme chính: CK-MM (cơ vân), CK-MB (cơ tim), và CK-BB (não)."],
  ["Phân tử Dystrophin có trọng lượng phân tử cực lớn khoảng bao nhiêu?",["427 kDa","39 kDa","22.5 kDa","68 kDa"],0,"Dystrophin là một trong những protein lớn nhất trong cơ thể với trọng lượng phân tử khoảng 427 kDa (mã hóa bởi gen dài 2.4 Mb trên NST X)."],
  ["Khi bệnh nhân có biểu hiện Đau ngực cấp vào viện sớm trong vòng 1-2 giờ đầu, xét nghiệm nào có khả năng TĂNG SỚM NHẤT để loại trừ hoại tử cơ tim?",["Myoglobin (kết hợp hs-cTnT)","LDH1","AST","CK-MM"],0,"Myoglobin tăng rất sớm (1-2h). Nếu Myoglobin âm tính kết hợp hs-cTnT âm tính giúp loại trừ sớm tổn thương cơ tim cấp."],
  ["Nồng độ cTnI trong máu sau biến cố thiếu máu cục bộ cơ tim đạt đỉnh vào thời điểm nào?",["24 giờ","2 giờ","14 ngày","72 giờ"],0,"Nồng độ cTnI máu bắt đầu tăng sau 0-3h và đạt đỉnh cao nhất sau khoảng 24h."],
  ["Biến đổi sinh hóa nào diễn ra tại sợi tơ cơ tim khi nồng độ Ca2+ trong bào tương tăng lên trong thì tâm thu?",["Ca2+ gắn TnC -> biến đổi cấu trúc giải phóng cTnI khỏi actin -> dịch chuyển Tropomyosin -> lộ vị trí gắn Myosin trên Actin","Ca2+ làm phân hủy Actin","Ca2+ gắn cTnT làm vỡ tơ cơ","Ca2+ ức chế hoàn toàn PKA"],0,"Ca2+ gắn TnC giải phóng sự ức chế của cTnI, làm tropomyosin trượt sâu vào rãnh actin, bộc lộ vị trí để đầu Myosin gắn vào gập góc gây co cơ."],
  ["Chất nào sau đây được giải phóng cùng với cTnT từ tế bào cơ tim khi có hiện tượng vi hoại tử (Minor myocardial injury)?",["Một lượng nhỏ cTnT tự do bào tương","CK-MM khối lượng lớn","LDH5","Myosin chuỗi nặng"],0,"Tổn thương vi hoại tử nhỏ chỉ làm thoát lượng cTnT hòa tan tự do bào tương, phát hiện được nhờ phương pháp siêu nhạy hs-cTnT."],
  ["Đặc điểm nào đúng đối với xét nghiệm hs-cTnT (Troponin T siêu nhạy)?",["Giúp phát hiện tổn thương cơ tim ở giai đoạn rất sớm và rút ngắn thời gian theo dõi loại trừ NMCT xuống 1-2 giờ","Độ đặc hiệu kém hơn xét nghiệm cũ","Chỉ dùng cho chẩn đoán viêm cơ tim","Không thay đổi theo thời gian"],0,"hs-cTnT giúp phát hiện nồng độ siêu nhỏ, cho phép áp dụng phác đồ loại trừ/xác định NMCT cấp rút ngắn trong 1-2h."],
  ["Nguyên nhân làm kết quả cTnI giữa các phòng xét nghiệm khác nhau có sự chênh lệch lớn (có thể khác biệt 20 - 40 lần) là do đâu?",["Do cTnI lưu hành nhiều dạng ly giải/phức hợp khác nhau và các hãng dùng bộ kháng thể nhận diện các đoạn epitope khác nhau","Do sai số kỹ thuật viên","Do cTnI biến thành cTnT","Do ảnh hưởng của nồng độ Glucose"],0,"cTnI bị phân hủy thành nhiều đoạn nhỏ trong máu. Các hãng sản xuất dùng bộ kháng thể định hướng các đoạn epitope khác nhau nên kết quả đo được không đồng nhất."],
  ["Chỉ dấu sinh học nào sau đây có thời gian bán hủy t1/2 ngắn nhất trong máu sau khi phóng thích từ cơ tim?",["Myoglobin (~ 1 - 2 giờ)","cTnT","cTnI","LDH1"],0,"Myoglobin đào thải qua thận rất nhanh, t1/2 chỉ khoảng 1-2 giờ nên nồng độ trở về bình thường nhanh chóng sau 24h."],
  ["Cấu trúc vi thể của cơ tim bao gồm các vạch tối (A band) và vạch sáng (I band). Sợi mỏng (Thin filament) chứa các thành phần protein nào?",["Actin, Tropomyosin và Phức hợp Troponin","Myosin và Titin","Dystrophin và Collagen","Myoglobin và CK"],0,"Sợi mỏng được cấu tạo bởi phân tử xoắn kép F-Actin, cùng các protein điều hòa Tropomyosin và phức hợp Troponin."],
  ["Sợi dày (Thick filament) trong tơ cơ tim được cấu tạo chủ yếu bởi protein nào?",["Myosin (Cardiac beta-myosin heavy chain)","Actin","Troponin T","Desmin"],0,"Sợi dày cấu tạo từ hàng trăm phân tử Myosin xếp đuôi vào nhau, đầu gập góc có hoạt tính ATPase."],
  ["Hiện tượng 'Độ nhạy chẩn đoán đạt 90% sau 8 giờ đau ngực' của cTnT và cTnI có nghĩa là gì?",["Có 90% bệnh nhân Nhồi máu cơ tim thực sự sẽ có kết quả Troponin dương tính sau 8h đau ngực","10% người bình thường có troponin dương tính","Độ chính xác là 90%","Troponin tăng gấp 90 lần"],0,"Độ nhạy 90% nghĩa là xét nghiệm phát hiện đúng 90% số người mắc bệnh NMCT sau 8 giờ khởi phát."],
  ["Độ đặc hiệu chẩn đoán sau 8 giờ đau ngực của cTnI là 95% cao hơn cTnT (80%). Điều này do nguyên nhân chính nào?",["cTnI hoàn toàn không có trong cơ vân, trong khi cTnT có thể xuất hiện lượng nhỏ ở cơ vân bị tổn thương mãn tính","cTnT dễ bị phân hủy hơn","cTnI có ở tim nhiều hơn","cTnT bị ảnh hưởng bởi thận nhiều hơn"],0,"Gen cTnI hoàn toàn không diễn hòa ở cơ vân trưởng thành, còn cTnT có thể tái diễn hòa một lượng nhỏ trong bệnh lý cơ vân mãn tính."],
  ["Sự gia tăng nồng độ NT-proBNP hoặc BNP máu có giá trị vượt trội trong việc phân biệt nguyên nhân gây Khó thở cấp là do đâu?",["Phân biệt khó thở do Suy tim (BNP tăng cao) với khó thở do bệnh lý Phổi (BNP bình thường)","Phân biệt viêm phổi và nhồi máu cơ tim","Chẩn đoán hen suyễn","Đánh giá chức năng thận"],0,"BNP/NT-proBNP tăng rất cao trong suy tim. Nếu bệnh nhân khó thở cấp mà BNP bình thường, nguyên nhân do tim bị loại trừ (nghĩ đến hô hấp)."],
  ["Trong quy trình chẩn đoán NMCT cấp theo ESC 2020 áp dụng hs-cTnT (0h/1h), tiêu chuẩn để 'Rule-in' (Xác định NMCT) là gì?",["Mẫu 0h tăng rất cao hoặc Delta thay đổi mẫu 1h tăng rõ rệt vượt ngưỡng quy định","Troponin giảm về 0","Mẫu 0h và 1h hoàn toàn bằng nhau","Không cần xét nghiệm lại"],0,"Phác đồ 0h/1h dựa vào giá trị ban đầu và sự thay đổi Delta tuyệt đối sau 1h để Rule-in hoặc Rule-out NMCT cấp."],
  ["Yếu tố nào sau đây là nguyên nhân gây nhiễu làm tăng giả hoặc giảm giả Troponin trong xét nghiệm miễn dịch?",["Kháng thể dị loài (Heterophile antibodies) hoặc Kháng thể tự nhiên Auto-antibodies gắn Troponin","Ăn nhiều mỡ","Uống nhiều nước","Bệnh nhân vận động nhẹ"],0,"Heterophile antibodies hoặc Auto-cTn antibodies trong máu bệnh nhân có thể gắn cản trở kháng thể xét nghiệm gây sai lệch kết quả."],
  ["Chất chỉ điểm sinh học nào sau đây tăng sớm nhất nhưng cũng trở về bình thường nhanh nhất sau NMCT cấp?",["Myoglobin","cTnT","cTnI","LDH1"],0,"Myoglobin tăng từ 1-2h và trở về bình thường chỉ sau 24h."],
  ["Thuật ngữ 'Tổn thương cơ tim cấp' (Acute myocardial injury) được xác định trên sinh hóa khi nào?",["Khi có ít nhất 1 giá trị Troponin vượt ngưỡng 99th percentile kèm theo sự TĂNG hoặc GIẢM động học (Delta)","Khi Troponin tăng cố định không đổi trong 1 tháng","Khi CK-MB giảm","Khi Myoglobin bằng 0"],0,"Định nghĩa toàn cầu về tổn thương cơ tim cấp yêu cầu có Troponin > 99th percentile kèm theo sự thay đổi động học (rises/falls)."],
  ["Nếu Troponin máu tăng > 99th percentile nhưng CỐ ĐỊNH KHÔNG THAY ĐỔI khi xét nghiệm lặp lại sau nhiều giờ/ngày, tình trạng này gợi ý điều gì?",["Tổn thương cơ tim mãn tính (Mãnh tính như trong Suy tim mãn, Bệnh cơ tim, Suy thận mãn)","Nhồi máu cơ tim cấp tính","Cơn đau thắt ngực không ổn định cấp","Tán huyết"],0,"Troponin tăng cao nhưng phẳng (phẳng động học / no delta) phản ánh tổn thương cơ tim mãn tính chứ không phải biến cố hoại tử cấp."],
  ["Đặc điểm cấu trúc nào giúp cTnI đặc hiệu hoàn toàn cho cơ tim?",["Có thêm đoạn kéo dài N-terminal dài 31 amino acid đặc trưng chỉ có ở cơ tim","Chứa nhóm Heme","Có cấu trúc hình cầu","Liên kết với Lipid"],0,"cTnI có thêm một đoạn chuỗi N-tận dài 31 acid amin độc nhất chỉ xuất hiện ở isoenzyme tim, giúp sản xuất kháng thể đặc hiệu tuyệt đối."],
  ["Enzyme Creatine Kinase Isoenzyme CK-MB bắt đầu tăng trong máu sau NMCT cấp sau bao lâu?",["3 - 6 giờ","1 - 2 phút","12 - 24 giờ","3 ngày"],0,"CK-MB bắt đầu tăng từ 3-6h sau khởi phát NMCT, đạt đỉnh ở 12-24h và trở về bình thường sau 48-72h."],
  ["Biến chứng Phù phổi cấp do suy tim trái cấp tính làm tăng giải phóng chất chỉ điểm nào vào máu nhanh nhất?",["BNP / NT-proBNP","Troponin T","CK-MM","AST"],0,"Sự tăng căng đột ngột thành tâm thất trong phù phổi cấp kích thích tế bào cơ tim giải phóng ngay lập tức BNP/NT-proBNP."],
  ["Trong chẩn đoán phân biệt giữa Bệnh teo cơ Duchenne (DMD) và các bệnh cơ khác, enzyme serum nào tăng cực đại (có thể tăng gấp 50 - 100 lần bình thường)?",["CK toàn phần (CK-MM)","ALT","Amylase","ALP"],0,"Màng tế bào cơ trong bệnh DMD bị vỡ liên tục làm CK-MM từ bào tương thoát ra máu cực lớn, tăng vọt hàng chục ngàn U/L."],
  ["Hệ số biến thiên (CV - Coefficient of Variation) của xét nghiệm Troponin ở ngưỡng bách phân vị 99th theo khuyến cáo của IFCC phải đạt mức nào?",["CV <= 10%","CV <= 30%","CV = 50%","Không quan trọng"],0,"IFCC yêu cầu xét nghiệm Troponin đạt chuẩn chất lượng phải có độ chụm cao với CV <= 10% tại điểm cắt 99th percentile."],
  ["Loại mẫu bệnh phẩm huyết thanh/huyết tương làm xét nghiệm Troponin T siêu nhạy (hs-cTnT) thường chống đông bằng chất nào?",["Lithium Heparin","Sodium Citrate","EDTA","Fluoride"],0,"Mẫu huyết tương dùng Lithium Heparin là phổ biến trên các máy miễn dịch tự động xét nghiệm hs-cTnT."],
  ["Sự phục hồi lưu thông mạch vành (Tái thông mạch máu / Reperfusion) sau NMCT cấp ảnh hưởng đến biểu đồ Troponin máu như thế nào?",["Làm Troponin đạt đỉnh sớm hơn và cao hơn do hiệu ứng rửa trôi (Washout effect)","Làm Troponin biến mất ngay lập tức","Làm Troponin tăng chậm hơn","Không ảnh hưởng"],0,"Khi mạch vành được tái thông (bằng can thiệp PCI hoặc tiêu sợi huyết), dòng máu rửa trôi lượng troponin bị ứ ở mô hoại tử ra tuần hoàn tạo đỉnh sớm hơn."],
  ["Khi nghi ngờ bệnh nhân bị Tái nhồi máu cơ tim cấp (Re-infarction) xảy ra sau 4 ngày kể từ đợt NMCT đầu tiên, xét nghiệm nào hữu ích hơn cTnT?",["CK-MB (hoặc hs-cTnT lặp lại đánh giá Delta tăng mới)","LDH1","Myoglobin kéo dài","AST"],0,"Vì cTnT đợt 1 vẫn còn cao kéo dài (14 ngày), CK-MB đã về bình thường sau 48h nên đợt tăng CK-MB mới giúp nhận biết tái nhồi máu rõ ràng hơn."],
  ["Sự ly giải hoàn toàn cấu trúc tơ cơ (Myofibril degradation) trong hoại tử cơ tim giải phóng phức hợp Troponin dạng nào?",["Phức hợp cTnT-I-C và các phức hợp đôi cTnI-C","Chỉ có TnC","Chỉ có Tropomyosin","Actin đơn phân"],0,"Khi sợi tơ cơ hoại tử, enzyme ly giải giải phóng ra các phức hợp bộ ba cTnT-I-C và các phức hợp đôi cTnI-C vào máu."],
  ["Chỉ số hs-cTnT âm tính ở thời điểm 0h và 1h (hoặc 3h) có ý nghĩa lâm sàng quan trọng nhất là gì?",["Cho phép loại trừ (Rule-out) an toàn Hội chứng mạch vành cấp và có thể cho bệnh nhân xuất viện sớm","Bắt buộc bệnh nhân nhập viện nằm ICU 7 ngày","Chỉ định mổ cầu nối ngay","Xác định suy tim cấp"],0,"Giá trị tiên đoán âm cực cao của hs-cTnT cho phép phác đồ Rule-out nhanh loại trừ NMCT, giúp giảm tải phòng cấp cứu an toàn."]

const APP=[
  ["Theo định nghĩa y học phân tử, bệnh di truyền là nhóm bệnh lý phát sinh do sự biến đổi bất thường của những yếu tố nào?",["Các phân tử protein cấu trúc và enzym trao đổi chất nội bào","Các yếu tố di truyền bao gồm gen, DNA hoặc nhiễm sắc thể (NST)","Vi sinh vật ký sinh và độc tố từ môi trường ngoại cảnh","Sự suy giảm chức năng các cơ quan do quá trình lão hóa tự nhiên"],1,"Bệnh di truyền là bệnh phát sinh do kết quả của những biến đổi bệnh lý của các yếu tố di truyền (gen, DNA, NST) và truyền qua các thế hệ của cá thể mang gen bệnh."],
  ["Nhóm bệnh di truyền tuân theo đúng các quy luật di truyền Mendel được xếp vào loại rối loạn nào?",["Rối loạn đa nguyên nhân","Rối loạn đa gen","Rối loạn đơn gen","Rối loạn bất thường cấu trúc NST"],2,"Các rối loạn đơn gen (di truyền trội/lặn trên NST thường, lặn liên kết NST giới tính X/Y) di truyền theo đúng các quy luật Mendel."],
  ["Hiện tượng dị tật sứt môi hở hàm ếch, đái tháo đường, hoặc khiếm khuyết ống thần kinh thuộc nhóm di truyền nào?",["Bệnh di truyền đơn gen trội NST thường","Rối loạn bất thường số lượng NST","Bệnh di truyền lặn liên kết NST X","Rối loạn đa nguyên nhân (liên quan đa gen và môi trường)"],3,"Sứt môi hở hàm ếch, bệnh tim bẩm sinh, đái tháo đường, khiếm khuyết ống thần kinh... là các rối loạn đa nguyên nhân liên quan đến đa gen tương tác với môi trường."],
  ["Mẫu bệnh phẩm được ưu tiên sử dụng phổ biến nhất để tách chiết ADN bộ gen (gDNA) chẩn đoán các biến đổi di truyền ở tế bào sinh dưỡng là gì?",["Huyết tương không chứa tế bào","Bạch cầu chiết xuất từ máu tĩnh mạch","Hồng cầu lưới trong máu ngoại vi","Dịch não tủy không chứa tế bào"],1,"Đa số các biến đổi di truyền xảy ra trong ADN bộ gen của tế bào sinh dưỡng, do đó mẫu bệnh phẩm thường được chọn là máu tĩnh mạch để tách chiết ADN bộ gen từ bạch cầu."],
  ["Việc lựa chọn áp dụng kỹ thuật sinh học phân tử nào trong chẩn đoán di truyền KHÔNG phụ thuộc trực tiếp vào yếu tố nào sau đây?",["Đặc tính của đích phân tử quan tâm và mục đích xét nghiệm","Khả năng kinh tế, hiện trạng cơ sở vật chất và nhân lực đơn vị","Nhóm máu hệ ABO và Rh của bệnh nhân","Khả năng chi trả của bệnh nhân"],2,"Lựa chọn kỹ thuật phụ thuộc vào đặc tính đích phân tử, kinh phí, mục đích XN (nghiên cứu hay lâm sàng), khả năng chi trả của BN và cơ sở vật chất nhân lực. Nhóm máu ABO/Rh không quyết định việc chọn kỹ thuật SHPT."],
  ["Gen F8 mã hóa cho yếu tố đông máu VIII gồm bao nhiêu exon và nằm trên nhiễm sắc thể nào?",["16 exon, nằm trên NST số 12","26 exon, nằm trên NST giới tính X","32 exon, nằm trên NST giới tính Y","22 exon, nằm trên NST số 11"],1,"Gen F8 nằm trên NST giới tính X, cấu trúc gồm 26 exon mã hóa cho yếu tố đông máu VIII."],
  ["Để khuếch đại toàn bộ 26 exon của gen F8 phục vụ giải trình tự gen chẩn đoán bệnh Hemophilia A, người ta cần sử dụng bao nhiêu cặp mồi PCR?",["2 đến 5 cặp mồi","10 đến 15 cặp mồi","23 đến 38 cặp mồi","Trên 100 cặp mồi"],2,"Chẩn đoán giải trình tự gen F8 sử dụng từ 23–38 cặp mồi để khuếch đại 26 exon của gen F8 bằng kỹ thuật PCR trước khi giải trình tự 2 chiều."],
  ["Đột biến c.2605delC xảy ra tại exon 14 của gen F8 dẫn đến kiểu hình bệnh lý lâm sàng nào?",["Bệnh Bệnh Thalassemia thể nặng","Bệnh Hemophilia A thể trung bình","Bệnh teo cơ Duchenne","Hội chứng X mỏng mảnh"],1,"Kết quả giải trình tự exon 14 gen F8 phát hiện đột biến mất 1 nucleotide C (c.2605delC) gây bệnh Hemophilia A thể trung bình ở bệnh nhân."],
  ["Hình ảnh điện thế đồ giải trình tự Sanger gen F8 ở người mẹ của bệnh nhân Hemophilia A mang đột biến c.2605delC có đặc điểm gì?",["Hoàn toàn bình thường không có vết đột biến","Mất hoàn toàn tín hiệu của exon 14","Xuất hiện tín hiệu hai đỉnh chồng lấp (thể dị hợp tử / người lành mang gen)","Tất cả các đỉnh sóng biến thành tín hiệu nhiễu nền"],2,"Người mẹ là người lành mang gen ở thể dị hợp tử (chứa cả alen bình thường và alen đột biến c.2605delC), do đó điện thế đồ Sanger hiển thị hai đỉnh sóng chồng lên nhau từ vị trí đột biến. ÔN TẬP KHAI THÁC & ỨNG DỤNG SINH HỌC PHÂN TỬ TRONG LÂM SÀNG                                                   90 CÂU TRẮC NGHIỆM"],
  ["Mục tiêu quan trọng nhất của xét nghiệm chẩn đoán phân tử phát hiện người mẹ mang gen đột biến c.2605delC trong gia đình bệnh nhân Hemophilia A là gì?",["Để cách ly người mẹ tránh lây truyền vi sinh vật","Để tư vấn di truyền và thực hiện chẩn đoán tiền sinh cho các thai nam ở lần sinh sau","Để điều trị triệt để bệnh Hemophilia A bằng truyền máu","Để thay đổi chế độ ăn uống của người mẹ"],1,"Quan trọng nhất là phát hiện người mẹ dị hợp tử mang gen bệnh để tư vấn di truyền và thực hiện chẩn đoán tiền sinh cho các thai nam."],
  ["Ý nghĩa của việc xác định tần suất và sự hiện diện của các gen bệnh di truyền (như Thalassemia, Hb...) theo vùng địa lý tại Việt Nam là gì?",["Giúp thay đổi bộ gen của toàn bộ cộng đồng","Làm cơ sở đề xuất chương trình quản lý, chăm sóc và dự phòng phát tán gen bệnh","Giúp loại bỏ hoàn toàn xét nghiệm huyết học truyền thống","Nhằm phục vụ sản xuất các loại vắc-xin di truyền"],1,"Xác định tỷ lệ người mang gen bệnh giúp đề xuất chiến lược quản lý, hỗ trợ chăm sóc bệnh nhân và dự phòng ngăn chặn phát tán gen bệnh tại Việt Nam."],
  ["Trong tư vấn di truyền thông thường, người thầy thuốc cần cung cấp cho gia đình người bệnh những thông tin cốt lõi nào?",["Kê đơn thuốc kháng sinh liều cao điều trị đột biến","Giải thích cơ chế, tần suất, nguy cơ truyền bệnh và lợi ích xét nghiệm di truyền","Yêu cầu bệnh nhân không thực hiện bất kỳ xét nghiệm cận lâm sàng nào","Cam kết chữa khỏi 100% bệnh di truyền bằng phẫu thuật"],1,"Tư vấn di truyền cung cấp thông tin giải thích cơ chế, tần suất mắc, nguy cơ mang/truyền gen bệnh và lợi ích xét nghiệm di truyền."],
  ["Nguồn mẫu bệnh phẩm nào thường được thu thập để chẩn đoán phân tử tiền sinh các bệnh di truyền ở thai nhi?",["Máu tĩnh mạch của người cha","Mẫu phết tế bào niêm mạc má của mẹ","Dịch ối hoặc mẫu gai nhau (CVS)","Máu dây rốn sau khi sinh"],2,"Chẩn đoán tiền sinh cho thai nhi sử dụng mẫu dịch ối (chọc dò dịch ối) hoặc mẫu gai nhau (sinh thiết gai nhau - CVS)."],
  ["Điều trị lâm sàng bệnh Hemophilia A hiện nay chủ yếu dựa vào phương pháp nào?",["Phẫu thuật ghép gen F8 vào tế bào gan","Bổ sung yếu tố đông máu kết tủa lạnh hoặc yếu tố VIII đông khô khi xuất huyết","Dùng thuốc kháng sinh diệt tế bào đột biến","Tiêm vắc-xin phòng ngừa tái phát"],1,"Hướng điều trị hiện nay là bổ sung yếu tố đông máu kết tủa lạnh hoặc yếu tố VIII đông khô khi xuất huyết (tốn kém) và quan trọng nhất là dự phòng sinh con bị bệnh."],
  ["Bệnh Hemophilia A di truyền theo quy luật nào?",["Di truyền trội trên NST thường","Di truyền lặn trên NST thường","Di truyền lặn liên kết với NST giới tính X","Di truyền qua ty thể (dòng mẹ)"],2,"Hemophilia A là bệnh di truyền lặn liên kết NST giới tính X, do đột biến gen F8 trên NST X gây ra."],
  ["Đột biến mất 1 nucleotide `c.2605delC` thuộc dạng đột biến nào và ảnh hưởng ra sao đến mã di truyền?",["Đột biến đồng nghĩa, không thay đổi amino acid","Đột biến dịch khung (frameshift), làm thay đổi chuỗi amino acid từ vị trí đột biến","Đột biến đảo đoạn NST, làm ngưng phiên mã","Đột biến vô nghĩa trực tiếp tại mã mở đầu"],1,"Mất 1 nucleotide (delC) gây đột biến dịch khung đọc mã (frameshift mutation), làm thay đổi trình tự amino acid phía sau và thường tạo mã kết thúc sớm."],
  ["Tỷ lệ mắc bệnh Hemophilia A ở thai nam của người mẹ dị hợp tử mang gen bệnh là bao nhiêu trong mỗi lần sinh?",["0%","25%","50%","100%"],2,"Mẹ dị hợp tử (X^A X^a) truyền NST X^a mang gen bệnh cho thai nam (XY) với xác suất 50% trong mỗi lần sinh."],
  ["Nội dung nào KHÔNG thuộc nhóm quản lý phát tán gen bệnh di truyền trong cộng đồng?",["Tuyên truyền tránh kết hôn cận huyết","Sàng lọc người lành mang gen bệnh ở các vùng địa lý có tỷ lệ mắc cao","Tiêm kháng sinh phòng ngừa cho toàn bộ trẻ sơ sinh","Tư vấn di truyền tiền hôn nhân và chẩn đoán tiền sinh"],2,"Kháng sinh không thể phòng ngừa hay chữa trị đột biến gen di truyền."],
  ["Phương pháp giải trình tự Sanger 2 chiều (bidirectional sequencing) có ưu điểm gì trong chẩn đoán đột biến gen đơn?",["Chi phí cực kỳ rẻ và không cần máy móc","Xác định chính xác trình tự từng nucleotide trên cả 2 mạch DNA, độ chính xác cao","Giúp nuôi cấy tế bào đột biến phát triển nhanh hơn","Phát hiện được tất cả các vi khuẩn ký sinh"],1,"Giải trình tự Sanger 2 chiều giúp đọc chính xác trình tự nucleotide trên cả hai mạch tiến và lùi, tránh nhầm lẫn do nhiễu tín hiệu. ÔN TẬP KHAI THÁC & ỨNG DỤNG SINH HỌC PHÂN TỬ TRONG LÂM SÀNG                                                 90 CÂU TRẮC NGHIỆM"],
  ["Bất thường NST về số lượng gây ra bệnh di truyền phổ biến nào?",["Bệnh Thalassemia","Hội chứng Down (thể ba NST 21)","Bệnh Hemophilia B","Bệnh Phenylketon niệu"],1,"Hội chứng Down là do lệch bội số lượng NST (thừa 1 NST số 21 - Trisomy 21)."],
  ["Kỹ thuật phân tử nào giúp chẩn đoán nhanh các bất thường số lượng NST (Down, Patau, Edwards) ở thai nhi trước sinh?",["QF-PCR (Quantitative Fluorescence PCR)","Nuôi cấy vi khuẩn dịch ối","Điện di đạm huyết thanh","Phản ứng định lượng Amylase"],0,"QF-PCR là kỹ thuật khuếch đại huỳnh quang các đoạn lặp ngắn (STR) giúp chẩn đoán nhanh bất thường lệch bội NST 13, 18, 21, X, Y."],
  ["Tại sao người cha bị bệnh Hemophilia A (X^a Y) kết hôn với người mẹ bình thường (X^A X^A) thì KHÔNG có con trai bị bệnh?",["Vì gen F8 truyền từ cha sang con trai qua NST Y","Vì con trai nhận NST Y từ cha và NST X^A bình thường từ mẹ","Vì gen bệnh bị tiêu hủy trong quá trình thụ tinh","Vì con trai có cơ chế tự sửa chữa gen F8"],1,"Cha truyền NST Y cho con trai, con trai nhận NST X^A bình thường từ mẹ nên 100% con trai hoàn toàn khỏe mạnh không mang gen bệnh."],
  ["Hiện tượng một nữ giới mang gen dị hợp tử Hemophilia A có biểu hiện xuất huyết nhẹ có thể giải thích do cơ chế nào?",["Sự bất hoạt ngẫu nhiên nhiễm sắc thể X (phản ứng Lyonization)","Nhiễm trùng vi khuẩn bội nhiễm","Thiếu hụt Vitamin C kéo dài","Đột biến gen tổng hợp Collagen"],0,"Sự bất hoạt ngẫu nhiên một NST X ở tế bào phôi nữ (Lyonization) nếu ưu thế lệch về NST X mang gen lành bị bất hoạt có thể khiến lượng yếu tố VIII giảm nhẹ."],
  ["Mục đích của việc kiểm soát kết hôn trong vùng địa lý hẹp đối với các bệnh di truyền lặn là gì?",["Giảm nguy cơ gặp gỡ giữa hai người lành cùng mang gen đột biến lặn","Tăng khả năng đề kháng với vi khuẩn truyền nhiễm","Giảm tỷ lệ sinh con trai trong gia đình","Tăng tốc độ đột biến gen tự nhiên"],0,"Kết hôn đồng hương hoặc vùng địa lý hẹp làm tăng xác suất 2 người cùng mang dị hợp tử gen lặn kết hôn, dẫn tới sinh con đồng hợp tử bị bệnh."],
  ["Bệnh di truyền lặn trên NST thường (như Thalassemia) có đặc điểm di truyền nào?",["Bệnh chỉ xuất hiện ở nam giới","Bệnh xuất hiện ở cả hai giới với tỷ lệ ngang nhau khi nhận gen bệnh từ cả cha và mẹ","Bệnh di truyền trực tiếp từ cha sang 100% con trai","Bệnh luôn biểu hiện lâm sàng ở thể dị hợp tử"],1,"Bệnh lặn NST thường biểu hiện khi cá thể mang đồng hợp tử gen lặn (nhận từ cả cha và mẹ), tỷ lệ nam nữ mắc bệnh ngang nhau."],
  ["Kỹ thuật chẩn đoán tiền sinh không xâm lấn (NIPT) dựa trên phân tích yếu tố nào trong máu mẹ?",["Bạch cầu của mẹ","ADN tự do của thai nhi (cell-free fetal DNA - cffDNA)","Tiểu cầu của mẹ","Nồng độ mỡ máu Triglyceride"],1,"NIPT phân tích ADN tự do của thai nhi lưu hành trong máu mẹ (cffDNA) để sàng lọc bất thường NST."],
  ["Vì sao chẩn đoán di truyền phân tử có độ chính xác vượt trội so với chẩn đoán dựa trên kiểu hình lâm sàng?",["Vì phân tích trực tiếp bản chất vật chất di truyền ở mức độ nucleotide","Vì xét nghiệm phân tử không bao giờ bị sai sót thao tác","Vì kiểu hình lâm sàng luôn xuất hiện muộn sau 50 tuổi","Vì tất cả bệnh nhân có cùng đột biến đều có biểu hiện lâm sàng giống hệt nhau"],0,"Chẩn đoán phân tử đi thẳng vào nguyên nhân gốc rễ (trình tự ADN/đột biến gen) không bị ảnh hưởng bởi sự biến đổi biểu hiện kiểu hình."],
  ["Các dị tật bẩm sinh do rối loạn đa gen có đặc điểm nào sau đây?",["Di truyền theo quy luật trội lặn rõ rệt của Mendel","Chịu sự tác động cộng gộp của nhiều gen kết hợp với yếu tố môi trường","Chỉ gặp ở trẻ em gái","Hoàn toàn do nhiễm trùng vi khuẩn trong thai kỳ"],1,"Rối loạn đa gen chịu ảnh hưởng của nhiều gen (polygenic) phối hợp với các yếu tố môi trường tác động."],
  ["Xét nghiệm chẩn đoán di truyền trước chuyển phôi (PGD/PGT) được thực hiện ở giai đoạn nào?",["Khi thai nhi được 20 tuần tuổi","Trên phôi thụ tinh trong ống nghiệm (IVF) trước khi đưa vào tử cung mẹ","Trực tiếp trên tinh trùng trước khi thụ tinh","Sau khi trẻ đã sinh ra được 1 tháng"],1,"PGT/PGD sinh thiết tế bào phôi tạo ra từ IVF để xét nghiệm di truyền trước khi chọn phôi khỏe mạnh cấy vào tử cung. ÔN TẬP KHAI THÁC & ỨNG DỤNG SINH HỌC PHÂN TỬ TRONG LÂM SÀNG                                                  90 CÂU TRẮC NGHIỆM"],
  ["Ý nghĩa chính của việc tư vấn di truyền tiền hôn nhân là gì?",["Đảm bảo 100% trẻ sinh ra không bị bệnh truyền nhiễm","Tầm soát nguy cơ mang gen bệnh lặn/chuyển đoạn NST ở cặp đôi để dự phòng sinh con mắc bệnh di truyền nặng","Thay đổi nhóm máu của thai nhi theo mong muốn","Hướng dẫn phẫu thuật chỉnh hình cho cha mẹ"],1,"Tư vấn tiền hôn nhân giúp phát hiện các cặp đôi cùng mang gen bệnh lặn hoặc dị hợp tử để chủ động kế hoạch sinh con khỏe mạnh."],
  ["Ưu điểm vượt trội của các kỹ thuật sinh học phân tử trong chẩn đoán vi sinh so với phương pháp xét nghiệm truyền thống là gì?",["Thời gian trả kết quả ngắn, độ nhạy cao và có thể thực hiện từ mẫu không cần VSV sống","Chi phí rẻ hơn gấp nhiều lần nuôi cấy","Không cần máy móc hay kỹ thuật viên có chuyên môn","Cho biết chính xác mức độ hoạt động sống của vi khuẩn"],0,"Ưu điểm SHPT: trả kết quả ngắn hơn nuôi cấy, độ nhạy tốt, thực hiện được từ mẫu phẩm không cần giữ VSV sống sót, xác định nhiều tác nhân cùng lúc."],
  ["Nhóm vi khuẩn nào sau đây khó hoặc KHÔNG THỂ nuôi cấy truyền thống, rất cần đến kỹ thuật SHPT để phát hiện nhanh?",["Staphylococcus aureus, Escherichia coli","Mycobacterium tuberculosis, Neisseria gonorrhoeae, Chlamydia trachomatis","Streptococcus pneumoniae, Klebsiella pneumoniae","Bacillus subtilis, Proteus mirabilis"],1,"Các vi khuẩn khó hoặc không thể nuôi cấy như M. tuberculosis, N. gonorrhoeae, C. trachomatis, M. pneumoniae..."],
  ["Kỹ thuật SHPT nào thuộc nhóm KHÔNG KHUẾCH ĐẠI được ứng dụng định genotype của Hepatitis C virus (HCV)?",["Real-time RT-PCR","Kỹ thuật lai sử dụng đoạn dò đánh dấu đặc hiệu (như que inoLipa)","Giải trình tự thế hệ mới NGS","Kỹ thuật PCR đa mồi (Multiplex PCR)"],1,"Kỹ thuật không khuếch đại sử dụng các đoạn dò đánh dấu đặc hiệu (như kỹ thuật lai phát hiện genotype HCV bằng que inoLipa)."],
  ["Vì sao kỹ thuật Real-time PCR thường được ưu chuộng hơn PCR cổ điển trong chẩn đoán bệnh nhiễm?",["Không cần hệ thống máy móc phức tạp","Nhanh, dễ phân tích, không cần phân tích sau PCR, định lượng được và độ nhạy/đặc hiệu cao hơn","Phân biệt được chính xác vi khuẩn còn sống hay đã chết","Chi phí thấp hơn hẳn xét nghiệm soi kính"],1,"Real-time PCR ưu chuộng hơn vì: nhanh, không cần phân tích sau PCR (tránh nhiễm chéo), định lượng phạm vi rộng, độ nhạy và đặc hiệu cao hơn PCR cổ điển."],
  ["Nguyên lý cơ bản của kỹ thuật SHPT trong vi sinh lâm sàng phản ánh điều gì về tác nhân gây bệnh?",["Phản ánh trực tiếp sự nhân lên và độc tính của vi khuẩn","Phát hiện vật chất di truyền, gián tiếp phản ánh sự hiện diện chứ không thể hiện sự hoạt động (còn sống) của VSV","Đo lường chính xác lượng độc tố do vi khuẩn tiết ra","Chứng minh vi khuẩn đang trong giai đoạn bào tử"],1,"Nguyên lý kỹ thuật SHPT là dựa trên sự phát hiện vật chất di truyền, gián tiếp phản ánh sự hiện diện, và không thể hiện sự hoạt động (còn sống) của VSV."],
  ["Vì sao KHÔNG NÊN sử dụng kỹ thuật SHPT để định lượng vi khuẩn trong chẩn đoán lâm sàng?",["Vì kỹ thuật SHPT không thể phát hiện được ADN vi khuẩn","Vì không phân biệt được vi khuẩn sống hay chết và nồng độ ít giúp phân định thể nhiễm bệnh hay thể mang trùng","Vì vi khuẩn luôn biến đổi thành virus","Vì phản ứng PCR luôn bị ức chế bởi vi khuẩn"],1,"Đối với vi khuẩn không nên dùng SHPT để định lượng vì không phân biệt được VK sống hay chết. Nồng độ ít có ý nghĩa phân định thể nhiễm bệnh hay thể mang trùng."],
  ["Đối với các tác nhân gây bệnh có vật chất di truyền là RNA (như HCV, HIV, Cúm, SARS-CoV-2), giai đoạn nào cần đặc biệt lưu ý để tránh âm tính giả?",["Giai đoạn điện di gel agarose","Giai đoạn tách chiết và tinh sạch vì RNA rất nhạy cảm và dễ bị hủy","Giai đoạn đọc kết quả bằng mắt thường","Giai đoạn cố định mẫu bằng ngọn lửa đèn cồn"],1,"Tác nhân có vật chất di truyền là RNA cần chú ý giai đoạn tách chiết và tinh sạch vì bản chất RNA nhạy cảm, dễ bị hủy gây âm tính giả."],
  ["Yêu cầu kỹ thuật quan trọng nhất khi thiết kế cặp mồi PCR cho các tác nhân có tốc độ biến đổi di truyền (đột biến) cao như virus Cúm hay HIV là gì?",["Chọn các vùng gen có độ đột biến cao nhất","Thiết kế cặp mồi hướng vào các vùng gen bảo tồn (conserved region) để tránh bỏ sót các chủng mới biến đổi","Sử dụng mồi ngẫu nhiên không đặc hiệu","Kéo dài độ dài cặp mồi lên trên 500 nucleotide"],1,"Đối với tác nhân có tốc độ biến đổi di truyền cao (cúm, HIV...) cần hết sức lưu ý trong thiết kế cặp mồi (hướng vào vùng bảo tồn) vì dễ gây bỏ sót các chủng mới biến đổi. ÔN TẬP KHAI THÁC & ỨNG DỤNG SINH HỌC PHÂN TỬ TRONG LÂM SÀNG                                                      90 CÂU TRẮC NGHIỆM"],
  ["Để hạn chế âm tính giả do nồng độ vi sinh vật quá thấp trong các mẫu bệnh phẩm đặc biệt (phết niêm mạc, dịch loãng, phân), người ta áp dụng biện pháp gì?",["Tiêm vắc-xin cho bệnh nhân trước khi lấy mẫu","Áp dụng các biện pháp/kỹ thuật tăng sinh trước khi tách chiết và thực hiện PCR","Tăng nhiệt độ biến tính PCR lên 120 độ C","Bỏ qua bước tách chiết ADN"],1,"Đối với mẫu có nồng độ VSV thấp đôi khi cần một số biện pháp giúp tăng sinh để tăng độ nhạy, tránh âm tính giả do quá ít tác nhân ban đầu."],
  ["Gen mecA ở chủng Tụ cầu vàng (Staphylococcus aureus) là dấu ấn phân tử giúp xác định tính chất gì?",["Khả năng sinh độc tố ruột","Tính kháng Methicillin (chủng MRSA)","Khả năng di động bằng lông vũ","Tính nhạy cảm với Penicillin G"],1,"Phát hiện gen mecA của chủng S. aureus giúp xác định tính kháng methicillin (MRSA - Methicillin-Resistant Staphylococcus aureus)."],
  ["Việc giải trình tự các gen rpoB, hsp65, gyrA, inhA của vi khuẩn Mycobacterium tuberculosis nhằm mục đích gì?",["Định lượng nồng độ vi khuẩn trong máu","Phát hiện vi khuẩn Lao kháng thuốc và đa kháng thuốc (MDR-TB)","Xác định khả năng sinh bào tử của vi khuẩn","Đánh giá nhóm máu của bệnh nhân mắc lao"],1,"Giải trình tự các gen rpoB, hsp65, gyrA, inhA... giúp phát hiện M. tuberculosis kháng và đa kháng thuốc."],
  ["Kỹ thuật SHPT được ứng dụng để xác định nguy cơ tác nhân vũ khí sinh học đối với các vi sinh vật nào?",["Lactobacillus acidophilus và Bifidobacterium","Bacillus anthracis (bệnh than) và Yersinia pestis (dịch hạch)","Saccharomyces cerevisiae và Penicillium","Streptococcus thermophilus"],1,"SHPT ứng dụng xác định nguy cơ vũ khí sinh học do Bacillus anthracis, Yersinia pestis..."],
  ["Khi kết quả xét nghiệm SHPT chẩn đoán vi sinh trả về ÂM TÍNH, người thầy thuốc cần hiểu thế nào cho đúng?",["Khẳng định 100% bệnh nhân hoàn toàn không nhiễm vi sinh vật","Có thể tác nhân không có trong mẫu do lấy sai thời điểm/vị trí, hoặc nồng độ dưới ngưỡng phát hiện","Kỹ thuật xét nghiệm luôn luôn bị hỏng","Vi khuẩn đã biến đổi thành tế bào người"],1,"Không nhất thiết kết quả âm tính là không nhiễm hay kỹ thuật sai, mà có thể do lấy không đúng mẫu, sai thời điểm, hoặc nồng độ tác nhân dưới ngưỡng phát hiện."],
  ["Ứng dụng của SHPT trong xác định Helicobacter pylori giúp ích gì cho lâm sàng?",["Phát hiện H. pylori và định type có nguy cơ sinh ung thư dạ dày (như gen cagA, vacA)","Định lượng chính xác số lượng vi khuẩn trong nước tiểu","Chẩn đoán phân biệt H. pylori với virus Cúm A","Đo độ pH của dịch vị dạ dày"],0,"SHPT giúp định danh H. pylori và định type gen có nguy cơ sinh ung thư dạ dày (cagA, vacA...)."],
  ["Đột biến trên gen rpoB của vi khuẩn Mycobacterium tuberculosis gây ra hiện tượng kháng loại thuốc kháng sinh nào?",["Penicillin","Rifampicin","Erythromycin","Tetracycline"],1,"Đột biến trên gen rpoB mã hóa tiểu đơn vị beta của RNA polymerase gây kháng thuốc kháng lao hàng đầu là Rifampicin."],
  ["Loại bệnh phẩm nào phù hợp nhất để chẩn đoán vi khuẩn Chlamydia trachomatis bằng kỹ thuật Real-time PCR?",["Máu toàn phần chống đông EDTA","Dịch phết cổ tử cung/niệu đạo hoặc nước tiểu đầu dòng","Dịch tủy xương","Mẫu tóc hoặc móng tay"],1,"Chlamydia trachomatis gây nhiễm trùng đường sinh dục, mẫu thích hợp là dịch phết niệu đạo, cổ tử cung hoặc nước tiểu đầu dòng."],
  ["Điều nào sau đây là NHƯỢC ĐIỂM của xét nghiệm SHPT trong bệnh lý nhiễm?",["Thời gian xét nghiệm kéo dài nhiều tháng","Không phân biệt được vi khuẩn đang sống hay đã bị tiêu diệt bởi kháng sinh","Độ nhạy kém hơn nhiều so với soi tươi","Không thể phát hiện được virus"],1,"Nhược điểm SHPT là phát hiện ADN/ARN gián tiếp nên không thể phân biệt vi khuẩn còn sống hay đã chết sau điều trị."],
  ["Xét nghiệm GeneXpert MTB/RIF dựa trên kỹ thuật nào và mang lại lợi ích gì trong chẩn đoán Lao?",["Soi kính hiển vi huỳnh quang, thời gian 5 phút","Tự động hóa Real-time PCR phát hiện ADN M. tuberculosis và đột biến kháng Rifampicin trong dưới 2 giờ","Nuôi cấy vi khuẩn trên môi trường thạch máu","Phản ứng kết tủa huyết thanh học trong ống nghiệm"],1,"GeneXpert là hệ thống Real-time PCR tự động phát hiện M. tuberculosis và gen rpoB kháng Rifampicin trong thời gian ngắn (<2 giờ). ÔN TẬP KHAI THÁC & ỨNG DỤNG SINH HỌC PHÂN TỬ TRONG LÂM SÀNG                                                90 CÂU TRẮC NGHIỆM"],
  ["Tại sao việc lấy mẫu bệnh phẩm đúng thời điểm lại cực kỳ quan trọng trong chẩn đoán SHPT bệnh truyền nhiễm?",["Vì vi sinh vật có chu kỳ đời sống và liên quan đến từng cơ quan/giai đoạn bệnh","Vì ADN vi khuẩn chỉ xuất hiện vào ban đêm","Vì máy PCR chỉ hoạt động hiệu quả vào buổi sáng","Vì lấy mẫu sai thời điểm làm thay đổi nhóm máu bệnh nhân"],0,"Đối với bệnh truyền nhiễm, VSV có đời sống riêng và liên quan đến cơ quan/giai đoạn phát triển, lấy sai thời điểm mẫu sẽ không có tác nhân gây âm tính giả."],
  ["Sự hiện diện của gen kháng thuốc trong vi khuẩn được xác định bằng SHPT mang lại ý nghĩa gì cho điều trị?",["Giúp bác sĩ lâm sàng chủ động lựa chọn hoặc thay đổi phác đồ kháng sinh thích hợp","Khẳng định bệnh nhân chắc chắn sẽ tử vong","Giúp loại bỏ hoàn toàn việc dùng thuốc kháng sinh","Giúp chuyển bệnh nhân sang điều trị bằng phẫu thuật"],0,"Phát hiện gen kháng thuốc giúp hướng dẫn bác sĩ lâm sàng chọn kháng sinh hiệu quả, tránh dùng thuốc đã bị vi khuẩn kháng."],
  ["Kỹ thuật SHPT nào giúp theo dõi hiệu quả điều trị và đánh giá sự đáp ứng vi rút (như HBV, HCV, HIV) sau dùng thuốc kháng virus?",["Real-time RT-PCR định lượng tải lượng virus (viral load)","Nuôi cấy vi khuẩn","Soi kính nền đen","Phản ứng kết hợp bổ thể"],0,"Real-time RT-PCR định lượng tải lượng virus trong máu (IU/mL hoặc copies/mL) giúp đánh giá đáp ứng điều trị kháng virus."],
  ["Ứng dụng dịch tễ học phân tử (Molecular Epidemiology) trong bệnh nhiễm dựa trên kỹ thuật SHPT nhằm mục đích gì?",["Truy xuất nguồn gốc chủng lây nhiễm và phân tích mối quan hệ di truyền giữa các ổ dịch","Tiêu diệt vi khuẩn ngoài môi trường","Tính chi phí điều trị cho toàn bộ bệnh viện","Đo lường chỉ số thông minh của bệnh nhân"],0,"Dịch tễ học phân tử giúp xác định nguồn gốc ổ dịch, đường truyền nhiễm và phân tích mối quan hệ tiến hóa giữa các chủng vi sinh vật."],
  ["Yếu tố nào trong mẫu phân có thể đóng vai trò là chất ức chế phản ứng PCR (PCR inhibitor) khi chẩn đoán ký sinh trùng?",["Nước cất tinh khiết","Acid sắc tố mật, bilirubin và polysaccharides phức tạp","Enzyme Taq Polymerase","Các nucleotide tự do dNTP"],1,"Mẫu phân chứa nhiều chất ức chế PCR như sắc tố mật, bilirubin, muối khoáng, mỡ... cần quy trình tách chiết loại bỏ chất ức chế."],
  ["Hiện tượng 'dương tính giả' trong xét nghiệm PCR chẩn đoán vi sinh thường do nguyên nhân kỹ thuật nào gây ra?",["Do mẫu bệnh phẩm bị phân hủy RNA","Do ô nhiễm sản phẩm khuếch đại (amplicon cross-contamination) từ các phản ứng trước","Do nồng độ mồi PCR quá thấp","Do nhiệt độ biến tính quá cao"],1,"Dương tính giả chủ yếu do nhiễm chéo sản phẩm PCR (amplicon) từ các phản ứng trước đó vào mẫu phẩm."],
  ["Kỹ thuật Multiplex PCR trong vi sinh lâm sàng có khả năng đặc biệt nào?",["Khuếch đại và phát hiện đồng thời nhiều tác nhân vi sinh trong cùng một ống phản ứng","Thay thế hoàn toàn bước tách chiết ADN","Làm cho vi khuẩn phát sáng dưới ánh sáng mặt trời","Chữa khỏi bệnh truyền nhiễm trong 24 giờ"],0,"Multiplex PCR sử dụng nhiều cặp mồi khác nhau để phát hiện đồng thời nhiều gen/tác nhân gây bệnh trong 1 phản ứng."],
  ["Chẩn đoán xác định vi khuẩn Neisseria gonorrhoeae bằng Real-time PCR có ưu thế hơn hẳn soi tươi nhuộm Gram ở đối tượng nào?",["Nam giới có triệu chứng viêm niệu đạo cấp mủ rầm rộ","Nữ giới hoặc bệnh nhân nhiễm lậu không triệu chứng / vị trí ngoài sinh dục","Bệnh nhân đang sốt cao do cúm","Trẻ em đã tiêm vắc-xin"],1,"Ở nữ giới hoặc nhiễm lậu không triệu chứng, soi Gram có độ nhạy rất thấp, Real-time PCR giúp phát hiện chính xác."],
  ["Kỹ thuật lai que inoLipa chẩn đoán genotype HCV dựa trên vùng gen nào của Hepatitis C virus?",["Vùng gen mã hóa vỏ nhung","Vùng gen không mã hóa 5'NC (5' non-coding region) bảo tồn","Vùng gen mã hóa đuôi Poly(A)","Toàn bộ gen mã hóa enzyme lysozyme"],1,"Thử nghiệm inoLipa sử dụng các đoạn dò đặc hiệu lai với vùng gen 5'NC hoặc Core bảo tồn của virus HCV để định genotype."],
  ["Trong chẩn đoán nấm gây viêm màng nội tạng hoặc viêm màng não (như Cryptococcus, Candida), SHPT đóng vai trò gì?",["Định danh chính xác loài nấm khi hình thái học hoặc nuôi cấy cho kết quả nghi ngờ/chậm","Thay thế hoàn toàn việc dùng thuốc chống nấm","Đo độ dẻo dai của màng tế bào nấm","Hỗ trợ phẫu thuật loại bỏ khối nấm"],0,"SHPT giúp định danh nhanh và chính xác loài nấm gây bệnh khó nuôi cấy hoặc phát triển chậm. ÔN TẬP KHAI THÁC & ỨNG DỤNG SINH HỌC PHÂN TỬ TRONG LÂM SÀNG                                                90 CÂU TRẮC NGHIỆM"],
  ["Vì sao kết quả tải lượng virus HIV dưới ngưỡng phát hiện (Undetectable) bằng Real-time RT-PCR có ý nghĩa 'Không lây truyền' (K=K / U=U)?",["Vì virus đã bị tiêu diệt hoàn toàn 100% khỏi cơ thể","Vì nồng độ virus trong máu quá thấp không đủ khả năng lây truyền qua đường tình dục","Vì người bệnh đã có miễn dịch vĩnh viễn","Vì xét nghiệm PCR bị hỏng"],1,"Tải lượng HIV dưới ngưỡng phát hiện (<50 copies/mL) chứng tỏ điều trị ARV hiệu quả, nồng độ virus cực thấp không còn khả năng lây truyền qua đường tình dục (K=K)."],
  ["Mục đích của việc sử dụng chứng nội (Internal Control - IC) thêm vào mẫu trước khi tách chiết trong xét nghiệm Real-time PCR vi sinh là gì?",["Để tăng tốc độ phản ứng PCR lên gấp đôi","Kiểm soát toàn bộ quá trình tách chiết, phát hiện sự hiện diện của chất ức chế PCR gây âm tính giả","Để thay thế mẫu bệnh phẩm của bệnh nhân","Giúp diệt khuẩn trong ống nghiệm"],1,"Chứng nội IC giúp giám sát chất lượng quy trình tách chiết ADN/ARN và phát hiện các chất ức chế PCR có trong mẫu bệnh phẩm."],
  ["Gen EGFR mã hóa cho thụ thể nào và đóng vai trò gì trong tế bào?",["Thụ thể Insulin điều hòa đường huyết","Thụ thể yếu tố sinh trưởng thượng bì (Epidermal Growth Factor Receptor) điều hòa sự tăng sinh tế bào","Thụ thể TSH kích thích tuyến giáp","Thụ thể Yếu tố đông máu VIII"],1,"Gen EGFR mã hóa cho thụ thể yếu tố sinh trưởng thượng bì (Epidermal Growth Factor Receptor - Receptor Tyrosine Kinase) điều hòa tín hiệu tăng sinh tế bào."],
  ["Xét nghiệm đột biến gen EGFR được chỉ định phổ biến nhất trong loại ung thư nào để hướng dẫn điều trị trúng đích?",["Ung thư vú thể thụ thể nội tiết dương tính","Ung thư phổi không tế bào nhỏ (NSCLC)","Ung thư tuyến giáp thể nhú","Ung thư tế bào gan nguyên phát (HCC)"],1,"Xét nghiệm đột biến gen EGFR được chỉ định bắt buộc trong ung thư phổi không tế bào nhỏ (NSCLC) để lựa chọn thuốc điều trị trúng đích TKI."],
  ["Các đột biến gen EGFR nhạy cảm hoặc kháng thuốc TKI tập trung chủ yếu trên các exon nào của gen?",["Exon 1, 2, 3, 4","Exon 18, 19, 20, 21","Exon 10, 12, 14, 16","Exon 22, 24, 26, 28"],1,"Thử nghiệm cobas EGFR Mutation Test v2 định danh các đột biến trên các exon 18, 19, 20 và 21 của gen EGFR."],
  ["Thử nghiệm cobas® EGFR Mutation Test v2 sử dụng nguyên lý kỹ thuật SHPT nào?",["Kỹ thuật Western Blot","Real-time PCR định tính và bán định lượng","Kỹ thuật lai tại chỗ huỳnh quang (FISH)","Điện di miễn dịch định lượng"],1,"cobas® EGFR Mutation Test v2 là thử nghiệm Real-time PCR định tính và bán định lượng phát hiện các đột biến gen EGFR."],
  ["Mẫu bệnh phẩm tiêu chuẩn vàng truyền thống dùng để làm xét nghiệm đột biến gen EGFR là gì?",["Mẫu đút khối paraffin mô u cố định formalin (FFPET)","Mẫu nước bọt","Mẫu tủy xương","Mẫu móng tay"],0,"Bệnh phẩm tiêu chuẩn là mô ung thư cố định formalin đúc khối paraffin (FFPET - Formalin-Fixed Paraffin-Embedded Tissue)."],
  ["Trong trường hợp không thể thu thập được mẫu mô ung thư FFPET, loại bệnh phẩm 'sinh thiết lỏng' (Liquid Biopsy) nào được chấp thuận để xét nghiệm đột biến EGFR?",["ADN tự do trong huyết tương (cfDNA - circulating free DNA)","Hồng cầu chứa hemoglobin","Dịch mật","Nước tiểu buổi sáng"],0,"Khi không có mẫu mô FFPET, có thể sử dụng mẫu huyết tương bệnh nhân để tách chiết cfDNA (circulating free DNA - sinh thiết lỏng)."],
  ["Bộ kit tách chiết chuyên dụng dùng để thu nhận cfDNA từ huyết tương bệnh nhân phục vụ xét nghiệm cobas EGFR là gì?",["cobas® DNA Sample Preparation Kit","cobas® cfDNA Sample Preparation Kit","QIAamp Viral RNA Kit","Wizard Genomic DNA Kit"],1,"Mẫu huyết tương được xử lý bằng bộ kit tách chiết cobas® cfDNA Sample Preparation Kit."],
  ["Đột biến mất đoạn exon 19 (EX19Del) của gen EGFR có ý nghĩa lâm sàng gì quan trọng?",["Dẫn đến kháng hoàn toàn với tất cả các thuốc","Là đột biến hoạt hóa, nhạy cảm với các thuốc TKI thế hệ 1, 2 và 3","Là dấu hiệu ung thư đã khỏi hoàn toàn","Chỉ gặp ở nam giới hút thuốc lá"],1,"Đột biến EX19Del (mất đoạn exon 19) là đột biến phổ biến nhất nhạy cảm với các thuốc điều trị trúng đích TKI (Gefitinib, Erlotinib, Afatinib, Osimertinib). ÔN TẬP KHAI THÁC & ỨNG DỤNG SINH HỌC PHÂN TỬ TRONG LÂM SÀNG                                                  90 CÂU TRẮC NGHIỆM"],
  ["Đột biến điểm L858R nằm trên exon nào của gen EGFR?",["Exon 18","Exon 19","Exon 20","Exon 21"],3,"Đột biến điểm L858R (thay thế Arginine cho Leucine tại vị trí 858) nằm trên Exon 21 của gen EGFR."],
  ["Đột biến T790M trên exon 20 gen EGFR có ý nghĩa lâm sàng đặc biệt nào trong quá trình điều trị bệnh nhân ung thư phổi?",["Dấu hiệu bệnh nhân nhạy cảm hơn với TKI thế hệ 1","Là cơ chế kháng thuốc thứ phát chính đối với các thuốc TKI thế hệ 1 và 2","Làm cho bệnh nhân không thể thử nghiệm PCR","Gây dị ứng với thuốc hóa trị"],1,"Đột biến T790M (exon 20) xuất hiện sau điều trị TKI thế hệ 1/2, là nguyên nhân chính gây kháng thuốc thứ phát (chiếm ~50% trường hợp kháng)."],
  ["Thuốc TKI thế hệ 3 nào được chỉ định điều trị trúng đích hiệu quả khi bệnh nhân ung thư phổi xuất hiện đột biến kháng T790M?",["Erlotinib","Gefitinib","Osimertinib","Cisplatin"],2,"Osimertinib là thuốc TKI thế hệ 3 có khả năng ức chế đặc hiệu đột biến kháng T790M cũng như các đột biến nhạy thuốc EX19Del và L858R."],
  ["Trong thử nghiệm cobas® EGFR Mutation Test v2, hỗn hợp phản ứng MMX1 được thiết kế để phát hiện các đột biến nào?",["L858R và T790M","Mất đoạn Exon 19 (EX19Del) và đột biến điểm S768I","L861Q và G719X","Đột biến chèn đoạn Exon 20"],1,"Trong thử nghiệm cobas EGFR v2, MMX1 chứa chất phản ứng phát hiện EX19Del và S768I."],
  ["Hỗn hợp phản ứng MMX2 trong thử nghiệm cobas® EGFR Mutation Test v2 nhắm đến phát hiện hai đột biến quan trọng nào?",["EX19Del và G719S","L858R và T790M","L861Q và EX20Ins","S768I và EX19Del"],1,"Hỗn hợp MMX2 được dùng để phát hiện hai đột biến chủ chốt là L858R (nhạy thuốc) và T790M (kháng thuốc)."],
  ["Hỗn hợp phản ứng MMX3 v.2 trong thử nghiệm cobas® EGFR Mutation Test v2 phát hiện nhóm đột biến nào?",["L858R và T790M","EX19Del và S768I","L861Q, G719A/C/S và chèn đoạn Exon 20 (EX20Ins)","Tất cả các gen đuôi Poly(A)"],2,"MMX3 v.2 phát hiện nhóm đột biến L861Q, nhóm G719A/C/S và chèn đoạn Exon 20 (EX20Ins)."],
  ["Đột biến chèn đoạn Exon 20 (EX20Ins) của gen EGFR có đặc điểm lâm sàng nào?",["Đáp ứng rất tốt với Gefitinib","Thường đề kháng với đa số các thuốc TKI thế hệ 1 và 2 cổ điển","Chỉ xuất hiện ở bệnh nhân ung thư vú","Không thể phát hiện bằng PCR"],1,"Đột biến EX20Ins (chèn đoạn exon 20) thuộc nhóm đột biến hiếm, thường gây kháng với các TKI thế hệ 1 và 2."],
  ["Mục đích của việc xét nghiệm chuỗi liên tục (serial measurement) trạng thái đột biến EGFR ở huyết tương bệnh nhân là gì?",["Theo dõi diễn tiến, đáp ứng điều trị và phát hiện sớm sự xuất hiện của đột biến kháng thuốc (như T790M)","Để kiểm tra nhóm máu của bệnh nhân có bị thay đổi không","Để xác định bệnh nhân có nhiễm vi khuẩn hay không","Nhằm mục đích thay thế hoàn toàn chụp X-quang"],0,"Xét nghiệm chuỗi (serial measurement) từ mẫu cfDNA huyết tương hỗ trợ quản lý bệnh nhân NSCLC, theo dõi đáp ứng và phát hiện sớm đột biến kháng T790M."],
  ["Ưu điểm nổi bật của 'Sinh thiết lỏng' (Liquid Biopsy) dựa trên cfDNA huyết tương so với sinh thiết mô u FFPET là gì?",["Chi phí rẻ hơn 100 lần","Không xâm lấn, dễ thu mẫu lặp lại nhiều lần và phản ánh được tính bất đồng nhất của toàn bộ khối u","Không cần máy móc Real-time PCR","Có thể lấy mẫu tại nhà không cần nhân viên y tế"],1,"Sinh thiết lỏng không xâm lấn (chỉ cần lấy máu tĩnh mạch), dễ lấy mẫu theo dõi liên tục và giảm sai số do tính bất đồng nhất của khối u so với sinh thiết mô 1 vị trí."],
  ["Thiết bị phân tích Real-time PCR tự động được sử dụng đi kèm với thử nghiệm cobas® EGFR Mutation Test v2 là gì?",["Máy cobas z 480 analyzer","Máy điện di mao quản ABI 3500","Máy hiển vi huỳnh quang Leica","Máy ly tâm siêu tốc Beckman"],0,"cobas® EGFR Mutation Test v2 được thực hiện trên hệ thống máy phân tích khuếch đại tự động cobas z 480 analyzer. ÔN TẬP KHAI THÁC & ỨNG DỤNG SINH HỌC PHÂN TỬ TRONG LÂM SÀNG                                                 90 CÂU TRẮC NGHIỆM"],
  ["Ý nghĩa của chất kiểm soát nội bộ (Internal Control - IC) được đưa vào mỗi giếng phản ứng cobas EGFR là gì?",["Kiểm tra chất lượng mẫu, hiệu quả khuếch đại và phát hiện chất ức chế PCR trong mẫu bệnh phẩm","Tạo màu huỳnh quang cho ống nghiệm","Tiêu diệt tế bào ung thư còn sót lại","Thay thế mẫu chuẩn của nhà sản xuất"],0,"Mỗi giếng phản ứng chứa chứng nội IC (EX28/IC) giúp xác định phản ứng PCR hoạt động tốt, không bị hiện tượng ức chế PCR gây âm tính giả."],
  ["Khái niệm 'Y học chính xác' (Precision Medicine) trong ung thư phổi dựa trên SHPT được hiểu như thế nào?",["Dùng chung một phác đồ hóa trị cho tất cả bệnh nhân ung thư","Lựa chọn phác đồ điều trị trúng đích cá thể hóa dựa trên việc xác định chính xác đột biến gen của từng bệnh nhân","Điều trị ung thư bằng phương pháp Đông y truyền thống","Phẫu thuật cắt bỏ toàn bộ hai bên phổi"],1,"Y học chính xác / cá thể hóa lựa chọn đúng thuốc trúng đích (TKI) dựa trên sự hiện diện của đột biến gen (EGFR) ở từng bệnh nhân cụ thể."],
  ["Tại sao mẫu mô đúc khối paraffin FFPET lại đòi hỏi quy trình tách chiết ADN đặc thù?",["Vì Formalin gây liên kết chéo (cross-linking) giữa ADN với protein và gây đứt gãy ADN","Vì Paraffin làm ADN biến thành ARN","Vì mô FFPET không chứa ADN","Vì Formalin biến tế bào u thành vi khuẩn"],0,"Cố định Formalin tạo các liên kết chéo methylene bridge giữa ADN và protein, làm đứt gãy ADN nên cần bước giải liên kết chéo và thu nhận ADN chất lượng."],
  ["Tần suất đột biến gen EGFR ở bệnh nhân ung thư phổi không tế bào nhỏ (NSCLC) ở chủng tộc người Châu Á khoảng bao nhiêu?",["Dưới 5%","Khoảng 10-15%","Khoảng 40-50%","Trên 95%"],2,"Tần suất đột biến EGFR ở bệnh nhân NSCLC người Châu Á (không hút thuốc, ung thư biểu mô tuyến) rất cao, đạt khoảng 40-50% (so với 10-15% ở người da trắng)."],
  ["Khi kết quả xét nghiệm đột biến EGFR từ mẫu huyết tương (cfDNA) trả về ÂM TÍNH, khuyến cáo lâm sàng tiếp theo là gì?",["Khẳng định 100% bệnh nhân không có đột biến và dừng điều trị","Khuyên bệnh nhân làm lại sinh thiết mô ung thư (FFPET) để xét nghiệm lại do cfDNA có thể phóng thích dưới ngưỡng","Đổi phác đồ sang điều trị phẫu thuật ngay lập tức","Kết luận mẫu máu bị hỏng và bỏ qua"],1,"Do nồng độ cfDNA trong máu có thể rất thấp (âm tính giả), nếu kết quả cfDNA âm tính thì khuyến cáo xét nghiệm lại trên mẫu mô ung thư (FFPET) nếu có thể."],
  ["Đột biến S768I nằm trên exon nào của gen EGFR?",["Exon 18","Exon 19","Exon 20","Exon 21"],2,"Đột biến điểm S768I nằm trên Exon 20 của gen EGFR."],
  ["Đột biến G719A/C/S thuộc nhóm đột biến nào trên gen EGFR?",["Đột biến điểm nằm trên Exon 18","Đột biến mất đoạn Exon 19","Đột biến chèn đoạn Exon 20","Đột biến điểm Exon 21"],0,"Các đột biến điểm tại vị trí codon 719 (G719A, G719C, G719S) nằm trên Exon 18 của gen EGFR."],
  ["Đột biến L861Q nằm trên exon nào của gen EGFR?",["Exon 18","Exon 19","Exon 20","Exon 21"],3,"Đột biến điểm L861Q nằm trên Exon 21 của gen EGFR."],
  ["Tồn dư tối thiểu của ung thư (MRD - Minimal Residual Disease) theo dõi bằng SHPT dựa trên chỉ số nào trong sinh thiết lỏng?",["Tải lượng ADN khối u lưu hành (ctDNA - circulating tumor DNA)","Nồng độ Glucose máu","Số lượng hồng cầu ngoại vi","Nồng độ Men gan ALT"],0,"Theo dõi MRD dựa trên việc phát hiện vết ctDNA (circulating tumor DNA) còn sót lại trong máu sau điều trị phẫu thuật/hóa trị."],
  ["Khái niệm 'Đột biến xôma' (Somatic mutation) trong ung thư học phân tử có đặc điểm gì?",["Xuất hiện ở tất cả các tế bào cơ thể và di truyền cho thế hệ sau","Chỉ xuất hiện ở các tế bào khối u, không có ở tế bào lành và không di truyền cho con cái","Do nhiễm trùng vi khuẩn gây ra","Chỉ gặp ở thai nhi trong bụng mẹ"],1,"Đột biến xôma (somatic) phát sinh trong quá trình sống chỉ có ở tế bào khối u, không di truyền cho thế hệ sau (khác với đột biến dòng mầm germline). ÔN TẬP KHAI THÁC & ỨNG DỤNG SINH HỌC PHÂN TỬ TRONG LÂM SÀNG                                                  90 CÂU TRẮC NGHIỆM"],
  ["Kỹ thuật Giải trình tự thế hệ mới (NGS) có ưu điểm gì vượt trội so với Real-time PCR đơn lẻ trong phân tích đột biến ung thư?",["Thời gian thực hiện chỉ trong 5 phút","Phân tích đồng thời hàng trăm gen và phát hiện các đột biến mới chưa biết trước trong một lần chạy","Chi phí rẻ hơn PCR rất nhiều lần","Không cần tách chiết ADN từ mẫu bệnh phẩm"],1,"NGS có khả năng đọc song song hàng triệu đoạn ADN, giúp giải trình tự toàn bộ các exon của hàng trăm gen ung thư cùng lúc và phát hiện đột biến mới."],
  ["Vai trò của hội chẩn đa chuyên khoa (MDT) kết hợp kết quả chẩn đoán phân tử trong điều trị ung thư là gì?",["Tối ưu hóa phác đồ cá thể hóa kết hợp phẫu thuật, hóa trị, xạ trị và điều trị trúng đích cho bệnh nhân","Giảm bớt số lượng bác sĩ tham gia điều trị","Bỏ qua các bước xét nghiệm hình ảnh học","Thay thế toàn bộ thuốc tây bằng thuốc nam"],0,"MDT kết hợp Bệnh học Phân tử, Ung bướu, Ngoại khoa, Xạ trị... giúp xây dựng phác đồ điều trị trúng đích tối ưu nhất cho từng bệnh nhân."]
