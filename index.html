<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập trắc nghiệm</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7385;--bd:#d9dde8;--ac:#2f6fed;--ok:#1a8a4a;--okb:#e3f6ea;--no:#c62f3b;--nob:#fde8ea}
@media(prefers-color-scheme:dark){:root{--bg:#14171f;--card:#1e222d;--tx:#e8ebf2;--mu:#9aa3b5;--bd:#333a4a;--ac:#6d9bff;--ok:#5fd18a;--okb:#16301f;--no:#ff7b86;--nob:#3a1a1e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:820px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.5rem;margin:.2em 0}
.sub{color:var(--mu);margin:0 0 16px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--bd);margin-bottom:16px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
label.t{display:flex;gap:6px;align-items:center;color:var(--mu);font-size:.92rem}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
.q h3{font-size:1rem;margin:0 0 10px}
.q h3 span{color:var(--ac)}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border-radius:9px;border:1px solid var(--bd);background:transparent}
.o b{min-width:1.4em;color:var(--mu)}
.o:hover{border-color:var(--ac)}
.o.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.o.ok{border-color:var(--ok);background:var(--okb)}
.o.no{border-color:var(--no);background:var(--nob)}
.ex{display:none;margin-top:8px;padding:10px 12px;border-radius:9px;background:var(--okb);border-left:4px solid var(--ok);font-size:.93rem}
.ex.s{display:block}
.res{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px;display:none}
.res.s{display:block}
.res big{font-size:1.6rem;font-weight:700}
</style>
</head>
<body>
<div class="w">
<h1 id="title">Ôn tập trắc nghiệm</h1>
<div class="bar">
<div class="ctl">
<select id="part"><option value="all">Glucide: Cả 70 câu</option><option value="1">Glucide: Hóa học (1–35)</option><option value="2">Glucide: Chuyển hóa (36–70)</option><option value="shpt">Kỹ thuật SHPT cơ bản</option><option value="seq">Giải trình tự DNA (40 câu)</option><option value="enzyme">Enzyme (50 câu)</option><option value="hormone">Hormone (50 câu)</option><option value="vitamin">Vitamin (50 câu)</option><option value="lipid">Lipid: Hóa học &amp; Chuyển hóa (100 câu)</option><option value="translation">Dịch mã – Sinh tổng hợp protein (70 câu)</option><option value="replication">Nhân đôi &amp; sửa chữa DNA (50 câu)</option><option value="renal">Hóa sinh mô thận (70 câu)</option><option value="hepato">Hóa sinh gan, mật, tụy (70 câu)</option><option value="cardiac">Hóa sinh cơ tim (70 câu)</option><option value="applications">Ứng dụng sinh học phân tử (90 câu)</option><option value="tgP2">Chuyển hóa lipid P2 (40 câu)</option></select>
<button id="shuf">Xáo trộn</button>
<label class="t"><input type="checkbox" id="inst"> Hiện đáp án ngay khi chọn</label>
<button class="p" id="sub">Nộp bài</button>
<button id="rst">Làm lại</button>
</div>
<div class="prog"><i id="pg"></i></div>
</div>
<div class="res" id="res"></div>
<div id="list"></div>
</div>
<script>
const D=[
["Công thức cấu tạo chung của carbohydrate là:",["(CH₂O)ₙ, n ≥ 2","(CH₂O)ₙ, n ≥ 3","(CHO)ₙ, n ≥ 3","(C₂H₄O)ₙ, n ≥ 3"],1,"Công thức chung (CH₂O)ₙ, n ≥ 3."],
["Glucid chiếm khoảng bao nhiêu trọng lượng khô của động vật (ĐV) và thực vật (TV)?",["80–90% ở ĐV, 2% ở TV","20% ở ĐV, 50% ở TV","10% ở ĐV, 30% ở TV","2% ở ĐV, 80–90% ở TV"],3,"Glucid chiếm 2% trọng lượng khô của ĐV và 80–90% của TV."],
["Đặc điểm nào sau đây đúng với monosaccharide (MS)?",["Là đơn vị cơ bản của carbohydrate, không thể thủy phân thành carbohydrate nhỏ hơn","Thủy phân tạo ra 2 phân tử đường đôi","Chỉ chứa nhóm chức acid carboxylic","Luôn có phân tử lượng rất lớn"],0,"MS là đơn vị cơ bản, không thủy phân thành carbohydrate nhỏ hơn."],
["MS gồm những nhóm chức nào?",["2 chức aldehyde + chức acid","1 chức ester + chức amin","1 chức khử (aldehyde/ketone) + chức alcol","1 chức acid + chức ketone"],2,"MS gồm 1 chức khử (aldehyde/ketone) và chức alcol."],
["Fructose thuộc loại:",["Aldohexose","Ketopentose","Aldopentose","Ketohexose"],3,"Fructose là ketohexose (6C, chức ketone)."],

["MS nào sau đây KHÔNG có carbon bất đối nên không có tính quang hoạt?",["Glyceraldehyde","Dioxyaceton","Erythrose","Ribose"],1,"Dioxyaceton không có C* nên không quang hoạt."],
["MS thuộc dạng D khi:",["Nhóm –OH đứng bên phải của carbon bất đối xứng xa nhóm carbonyl nhất","Nhóm –OH đứng bên trái của carbon bất đối xứng xa nhóm carbonyl nhất","Nhóm –OH bán acetal nằm cùng phía với –OH tự do","Có nhóm carbonyl ở vị trí C2"],0,"Dạng D có –OH bên phải của C* xa nhóm carbonyl nhất."],
["Glucose và fructose có mối quan hệ nào sau đây?",["Đồng phân lập thể enantiomer","Epimer","Đồng phân quang học","Đồng phân hóa học (khác nhau về chức aldehyde hoặc ketone)"],3,"Glucose (aldose) và fructose (ketose) là đồng phân hóa học."],
["Epimer là các đồng phân:",["Cùng công thức hóa học nhưng khác hoàn toàn cấu trúc phân tử","Chỉ khác nhau tại một trung tâm dị lập thể","Khác nhau về nhóm chức","Là ảnh gương hoàn toàn của nhau"],1,"Epimer chỉ khác nhau ở một trung tâm dị lập thể."],
["Mannose là epimer của glucose ở carbon số mấy?",["C-1","C-3","C-2","C-4"],2,"Mannose là C-2 epimer của glucose; galactose là C-4 epimer."],
["Trong công thức Haworth, dạng α có đặc điểm:",["Nhóm –OH bán acetal nằm cùng phía với nhóm –OH tự do của C* xa nhất","Không có nhóm –OH bán acetal","Có cấu trúc mạch thẳng","Nhóm –OH bán acetal nằm khác phía với nhóm –OH tự do của C* xa nhất"],3,"Dạng α: –OH bán acetal khác phía với –OH tự do của C* xa nhất. Dạng β thì cùng phía."],
["Sự chuyển đổi qua lại giữa hai đồng phân dạng α và β của glucose trong dung dịch nước được gọi là:",["Hiện tượng chuyển quay (mutarotation)","Hiện tượng thủy phân","Hiện tượng đồng phân hóa","Hiện tượng trùng hợp"],0,"Sự chuyển đổi α ⇄ β gọi là hiện tượng chuyển quay."],
["Ở trạng thái cân bằng động trong dung dịch nước, tỉ lệ các dạng của glucose xấp xỉ:",["α-D-glucose 37%; dạng thẳng 0,1%; β-D-glucose 63%","α-D-glucose 63%; dạng thẳng 0,1%; β-D-glucose 37%","α-D-glucose 50%; dạng thẳng 0%; β-D-glucose 50%","α-D-glucose 10%; dạng thẳng 80%; β-D-glucose 10%"],0,"Cân bằng: α ≈ 37%, dạng thẳng ≈ 0,1%, β ≈ 63%."],
["Cầu oxy (liên kết hemiacetal/hemicetal) ở MS được tạo thành do phản ứng giữa:",["Hai nhóm aldehyde với nhau","Nhóm carboxyl với nhóm amin","Nhóm aldehyde hoặc ceton với alcol","Hai nhóm alcol với nhau"],2,"Aldehyde hoặc ceton + alcol → bán acetal hoặc bán cetal (cầu oxy)."],
["Khi glucose bị oxy hóa ở C6 (nhóm alcol bậc 1) sẽ tạo thành:",["Glucuronic acid","Gluconic acid","Glucosaccharic acid","Sorbitol"],0,"Oxy hóa ở C6 tạo glucuronic acid. Ở C1 tạo gluconic acid, ở C1 và C6 tạo glucosaccharic acid."],

["Phát biểu đúng về amylose:",["Có nhiều mạch nhánh với liên kết α-1,6","Gồm các đơn vị β-D-glucose nối bằng liên kết β-1,4","Cho màu đỏ tím với iodine","Gồm vài trăm đến vài nghìn đơn vị α-D-glucose nối α-1,4, mạch thẳng, có thể xoắn, cho màu xanh tím với iodine"],3,"Amylose: mạch thẳng α-1,4, xoắn (6 đơn vị glucose/vòng), màu xanh tím với iodine."],

["SGLT1 ở tế bào ruột có chức năng:",["Đưa glucose, galactose, fructose ra máu","Vận chuyển đồng thời glucose (hoặc galactose) và Na⁺ vào tế bào biểu mô ruột","Chỉ vận chuyển fructose","Vận chuyển insulin"],1,"SGLT1 vận chuyển đồng thời glucose (galactose) và Na⁺ vào tế bào ruột."],

["Chất vận chuyển nào chỉ vận chuyển fructose mà không vận chuyển glucose?",["GLUT1","GLUT2","GLUT3","GLUT5"],3,"GLUT5 chỉ vận chuyển fructose, không vận chuyển glucose."],
["GLUT4 được biểu hiện chủ yếu ở:",["Hồng cầu và não","Gan và tế bào β tụy","Cơ xương, tim và tế bào mỡ","Tinh hoàn"],2,"GLUT4 có ở cơ xương, tim, tế bào mỡ trắng và mỡ nâu."],
["Phản ứng số 1 của đường phân (glucose → glucose-6-phosphate) được xúc tác bởi:",["Hexokinase, cần Mg²⁺ và ATP","Phosphofructokinase-1","Pyruvate kinase","Aldolase"],0,"Phản ứng 1: hexokinase, cần Mg²⁺ và ATP, tạo G6P."],
["Glucokinase ở gan phosphoryl hóa glucose khi:",["Glucose máu giảm thấp","Gan đang cạn kiệt ATP","Có mặt fluoride","Glucose máu tăng cao"],3,"Glucokinase ở gan chỉ hoạt động khi glucose máu tăng cao."],

["Quá trình Acetyl hóa histone được thực hiện bởi enzyme nào?",["HDAC (Histone Deacetylase)","HAT (Histone Acetyltransferase)","KMT (Lysine Methyltransferase)","DNA Polymerase"],1,"HAT thêm nhóm acetyl vào lysine; HDAC ngược lại loại bỏ nhóm acetyl."],
["Cơ chế Acetyl hóa histone giúp kích hoạt sao mã là gì?",["Thêm điện tích dương cho histone","Trung hòa điện tích dương lysine, giảm ái lực histone-DNA, dãn mở chromatin","Tăng lực hút giữa histone và DNA","Đóng chặt cấu trúc chromatin"],1,"Acetyl hóa trung hòa điện +, chromatin dãn mở (euchromatin) → RNA polymerase tiếp cận được gen."],
["Enzyme HDAC có tác động gì lên chromatin và sao mã?",["Loại bỏ nhóm acetyl, nén chặt chromatin, ức chế sao mã","Thêm nhóm acetyl, dãn mở chromatin, kích hoạt sao mã","Gắn nhóm methyl tăng dịch mã","Cắt đứt chuỗi DNA"],0,"HDAC loại acetyl → khôi phục điện tích + histone → heterochromatin → ức chế sao mã."],
["Enzyme KMT xúc tác biến đổi histone nào?",["Acetyl hóa","Methyl hóa (Methylation)","Lactyl hóa","Phosphoryl hóa"],1,"KMT (Lysine Methyltransferase) gắn nhóm methyl vào lysine hoặc arginine trên đuôi histone."],
["Methyl hóa histone ảnh hưởng thế nào đến biểu hiện gen?",["Luôn kích hoạt sao mã","Luôn ức chế sao mã","Có thể kích hoạt hoặc ức chế tùy vị trí amino acid","Không có ảnh hưởng"],2,"Methyl hóa linh hoạt: H3K36me3 kích hoạt; H3K27me3 ức chế sao mã."],
["Loại biến đổi histone mới nào ảnh hưởng đến động lực chromatin?",["Glucosyl hóa","Lactyl hóa, crotonyl hóa, succinyl hóa","Sulfat hóa","Hydroxyl hóa"],1,"Các biến đổi mới: lactyl hóa, crotonyl hóa, succinyl hóa; là mục tiêu điều trị tiềm năng."],
["Vùng DNA nằm trước vùng mã hóa chứa trình tự kiểm soát khởi đầu sao mã gọi là?",["Vùng kết thúc (Terminator)","Vùng điều hòa / Promoter","Intron","Exon"],1,"Promoter nằm đầu gen, chứa hộp TATA và các trình tự điều hòa khởi đầu sao mã."],
["Đặc điểm nào mô tả ĐÚNG về gen của sinh vật nhân sơ (Prokaryote)?",["Gen phân mảnh có xen kẽ intron và exon","Gen không phân mảnh (cấu trúc liên tục)","Luôn chứa intron rất dài","Không có vùng điều hòa sao mã"],1,"Gen nhân sơ không phân mảnh: vùng mã hóa liên tục, không có intron."],
["Phát biểu nào SAI về cấu trúc bộ gen người?",["Chỉ ~1-2% bộ gen mã hóa protein","Phần lớn gen mã hóa là gen phân mảnh chứa intron và exon","80% bộ gen hoàn toàn không có chức năng sinh học (gen rác)","Bộ gen người và tinh tinh tương đồng ~98%"],2,"Sai: 80% bộ gen có chức năng điều hòa (theo ENCODE); không phải toàn bộ là 'gen rác'."],
["Điều hòa biểu hiện gen ở eukaryote diễn ra ở giai đoạn nào?",["Chỉ ở giai đoạn sao mã","Chỉ ở giai đoạn dịch mã","Cả sao mã lẫn sau sao mã (xử lý pre-mRNA, dịch mã, ổn định mRNA)","Chỉ khi DNA tái bản xong"],2,"Điều hòa đa cấp ở eukaryote: chromatin → sao mã → xử lý RNA → dịch mã → ổn định protein."],
["Nguyên lý cơ bản của kỹ thuật lai phân tử dựa trên quá trình nào?",["Cắt dán DNA bằng enzyme hạn chế","Bắt cặp bổ sung giữa sợi đơn probe và sợi đơn target","Nhân đôi DNA bằng polymerase","Dịch mã tạo chuỗi polypeptide"],1,"Lai phân tử: probe sợi đơn bắt cặp bổ sung đặc hiệu với target sợi đơn."],
["Phân tử 'đoạn dò' (probe) trong lai phân tử là gì?",["Đoạn protein đã nhuộm màu","Đoạn DNA hoặc RNA sợi đơn/sợi đôi có trình tự bổ sung với phân tử đích","Chuỗi polysaccharide mang nhãn huỳnh quang","Lipid màng tế bào"],1,"Probe: đoạn acid nucleic 20bp-2kb, bổ sung với target, được đánh dấu để nhận diện."],
["Khi tham gia phản ứng lai, probe bắt buộc phải ở dạng nào?",["Sợi đôi xoắn chặt","Sợi đơn","Cấu trúc kẹp tóc (hairpin)","Dạng vòng khép kín"],1,"Probe sợi đôi phải biến tính thành sợi đơn trước khi lai để bắt cặp bổ sung với target."],
["Kích thước phổ biến của đoạn dò trong lai phân tử là bao nhiêu?",["2 đến 5 bp","20 bp đến 2 kb","10 kb đến 100 kb","Trên 1 Mb"],1,"Probe dài 20bp-2kb: đủ đặc hiệu và đủ linh hoạt để tìm đích trong hỗn hợp phức tạp."],
["Hai đặc điểm quan trọng giúp lai phân tử có độ chính xác cao là gì?",["Probe gắn ngẫu nhiên và phản ứng ở 0°C","Probe chỉ gắn đặc hiệu với trình tự đích và tìm được đích giữa hàng triệu phân tử","Probe tự nhân đôi và tự phát sáng","Probe phá hủy phân tử không phải đích"],1,"Hai tính chất cốt lõi: (1) đặc hiệu cao; (2) nhạy cao – phát hiện đích giữa triệu phân tử khác."],
["Nhãn đánh dấu probe bằng đồng vị phóng xạ (32P, 35S) phát hiện bằng kỹ thuật nào?",["Phóng xạ tự ghi (Autoradiography)","Kỹ thuật so màu","Đo quang phổ","Kính hiển vi điện tử"],0,"Autoradiography: film X-quang đặt lên gel/màng bị tối ở vùng có phóng xạ."],
["Hệ thống Biotine/Streptavidine dùng trong phương pháp đánh dấu probe nào?",["Phóng xạ tự ghi","Kỹ thuật so màu (Colorimetric assay)","Đo điện tâm đồ","Điện di gel"],1,"Biotin-streptavidin liên kết với enzyme tạo màu → phát hiện vị trí lai qua màu sắc."],
["Kỹ thuật đo quang phổ/huỳnh quang dùng khi probe đánh dấu bằng chất nào?",["Đồng vị phóng xạ 35S","Chất phát quang sinh học / phẩm màu huỳnh quang","Kim loại nặng Lead","Amino acid tự do"],1,"Probe gắn fluorophore → phát huỳnh quang → đo bằng máy đo quang phổ/kính HV huỳnh quang."],
["Nhiệt độ nóng chảy (Tm) của DNA được định nghĩa như thế nào?",["Nhiệt độ 100% DNA bị phân hủy","Nhiệt độ mà 50% phân tử DNA sợi đôi phân tách thành sợi đơn","Nhiệt độ DNA Polymerase hoạt động tối ưu","Nhiệt độ đông đặc của dung dịch DNA"],1,"Tm: điểm giữa đường cong biến tính (sigmoidal), tại đó 50% dsDNA → ssDNA."],
["Đồ thị biểu diễn sự biến tính nhiệt của DNA có hình dạng đặc trưng nào?",["Đường thẳng đứng","Đường cong chữ S (Sigmoidal)","Đường parabol","Đường ngang không đổi"],1,"Đường cong biến tính dạng chữ S: hấp thụ UV tăng dần (hyperchromic effect)."],
["Công thức Wallace tính Tm cho oligonucleotide ngắn là gì?",["Tm = 4(A+T) + 2(G+C)","Tm = 2(A+T) + 4(G+C)","Tm = 2(A+G) + 4(T+C)","Tm = (A+T+G+C)/2"],1,"Công thức Wallace: Tm = 2(A+T) + 4(G+C) °C. G-C đóng góp nhiều hơn vì 3 liên kết hydro."],
["Đoạn mồi có 5A, 5T, 3G, 3C. Tm theo công thức Wallace là bao nhiêu?",["32°C","44°C","52°C","60°C"],1,"Tm = 2(5+5) + 4(3+3) = 20 + 24 = 44°C."],
["Nhiệt độ bắt cặp Th thích hợp cho phản ứng lai tính theo công thức nào?",["Th = Tm + 5°C","Th = Tm - 5°C","Th = Tm / 2","Th = Tm + 10°C"],1,"Th = Tm - 5°C: thấp hơn Tm đủ để probe bắt cặp nhưng vẫn đảm bảo tính đặc hiệu."],
["Tại sao DNA có % GC cao lại có Tm cao hơn?",["G-C có 3 liên kết hydro, bền hơn A-T (2 liên kết hydro)","G và C có khối lượng lớn hơn A và T","G-C chứa đường ribose","G-C tích điện dương mạnh hơn"],0,"3 liên kết hydro G-C cần nhiều năng lượng hơn để phá vỡ so với 2 liên kết hydro A-T."],
["Nồng độ muối (Na+, Mg2+) ảnh hưởng thế nào đến Tm?",["Tăng muối làm giảm Tm","Ion dương trung hòa điện âm sườn phosphate, ổn định sợi đôi và TĂNG Tm","Nồng độ muối không ảnh hưởng","Muối làm đứt liên kết phosphodiester"],1,"Cation trung hòa lực đẩy tĩnh điện giữa 2 mạch phosphate âm → sợi đôi bền hơn → Tm cao hơn."],
["Chiều dài đoạn dò ảnh hưởng thế nào đến Tm?",["Dài thì Tm giảm","Dài thì tổng liên kết hydro nhiều hơn, Tm cao hơn","Chiều dài không ảnh hưởng","Ngắn luôn có Tm cao hơn"],1,"Probe dài hơn → nhiều cặp base → nhiều liên kết hydro → cần nhiệt độ cao hơn để tách."],
["Hiện tượng gì xảy ra khi hạ nhiệt độ dung dịch DNA biến tính từ từ?",["DNA bị phân hủy hoàn toàn","Các sợi đơn bổ sung tái hình thành xoắn đôi (hồi tính/reannealing)","DNA kết tủa thành tinh thể","Liên kết phosphodiester bị đứt gãy"],1,"Reannealing: hạ từ từ cho phép sợi đơn tìm cặp bổ sung và hình thành lại sợi đôi."],
["Yếu tố nào KHÔNG ảnh hưởng trực tiếp đến Tm và Th trong phản ứng lai?",["Chiều dài đoạn dò","% GC trong đoạn dò","Nồng độ ion muối","Kích thước ống nghiệm"],3,"Kích thước ống nghiệm không ảnh hưởng đến bản chất nhiệt động của Tm/Th."],
["Nếu Th quá thấp so với Tm, hậu quả sẽ là gì?",["Probe không gắn vào đích","Tăng bắt cặp không đặc hiệu (mismatch) của probe","DNA đích bị biến tính hoàn toàn","Phản ứng lai rất nhanh và chính xác tuyệt đối"],1,"Th quá thấp = stringency thấp → probe bắt cặp sai với trình tự không mong muốn."],
["Nếu Th quá cao vượt qua Tm, hậu quả là gì?",["Probe gắn quá chặt","Probe không bắt cặp bền vững với đích (hiệu suất cực thấp)","Enzyme mất hoạt tính","Tạo sản phẩm lai phụ"],1,"Th > Tm: DNA đích và probe ở dạng sợi đơn tự do → không có phản ứng lai."],
["Probe sợi đôi cần bước xử lý nào trước khi cho vào phản ứng lai?",["Xử lý bằng enzyme ligase","Gia nhiệt biến tính thành sợi đơn","Giảm nhiệt độ xuống 0°C","Bổ sung kiềm đậm đặc"],1,"Probe dsDNA biến tính bằng nhiệt (95-100°C) rồi làm lạnh nhanh → sợi đơn sẵn sàng lai."],
["Khả năng probe phân biệt sai khác 1 nucleotide (SNP) dựa trên nguyên lý nào?",["Thay đổi Tm khi có 1 bazơ bắt cặp sai (mismatch)","Thay đổi khối lượng DNA","Thay đổi chiều dài mạch","Khả năng phát sáng tự phát của SNP"],0,"1 mismatch làm giảm Tm đáng kể → chọn nhiệt độ lai nghiêm ngặt để loại bỏ bắt cặp sai."],
["Chất nào làm giảm Tm của DNA bằng cách yếu hóa liên kết hydro?",["MgCl2","Formamide / Urea","NaCl","Taq Polymerase"],1,"Formamide/Urea làm yếu liên kết hydro → giảm Tm, cho phép lai ở nhiệt độ thấp hơn."],
["Mục đích chính của lai phân tử trong chẩn đoán y sinh là gì?",["Tách chiết lipid từ màng tế bào","Phát hiện và/hoặc định lượng trình tự gen đích đặc hiệu","Tổng hợp chuỗi peptide nhân tạo","Đo độ pH dịch cơ thể"],1,"Lai phân tử: phát hiện gen bệnh, gen vi sinh vật, đột biến trong mẫu sinh học."],
["Sợi DNA probe + sợi RNA target tạo thành phân tử lai nào?",["DNA/DNA homoduplex","DNA/RNA heteroduplex","RNA/RNA homoduplex","Phức hợp polypeptide"],1,"Hai sợi khác bản chất (DNA + RNA) tạo heteroduplex; hai sợi cùng loại tạo homoduplex."],
["Kỹ thuật PCR được định nghĩa là phản ứng gì?",["Phân hủy DNA in vivo","Khuếch đại số lượng một đoạn acid nucleic xác định in vitro","Dịch mã tạo protein ngoài tế bào","Kết hợp giữa lipid và đường"],1,"PCR = Polymerase Chain Reaction: nhân bản đoạn DNA đích in vitro bằng chu kỳ nhiệt."],
["PCR mô phỏng lại hiện tượng sinh học nào trong tế bào?",["Sao mã tổng hợp RNA","Nhân đôi (tái bản) DNA","Dịch mã tổng hợp protein","Đột biến gen"],1,"PCR mô phỏng sao chép DNA tế bào nhưng có kiểm soát: chỉ nhân đoạn giữa 2 mồi."],

["Vai trò của đoạn mồi (primers) trong PCR là gì?",["Cung cấp năng lượng","Bắt cặp vào 2 đầu đích, cung cấp đầu 3'-OH cho polymerase kéo dài","Cắt đứt chuỗi DNA","Nhuộm màu sản phẩm"],1,"Primer: xác định vùng khuếch đại và cung cấp đầu 3'-OH tự do cho Taq polymerase bắt đầu."],

["Enzyme Taq Polymerase được chiết xuất từ vi khuẩn nào?",["Escherichia coli","Thermus aquaticus","Pyrococcus furiosus","Bacillus subtilis"],1,"Taq (Thermus aquaticus): vi khuẩn suối nước nóng Yellowstone; chịu nhiệt 94-96°C."],
["Đặc tính quan trọng nhất của DNA Polymerase dùng trong PCR là gì?",["Hoạt động tốt nhất ở 0°C","Khả năng chịu nhiệt cao mà không mất hoạt tính","Tổng hợp RNA từ khuôn DNA","Cắt đứt liên kết peptide"],1,"Chịu nhiệt là đặc tính cốt lõi: enzyme không bị biến tính ở 94-96°C trong bước biến tính."],
["Enzyme Pfu Polymerase được chiết xuất từ sinh vật nào?",["Thermus aquaticus","Thermococcus lithoralis","Pyrococcus furiosus","Streptococcus pneumoniae"],2,"Pfu (Pyrococcus furiosus): archaea chịu nhiệt; có hoạt tính proofreading, ít lỗi hơn Taq."],
["Vai trò của ion Mg2+ (MgCl2) trong PCR là gì?",["Cung cấp gốc đường cho DNA","Thúc đẩy bắt cặp mồi-đích và ổn định phức hợp enzyme","Phá hủy DNA không mong muốn","Làm giảm nhiệt độ sôi"],1,"Mg2+ là cofactor của Taq polymerase; nồng độ Mg2+ ảnh hưởng lớn đến hiệu suất và đặc hiệu PCR."],
["Một chu kỳ nhiệt PCR tiêu chuẩn gồm bao nhiêu bước?",["2 bước","3 bước","4 bước","5 bước"],1,"3 bước: Biến tính (94-96°C) → Bắt cặp mồi (30-65°C) → Kéo dài (70-72°C)."],
["Nhiệt độ bước Biến tính (Denaturation) thường được cài ở mức nào?",["37-45°C","50-60°C","94-96°C","100-120°C"],2,"94-96°C đủ để phá vỡ liên kết hydro, tách dsDNA thành 2 sợi đơn."],
["Nhiệt độ bước Bắt cặp mồi (Annealing) thường dao động trong khoảng nào?",["10-20°C","30-65°C","72-80°C","90-95°C"],1,"Th = Tm - 5°C; thường 50-65°C tùy thiết kế mồi. Thấp quá → không đặc hiệu; cao quá → không bắt cặp."],
["Nhiệt độ tối ưu cho bước Kéo dài (Extension) dùng Taq Polymerase là bao nhiêu?",["37°C","55°C","65-75°C (thường là 72°C)","95°C"],2,"72°C là nhiệt độ tối ưu của Taq polymerase; Pfu hoạt động tốt ở 72-75°C."],
["Từ 1 phân tử DNA đích, sau 3 chu kỳ PCR thu được bao nhiêu phân tử?",["3","6","8","16"],2,"2^3 = 8 phân tử; sau n chu kỳ: 2^n bản sao."],
["Công thức tính số bản sao từ N0 phân tử ban đầu sau n chu kỳ PCR là gì?",["N = N0 × 2n","N = N0 × 2^n","N = N0 + 2^n","N = (N0)^n"],1,"N = N0 × 2^n; nhân đôi lũy thừa theo số chu kỳ."],
["Real-Time PCR khác PCR cổ điển ở điểm mấu chốt nào?",["Không cần dùng mồi","Theo dõi và định lượng sản phẩm ngay trong quá trình phản ứng (thời gian thực)","Không cần máy chu kỳ nhiệt","Diễn ra ở nhiệt độ âm"],1,"Real-time PCR dùng tín hiệu huỳnh quang để theo dõi tích lũy sản phẩm theo từng chu kỳ."],
["Định lượng tuyệt đối bằng Real-Time PCR nhằm mục đích gì?",["Xác định số bản sao (copy number) ban đầu của đoạn DNA đích","So sánh biểu hiện gen giữa 2 tế bào","Xác định chiều dài nhiễm sắc thể","Đo trọng lượng tế bào"],0,"Dùng đường chuẩn từ mẫu biết trước số copy → suy ra số copy của mẫu chưa biết."],
["Định lượng tương đối bằng Real-Time PCR dùng để đánh giá điều gì?",["Số vi khuẩn trong không khí","Mức độ biểu hiện gen đặc hiệu so với gen nội chuẩn","Chiều dài phân tử RNA","Tuổi thọ vi sinh vật"],1,"So sánh Ct target gene / Ct reference gene; dùng thuật toán 2^-ΔΔCt."],
["Kỹ thuật Multiplex PCR là gì?",["1 cặp mồi cho 100 ống khác nhau","Nhiều cặp mồi và probe trong cùng 1 ống để khuếch đại nhiều đích đồng thời","PCR liên tục trong 1 năm","Khuếch đại toàn bộ bộ gen không cần mồi"],1,"Multiplex PCR: nhiều cặp mồi/probe cùng ống → phát hiện đồng thời nhiều tác nhân gây bệnh."],
["Trong Multiplex Real-Time PCR, phân biệt tín hiệu các đích khác nhau bằng cách nào?",["Probe gắn fluorophore có bước sóng phát xạ khác nhau","Dùng các loại muối khác nhau","Thay đổi nhiệt độ từng giây","Dùng tube có màu khác nhau"],0,"Mỗi probe đặc hiệu gắn fluorophore phát màu riêng → máy phân biệt qua kênh huỳnh quang."],
["Ứng dụng nào KHÔNG phải của Multiplex PCR?",["Định type vi sinh vật đồng thời","Xác định đột biến điểm đặc hiệu","Tách chiết protein khỏi màng tế bào","Phát hiện nhiều tác nhân gây bệnh cùng lúc"],2,"Tách chiết protein là kỹ thuật sinh hóa protein, không liên quan PCR."],
["Từ 10 phân tử DNA ban đầu, sau 10 chu kỳ PCR (hiệu suất 100%) thu được bao nhiêu?",["100 bản sao","1.024 bản sao","10.240 bản sao","20.480 bản sao"],2,"N = 10 × 2^10 = 10 × 1024 = 10.240 bản sao."],
["Nếu nhiệt độ Annealing quá cao trong PCR, điều gì xảy ra?",["Mồi không bắt cặp được vào DNA khuôn, không có sản phẩm","Mồi bắt cặp bừa bãi tạo vạch phụ","Taq polymerase bị biến tính","dNTP bị phân hủy"],0,"Annealing cao quá → liên kết hydro mồi-đích không bền → phản ứng thất bại."],
["Nếu nồng độ MgCl2 quá thấp trong PCR, điều gì xảy ra?",["Taq polymerase hoạt động tối đa","Hiệu suất giảm mạnh hoặc không có sản phẩm","Tạo quá nhiều sản phẩm phụ","DNA khuôn bị đứt gãy"],1,"Thiếu Mg2+: Taq thiếu cofactor, mồi kém bền → hiệu suất thấp hoặc không khuếch đại được."],
["Kỹ thuật RT-PCR dùng khi mẫu ban đầu là loại acid nucleic nào?",["DNA sợi đôi","RNA (mRNA hoặc RNA virus)","Protein","Plasmid DNA"],1,"RT-PCR: dùng reverse transcriptase tổng hợp cDNA từ RNA → rồi khuếch đại bằng PCR."]
];
const SEQ=[
  ["Mục đích chính của kỹ thuật giải trình tự DNA (DNA sequencing) là gì?",["Nhân bản đoạn DNA đích lên hàng tỷ bản sao trong ống nghiệm","Xác định chính xác thứ tự sắp xếp của các nucleotide trên phân tử DNA","Cắt phân tử DNA tại các vị trí nhận biết đặc hiệu của enzyme giới hạn","Nối các đoạn DNA từ hai nguồn khác nhau thành DNA tái tổ hợp"],1,"Giải thích: Giải trình tự DNA là kỹ thuật xác định thứ tự sắp xếp từng nucleotide (A, T, G, C) của một đoạn hoặc toàn bộ phân tử DNA đích."],
  ["Phương pháp giải trình tự Sanger còn được gọi bằng tên nào sau đây?",["Phương pháp cắt hóa học Maxam - Gilbert","Phương pháp chuỗi lặp lại nhân bản (PCR)","Phương pháp kết thúc chuỗi dideoxy (dideoxy chain termination method)","Phương pháp lai phân tử tử huỳnh quang tại chỗ (FISH)"],2,"Giải thích: Phương pháp Sanger dựa trên việc sử dụng các dideoxynucleotide (ddNTP) làm chất kết thúc kéo dài chuỗi nên còn gọi là phương pháp dideoxy chain termination."],
  ["Nhà khoa học Frederick Sanger được trao giải Nobel hóa học năm 1980 cho phát minh phương pháp giải trình tự DNA vào năm nào?",["1953","1977","1985","1993"],1,"Giải thích: Frederick Sanger phát minh ra phương pháp giải trình tự DNA năm 1977 và nhận giải Nobel Hóa học năm 1980."],
  ["Điểm khác biệt cấu tạo cốt lõi giữa ddNTP và dNTP là gì?",["ddNTP thiếu nhóm 2'-OH trên đường ribose","ddNTP thiếu nhóm 3'-OH tự do trên đường deoxyribose (thay bằng nhóm -H)","ddNTP có thêm nhóm phosphate ở vị trí C5'","ddNTP chứa base Uracil thay cho Thymine"],1,"Giải thích: ddNTP (dideoxynucleotide) bị mất nhóm -OH ở cả vị trí C2' và C3' (chỉ có -H ở C3'). Vì thiếu nhóm 3'-OH nên không thể tạo liên kết phosphodiester với nucleotide tiếp theo."],
  ["Điều gì xảy ra ngay sau khi enzyme DNA polymerase gắn một phân tử ddNTP vào chuỗi DNA đang tổng hợp?",["Enzyme tăng tốc độ tổng hợp nucleotide tiếp theo","Phản ứng tổng hợp chuỗi dừng lại ngay lập tức tại vị trí nucleotide đó","Phân tử DNA lập tức bị phân hủy thành các nucleotide tự do","Enzyme tự động cắt bỏ ddNTP vừa gắn và sửa lỗi"],1,"Giải thích: Do ddNTP thiếu nhóm 3'-OH tự do cần thiết để tạo liên kết phosphodiester với nucleotide kế tiếp, quá trình kéo dài chuỗi bị chấm dứt ngay lập tức."],
  ["Trong phương pháp giải trình tự Sanger cổ điển, phản ứng được chia làm bao nhiêu ống (tube) riêng biệt?",["2 ống","3 ống","4 ống","5 ống"],2,"Giải thích: Phản ứng Sanger truyền thống thực hiện trong 4 ống riêng biệt, mỗi ống chứa 1 loại ddNTP đặc hiệu (ddATP, ddTTP, ddCTP hoặc ddGTP)."],
  ["Thành phần nào sau đây CÓ MẶT trong CẢ 4 ống phản ứng giải trình tự Sanger cổ điển?",["DNA khuôn sợi đơn, 1 loại primer, 4 loại dNTP, DNA polymerase","Cả 4 loại ddNTP (ddATP, ddTTP, ddCTP, ddGTP)","Hai mồi (xuôi và ngược) cùng enzyme ligase","Enzyme cắt hạn chế và thẻ huỳnh quang 4 màu"],0,"Giải thích: Cả 4 tube đều có chung: DNA khuôn sợi đơn, 1 mồi (primer), 4 loại dNTP (dATP, dTTP, dCTP, dGTP) và DNA polymerase. Điểm khác duy nhất là mỗi tube chỉ chứa 1 trong 4 loại ddNTP."],
  ["Tỷ lệ giữa dNTP và ddNTP trong phản ứng giải trình tự Sanger được thiết lập như thế nào?",["Nồng độ ddNTP lớn hơn rất nhiều so với dNTP","Nồng độ dNTP lớn hơn nhiều so với nồng độ ddNTP","Nồng độ dNTP và ddNTP bằng nhau tuyệt đối","Chỉ sử dụng ddNTP, không sử dụng dNTP"],1,"Giải thích: Nồng độ dNTP phải lớn hơn nhiều so với ddNTP để chuỗi DNA có thể kéo dài ngẫu nhiên nhiều nucleotide trước khi một ddNTP ngẫu nhiên gắn vào làm dừng chuỗi."],
  ["Quy trình giải trình tự Sanger gồm bao nhiêu bước chính theo đúng thứ tự?",["3 bước: Điện di -> Tinh sạch -> Đọc kết quả","4 bước: Tinh sạch -> PCR -> Chạy phản ứng -> Điện di","5 bước: Chuẩn bị DNA đích -> Tinh sạch DNA -> Chạy phản ứng GTT -> Tinh sạch sản phẩm GTT -> Điện di đọc kết quả","2 bước: Khuếch đại PCR -> Đọc máy tự động"],2,"Giải thích: Quy trình gồm 5 bước chuẩn: (1) Chuẩn bị DNA đích -> (2) Tinh sạch DNA đích -> (3) Chạy phản ứng giải trình tự -> (4) Tinh sạch sản phẩm GTT -> (5) Điện di đọc kết quả."],
  ["Trong bước chuẩn bị DNA đích cho giải trình tự, đoạn DNA đích có thể được nhân bản từ nguồn nào?",["Trực tiếp từ phản ứng PCR hoặc gắn vào vector plasmid/bacteriophage","Trực tiếp từ protein chiết xuất từ tế bào","Nhờ enzyme sao chép ngược RT mà không cần phân lập DNA","Tổng hợp hóa học hoàn toàn không cần DNA khuôn"],0,"Giải thích: DNA đích cho GTT Sanger có thể được khuếch đại bằng phản ứng PCR hoặc được nhân dòng khi chèn vào vector plasmid hay thể thực khuẩn (bacteriophage)."],
  ["Trên gel điện di biến tính của phương pháp Sanger cổ điển, vạch DNA di chuyển NHANH NHẤT (xa nhất về phía cực dương) tương ứng với:",["Đoạn polynucleotide có kích thước dài nhất (chứa nhiều nucleotide nhất)","Đoạn polynucleotide có kích thước ngắn nhất (chỉ gồm mồi + 1 vài nucleotide)","Đoạn DNA mang nhiều gốc phosphate nhất","Đoạn DNA không gắn gốc ddNTP nào"],1,"Giải thích: Trong điện di, các đoạn DNA có kích thước ngắn di chuyển nhanh hơn các đoạn có kích thước dài trong gel dưới tác dụng của điện trường."],
  ["Trình tự nucleotide đọc trực tiếp từ bản gel điện di phương pháp Sanger (từ đáy gel lên đỉnh gel) đại diện cho:",["Trình tự của mạch DNA khuôn ban đầu theo chiều 3' -> 5'","Trình tự của mạch DNA mới tổng hợp bổ sung theo chiều 5' -> 3'","Trình tự của đoạn mồi (primer) ban đầu","Trình tự của phân tử RNA thông tin (mRNA)"],1,"Giải thích: Đọc từ dưới gel (đoạn ngắn nhất, 5') lên trên (đoạn dài hơn, 3') chính là đọc trực tiếp trình tự mạch mới được tổng hợp theo chiều 5' -> 3'."],
  ["Cải tiến quan trọng nhất giúp tự động hóa phương pháp giải trình tự Sanger trên máy giải trình tự tự động là gì?",["Thay thế DNA polymerase bằng RNA polymerase","Sử dụng 4 loại ddNTP được đánh dấu bằng 4 màu huỳnh quang khác nhau trong CÙNG 1 ống phản ứng","Không cần sử dụng đoạn mồi (primer)","Chạy điện di trên gel giấy lọc thông thường"],1,"Giải thích: Sử dụng 4 ddNTP đánh dấu 4 màu huỳnh quang riêng biệt cho phép trộn tất cả vào 1 ống duy nhất và phân tích tự động trên 1 mao quản."],
  ["Trong hệ thống giải trình tự mao quản tự động, nguồn sáng nào được sử dụng để kích thích các chất huỳnh quang đánh dấu trên ddNTP?",["Đèn dây tóc vonfram","Tia X năng lượng cao","Chùm tia Laser (bước sóng kích thích khoảng 488 nm)","Ánh sáng mặt trời tự nhiên"],2,"Giải thích: Hệ thống giải trình tự mao quản dùng chùm tia Laser (bước sóng kích thích 488 nm) để phát huỳnh quang khi các đoạn DNA đi qua khe đọc."],
  ["Thiết bị nhận diện tín hiệu huỳnh quang và chuyển đổi thành dữ liệu số (digital data) trong máy điện di mao quản là:",["Phim X-quang chụp phóng xạ tự ghi","Camera cảm biến CCD (Charge-Coupled Device) kèm bộ chuyển đổi A/D","Kính hiển vi quang học thông thường","Giấy hiển thị màu sắc phản ứng"],1,"Giải thích: Tín hiệu huỳnh quang được ghi nhận bởi cảm biến CCD và chuyển đổi A/D để số hóa kết quả thành tín hiệu đồ thị (chromatogram)."],
  ["Đặc điểm nổi bật của chất điền đầy mao quản (polymer) như POP-7 trong điện di mao quản là gì?",["Phải được pha chế và đổ thủ công trước mỗi lần chạy","Là polymer dạng sẵn sàng sử dụng (ready-to-use) và bơm tự động vào mao quản","Dùng cố định vĩnh viễn không thể thay thế","Được làm từ chất đông tụ agarose nồng độ cao"],1,"Giải thích: Trong điện di mao quản, polymer (như POP-7, PDMA) ở dạng ready-to-use được máy tự động bơm (auto-fill) vào mao quản trước mỗi chu kỳ."],
  ["Ưu điểm vượt trội của Điện di mao quản (Capillary Electrophoresis) so với Điện di Gel truyền thống là gì?",["Hoàn toàn tự động, nạp mẫu tự động, độ phân giải cao và phát hiện tín hiệu real-time","Tốn nhiều thời gian và công sức chuẩn bị gel hơn","Chỉ đọc được tối đa 50 nucleotide trong một lần chạy","Không sử dụng dòng điện để phân tách DNA"],0,"Giải thích: Điện di mao quản tự động hóa toàn bộ quá trình nạp mẫu, bơm polymer, chạy điện di và đọc tín hiệu phát hiện real-time số hóa."],
  ["Hạn chế chính về chiều dài đọc (read length) của phương pháp giải trình tự Sanger trong một phản ứng đơn lẻ là gì?",["Thường bị giới hạn dưới 800 bp","Có thể đọc dễ dàng chuỗi dài 100.000 bp","Chỉ đọc được tối đa 10 bp","Không bị giới hạn chiều dài"],0,"Giải thích: Hạn chế của Sanger là chiều dài đọc bị giới hạn, thường < 800 bp trong 1 phản ứng và cần giải trình tự độc lập ở cả 2 chiều mạch."],
  ["Dự án Bộ gen người (Human Genome Project) áp dụng phương pháp Sanger cổ điển đã tiêu tốn khoảng bao nhiêu chi phí và thời gian?",["100 USD và 1 tuần","1 triệu USD và 1 năm","Hơn 13 năm và khoảng 3 tỷ đến 6 tỷ USD","50 năm và 100 tỷ USD"],2,"Giải thích: Dự án Bộ gen người dựa trên Sanger tốn hơn 13 năm hoàn thành với chi phí lên tới gần 6 tỷ USD (ước tính chi phí khoảng 2400 USD/Mb)."],
  ["Thuật ngữ NGS trong kỹ thuật sinh học phân tử là viết tắt của cụm từ nào?",["New Gene System","Next Generation Sequencing (Giải trình tự thế hệ mới)","Nuclear Genetic Screening","Non-Gel Sanger"],1,"Giải thích: NGS viết tắt của Next Generation Sequencing (Giải trình tự thế hệ mới), cho phép giải trình tự song song khối lượng cực lớn."],
  ["Đặc điểm công nghệ cốt lõi giúp NGS có tốc độ cực nhanh và chi phí thấp hơn gấp hàng nghìn lần Sanger là gì?",["Giải trình tự song song khối lượng cực lớn (Massively Parallel Sequencing) hàng triệu đoạn DNA cùng lúc","Không sử dụng DNA polymerase","Chỉ giải trình tự các phân tử RNA ngắn","Đọc bằng mắt thường không qua máy tính"],0,"Giải thích: NGS đạt hiệu suất kinh ngạc nhờ khả năng đọc hàng triệu đến hàng tỷ đoạn DNA song song đồng thời trên một lượt chạy."],
  ["Ứng dụng quan trọng của giải trình tự DNA trong y học và nghiên cứu là gì?",["Phát hiện đột biến gen liên quan đến bệnh di truyền và ung thư","Định type vi sinh vật và phát hiện biến thể virus","Xây dựng ngân hàng dữ liệu di truyền các loài","Tất cả các phương án trên đều đúng"],3,"Giải thích: Giải trình tự DNA phục vụ phát hiện đột biến y khoa, chẩn đoán vi sinh, giám sát biến thể và xây dựng dữ liệu di truyền sinh học."],
  ["Kỹ thuật lai phân tử (Nucleic acid hybridization) dựa trên nguyên lý cơ bản nào?",["Sự bắt cặp bổ sung giữa sợi đơn đoạn dò (probe) và sợi đơn phân tử đích (target)","Phản ứng trùng hợp amino acid thành chuỗi polypeptide","Sự gắn kết ngẫu nhiên không đặc hiệu giữa DNA và chất béo","Phân hủy phân tử DNA bằng nhiệt độ cao"],0,"Giải thích: Lai phân tử dựa trên khả năng liên kết hydro bổ sung đặc hiệu giữa một sợi đơn acid nucleic làm đoạn dò (probe) và sợi đơn DNA/RNA đích."],
  ["Hai đặc điểm quan trọng nhất của quá trình lai phân tử giúp nó có độ nhạy và độ đặc hiệu cao là gì?",["Đoạn dò chỉ gắn với trình tự đích đặc hiệu và có thể tìm thấy phân tử đích trong hàng triệu phân tử liên quan","Đoạn dò gắn với mọi loại RNA và làm biến đổi cấu trúc DNA","Quá trình xảy ra ở 0 độ C và không cần nhiệt độ phù hợp","Đoạn dò tự nhân bản không cần enzyme"],0,"Giải thích: Quá trình lai có 2 ưu điểm vượt trội: (1) probe chỉ gắn đúng trình tự đích; (2) probe có thể tìm thấy phân tử đích dù nằm trong hỗn hợp triệu phân tử khác."],
  ["Khái niệm Nhiệt độ nóng chảy (Tm - Melting Temperature) của phân tử DNA được định nghĩa là gì?",["Nhiệt độ làm phân hủy hoàn toàn phân tử DNA thành các nguyên tử","Nhiệt độ tại đó 50% số phân tử DNA đôi phân tách thành sợi đơn","Nhiệt độ tối ưu để enzyme DNA polymerase hoạt động mạnh nhất","Nhiệt độ đông đặc của dung dịch DNA"],1,"Giải thích: Nhiệt độ nóng chảy Tm là điểm nhiệt độ mà tại đó 50% số phân tử DNA hai sợi trong dung dịch bị phân tách thành dạng sợi đơn."],
  ["Trong kỹ thuật Real-Time PCR định lượng (qPCR), phương pháp định lượng tuyệt đối được dùng để:",["Xác định chính xác số bản sao (copy number) của đoạn DNA đích ban đầu trong mẫu","So sánh mức độ biểu hiện gen giữa hai mô khác nhau mà không cần số bản sao","Đo khối lượng tế bào trong mẫu sinh thiết","Xác định tuổi của mẫu hóa thạch"],0,"Giải thích: Real-Time PCR định lượng tuyệt đối dùng để xác định nồng độ/số bản sao (copy number) chính xác của đoạn DNA đích ban đầu."],
  ["Ứng dụng chính của Real-Time PCR định lượng tương đối (relative quantification) là gì?",["Xác định mức độ thay đổi biểu hiện của một gen đặc hiệu trong các điều kiện/tình trạng cơ thể khác nhau","Đếm số lượng vi khuẩn chính xác tuyệt đối trong máu","Đo chiều dài của chuỗi DNA bộ gen","Xác định nhóm máu hệ ABO"],0,"Giải thích: Định lượng tương đối giúp đánh giá mức độ tăng/giảm biểu hiện gen (gene expression) giữa các mẫu bệnh lý và mẫu chứng."],
  ["Nếu một chuỗi DNA mới tổng hợp kết thúc bằng ddATP trong ống phản ứng Sanger, điều đó có nghĩa là ở vị trí tương ứng trên mạch khuôn ban đầu là nucleotide nào?",["Adenine (A)","Thymine (T)","Guanine (G)","Cytosine (C)"],1,"Giải thích: Theo nguyên tắc bổ sung A-T, ddATP ở mạch mới tổng hợp sẽ bắt cặp với Thymine (T) trên mạch DNA khuôn."],
  ["Lý do vì sao trong phản ứng giải trình tự Sanger chỉ sử dụng MỘT loại mồi (1 primer) thay vì HAI mồi như phản ứng PCR thông thường?",["Để đảm bảo quá trình tổng hợp tạo ra các đoạn DNA có cùng điểm xuất phát (đầu 5') giúp đọc chính xác kích thước","Vì sử dụng 2 mồi sẽ làm triệt tiêu enzyme DNA polymerase","Vì mồi thứ hai quá đắt tiền","Vì phản ứng giải trình tự không cần kéo dài chuỗi"],0,"Giải thích: Dùng 1 mồi duy nhất đảm bảo tất cả các đoạn DNA được tổng hợp đều có chung đầu 5' (từ vị trí mồi), từ đó việc đo độ dài đoạn sản phẩm sẽ phản ánh chính xác vị trí nucleotide kết thúc ở đầu 3'."],
  ["Phương pháp giải trình tự Maxam - Gilbert (phát minh cùng thời Sanger) dựa trên nguyên lý chính nào?",["Cắt đứt chuỗi DNA đặc hiệu vị trí bằng các hóa chất phản ứng độc hại","Tổng hợp chuỗi bổ sung bằng polymerase","Phân tích khối phổ laser phân đoạn","Giải trình tự bằng cổng nanopore"],0,"Giải thích: Phương pháp Maxam-Gilbert dựa trên phản ứng biến đổi và cắt đứt chuỗi DNA tại các base đặc hiệu bằng hóa chất (chemical cleavage)."],
  ["Trong kết quả phân tích giải trình tự tự động (chromatogram), mỗi nucleotide A, T, G, C được biểu thị bằng:",["Các đỉnh tín hiệu huỳnh quang (peaks) có màu sắc riêng biệt đặc trưng","Các vạch màu đen trắng có độ dày bằng nhau","Số đo nhiệt độ sôi của dung dịch","Các ô vuông màu xám trên bản gel"],0,"Giải thích: Máy giải trình tự huỳnh quang xuất đồ thị sắc phổ (chromatogram) gồm các đỉnh huỳnh quang (peaks) 4 màu tương ứng với 4 loại base."],
  ["Nồng độ agarose thường được dùng trong điện di kiểm tra sản phẩm PCR trước khi giải trình tự nằm trong khoảng nào?",["1% - 2%","10% - 15%","0.1% - 0.2%","50%"],0,"Giải thích: Điện di kiểm tra DNA/PCR thông thường dùng gel agarose nồng độ khoảng 1% - 2% trong đệm TAE hoặc TBE."],
  ["Kỹ thuật Multiplex Real-Time PCR có đặc điểm gì nổi bật?",["Sử dụng nhiều cặp mồi và nhiều probe phát huỳnh quang màu khác nhau để phát hiện nhiều tác nhân/đột biến cùng lúc trong 1 tube","Chỉ phát hiện được 1 đoạn DNA duy nhất","Không sử dụng tín hiệu huỳnh quang","Thời gian chạy kéo dài vài tuần"],0,"Giải thích: Multiplex Real-Time PCR kết hợp nhiều cặp mồi và probe phát tín hiệu huỳnh quang màu khác nhau để định danh nhiều mầm bệnh/đột biến đồng thời."],
  ["Trong quá trình chuẩn bị mẫu GTT Sanger, bước tinh sạch sản phẩm PCR nhằm mục đích chính là gì?",["Loại bỏ các dNTP dư thừa, mồi thừa và enzyme PCR cũ tránh nhiễu phản ứng giải trình tự","Nhân bản DNA lên thêm 1000 lần nữa","Làm đứt gãy DNA thành các hạt nano","Nhuộm màu DNA bằng chất phát quang"],0,"Giải thích: Tinh sạch sau PCR nhằm loại bỏ mồi dư, dNTP và muối đệm để tránh làm cản trở hoặc làm nhiễu phản ứng giải trình tự Sanger tiếp theo."],
  ["Tại sao ddNTP lại có thể đóng vai trò làm chất kết thúc chuỗi (chain terminator)?",["Vì nó không có nhóm 3'-OH để tạo liên kết phosphodiester với nucleotide tiếp theo","Vì nó ức chế trực tiếp enzyme DNA polymerase","Vì nó có thể phá hủy mạch khuôn DNA","Vì nó khiến phản ứng hạ nhiệt độ đột ngột"],0,"Giải thích: Liên kết phosphodiester hình thành giữa nhóm 3'-OH của nucleotide trước và nhóm 5'-phosphate của nucleotide sau. Thiếu 3'-OH khiến phản ứng nối kéo dài bị chặn tuyệt đối."],
  ["Trong các hệ thống điện di mao quản hiện đại, mao quản điện di (capillary) được làm từ chất liệu gì?",["Thủy tinh thạch anh nung chảy (fused silica) phủ lớp bảo vệ bên ngoài","Nhôm đúc nguyên khối","Nhựa dẻo thông thường","Kim loại đồng dẫn điện"],0,"Giải thích: Mao quản điện di được chế tạo từ thạch anh (fused silica) mỏng với đường kính trong cực nhỏ, cho khả năng tản nhiệt điện di tuyệt vời."],
  ["Trong điện di mao quản, hiện tượng dòng điện di thẩm thấu (Electroosmotic Flow - EOF) được tạo ra do yếu tố nào?",["Tương tác của các ion trong đệm với nhóm silanol tích điện âm trên thành trong mao quản","Sự chênh lệch nhiệt độ hai đầu mao quản","Áp suất cơ học của bơm piston","Sóng siêu âm tác động từ bên ngoài"],0,"Giải thích: EOF phát sinh do lớp điện tích kép tạo bởi các nhóm Silanol (-Si-O-) tích điện âm trên thành thạch anh mao quản tương tác với cation đệm dưới điện trường."],
  ["Hạn chế lớn nhất khiến Sanger ít được dùng cho việc giải trình tự toàn bộ bộ gen người (Whole Genome Sequencing) hiện nay là gì?",["Chi phí cao và năng suất thấp hơn rất nhiều so với NGS","Kết quả hoàn toàn không chính xác","Không thể giải trình tự được gen người","Gây ô nhiễm môi trường nghiêm trọng"],0,"Giải thích: Sanger tuy có độ chính xác rất cao nhưng năng suất thấp và chi phí tính trên Mb quá cao nên không phù hợp cho việc giải trình tự quy mô toàn bộ bộ gen lớn."],
  ["Kỹ thuật giải trình tự Sanger hiện nay thường được ứng dụng phổ biến nhất cho nhiệm vụ nào?",["Kiểm tra, kiểm định lại (validation) các đột biến tìm thấy từ NGS hoặc giải trình tự các đoạn gen đơn lẻ (đoạn ngắn)","Giải trình tự hàng ngàn bộ gen người cùng lúc","Đo hàm lượng protein trong serum","Thay thế hoàn toàn cho phản ứng PCR"],0,"Giải thích: Sanger vẫn được coi là 'tiêu chuẩn vàng' (gold standard) để kiểm tra khẳng định lại các đột biến phát hiện bởi NGS và giải trình tự gen đơn lẻ."],
  ["Khi đọc kết quả điện di Sanger cổ điển gồm 4 giếng (G, A, T, C), nếu ở một độ cao nhất định chỉ xuất hiện 1 vạch ở cột 'C', nucleotide trên mạch bổ sung là gì?",["Cytosine (C)","Guanine (G)","Thymine (T)","Adenine (A)"],0,"Giải thích: Vạch ở giếng C tương ứng với chuỗi tổng hợp bị kết thúc bởi ddCTP, tức nucleotide trên mạch mới bổ sung là Cytosine (C) (và trên mạch khuôn tương ứng là Guanine G)."]
];
const ENZ=[
  ["Bản chất hóa học chung của đa số các enzyme trong cơ thể sinh vật là gì?",["Polysaccharide","Protein","Lipid phức hợp","Nucleotide tự do"],1,"Giải thích: Bản chất hóa học của hầu hết các enzyme là protein. Enzyme xúc tác các phản ứng hóa sinh trong điều kiện nhiệt độ và áp suất sinh lý."],
  ["Enzyme được tiết ra dưới dạng tiền chất chưa có hoạt tính xúc tác gọi là gì?",["Holoenzyme","Apoenzyme","Zymogen (hoặc Preenzyme)","Coenzyme"],2,"Giải thích: Một số enzyme được tiết ra dưới dạng tiền enzyme chưa hoạt động gọi là Zymogen hoặc Preenzyme (ví dụ: Pepsinogen, Trypsinogen)."],
  ["Theo Liên đoàn Sinh hóa Quốc tế (IUB), các enzyme được phân chia thành mấy lớp chính?",["4 lớp","5 lớp","6 lớp","7 lớp"],2,"Giải thích: Hệ thống phân loại IUB chia enzyme thành 6 lớp chính theo loại phản ứng xúc tác: 1. Oxidoreductase, 2. Transferase, 3. Hydrolase, 4. Lyase, 5. Isomerase, 6. Ligase."],
  ["Lớp enzyme Oxidoreductases (Lớp 1) xúc tác cho loại phản ứng hóa học nào?",["Phản ứng vận chuyển nhóm hóa học","Phản ứng oxy hóa - khử","Phản ứng thủy phân liên kết","Phản ứng tổng hợp có tiêu tốn ATP"],1,"Giải thích: Oxidoreductase là lớp enzyme xúc tác cho các phản ứng oxy hóa - khử (chuyển electron hoặc hydro giữa các cơ chất)."],
  ["Enzyme xúc tác cho việc vận chuyển các nhóm chức chứa Carbon, Nitrogen hoặc Phosphorus thuộc lớp nào?",["Lớp 1 (Oxidoreductase)","Lớp 2 (Transferase)","Lớp 3 (Hydrolase)","Lớp 4 (Lyase)"],1,"Giải thích: Transferase (Lớp 2) xúc tác các phản ứng vận chuyển nhóm chức (gốc C, N, P...) từ chất cho sang chất nhận."],
  ["Enzyme Urease thủy phân Urê thành CO2 và NH3 thuộc lớp phân loại nào theo IUB?",["Lớp 1 (Oxidoreductase)","Lớp 2 (Transferase)","Lớp 3 (Hydrolase)","Lớp 5 (Isomerase)"],2,"Giải thích: Hydrolase (Lớp 3) xúc tác phản ứng phân cắt các liên kết hóa học với sự tham gia trực tiếp của nước (thủy phân)."],
  ["Enzyme Pyruvate decarboxylase phân cắt liên kết C-C giải phóng CO2 mà không qua thủy phân thuộc lớp nào?",["Hydrolase","Lyase","Isomerase","Ligase"],1,"Giải thích: Lyase (Lớp 4) xúc tác phân cắt các liên kết C-C, C-S, C-N tạo nối đôi hoặc gắn thêm nhóm vào nối đôi mà không qua thủy phân hay oxy hóa."],
  ["Enzyme Methylmalonyl CoA mutase biến đổi Methylmalonyl CoA thành Succinyl CoA thuộc lớp enzyme nào?",["Transferase","Hydrolase","Isomerase","Ligase"],2,"Giải thích: Isomerase (Lớp 5) xúc tác phản ứng biến đổi giữa các dạng đồng phân quang học, hình học hoặc đồng phân vị trí."],
  ["Enzyme Pyruvate carboxylase xúc tác gộp CO2 vào Pyruvate tạo Oxaloacetate gắn liền với sự thủy phân ATP thuộc lớp nào?",["Transferase","Lyase","Isomerase","Ligase"],3,"Giải thích: Ligase hay Synthetase (Lớp 6) xúc tác phản ứng kết hợp 2 phân tử tạo liên kết mới gắn liền với sự giải phóng năng lượng từ ATP."],
  ["Enzyme thuần (enzyme 1 thành phần) có cấu tạo phân tử hoàn toàn từ thành phần nào?",["Protein và ion kim loại","Chỉ chứa chuỗi protein (polypeptide)","Protein và vitamin tan trong dầu","Nucleic acid và lipid"],1,"Giải thích: Enzyme thuần (không cần cộng tố) có bản chất hoàn toàn là protein, đại biểu tiêu biểu là các enzyme thủy phân như Amylase, Pepsin, Trypsin."],
  ["Trong cấu trúc enzyme 2 thành phần, phức hợp hoạt động hoàn chỉnh (Holoenzyme) gồm hai phần nào?",["Apoenzyme + Coenzyme/Cofactor","Corepressor + Apoenzyme","Zymogen + Substrate","Isozyme + Allosteric site"],0,"Giải thích: Holoenzyme (enzyme đầy đủ) = Apoenzyme (phần protein) + Cofactor/Coenzyme (phần phi protein)."],
  ["Thành phần Apoenzyme trong cấu trúc Holoenzyme đóng vai trò quyết định đặc tính sinh học nào?",["Quyết định kiểu phản ứng xúc tác","Quyết định tính đặc hiệu cơ chất và nâng cao hoạt tính","Vận chuyển điện tử trực tiếp","Cung cấp năng lượng ATP cho phản ứng"],1,"Giải thích: Apoenzyme quyết định tính đặc hiệu của enzyme đối với cơ chất và giúp nâng cao hoạt tính xúc tác cho coenzyme."],
  ["Thành phần Coenzyme trong cấu tạo enzyme giữ vai trò mấu chốt nào trong phản ứng?",["Quyết định tính đặc hiệu cơ chất","Quyết định kiểu phản ứng mà enzyme xúc tác","Gắn kết enzyme vào màng tế bào","Biến tính enzyme ở nhiệt độ cao"],1,"Giải thích: Coenzyme trực tiếp tham gia vận chuyển H, electron hoặc nhóm hóa học, do đó quyết định kiểu phản ứng hóa học được xúc tác."],
  ["Coenzyme NAD+ và NADP+ có chứa tiền chất từ loại Vitamin tan trong nước nào?",["Vitamin B1 (Thiamin)","Vitamin B2 (Riboflavin)","Vitamin B3 (Niacin / Vitamin PP)","Vitamin B6 (Pyridoxin)"],2,"Giải thích: NAD+ và NADP+ (Nicotinamid Adenin Dinucleotid) chứa tiền chất là Niacin (Vitamin B3 hay PP). Thiếu hụt gây bệnh Pellagra."],
  ["Coenzyme FMN và FAD là dạng hoạt động mang tiền chất của loại Vitamin nào?",["Vitamin B1","Vitamin B2 (Riboflavin)","Vitamin B5","Vitamin B9"],1,"Giải thích: FMN (Flavin Mononucleotid) và FAD (Flavin Adenin Dinucleotid) chứa tiền chất là Riboflavin (Vitamin B2)."],
  ["Coenzyme Thiamin Pyrophosphat (TPP) tham gia chuyển hóa glucid chứa tiền chất Vitamin nào?",["Vitamin B1 (Thiamin)","Vitamin B2","Vitamin B3","Vitamin B12"],0,"Giải thích: TPP là dạng coenzyme của Vitamin B1 (Thiamin), cần thiết cho enzyme Pyruvate dehydrogenase khử carboxyl oxy hóa."],

  ["Coenzyme Pyridoxal phosphat (PLP) xúc tác các phản ứng trao đổi amin chứa tiền chất Vitamin nào?",["Vitamin B1","Vitamin B6 (Pyridoxin)","Vitamin B12","Vitamin C"],1,"Giải thích: Pyridoxal phosphat (PLP) chứa tiền chất Vitamin B6 (Pyridoxin), là coenzyme của các enzyme transaminase và decarboxylase."],
  ["Coenzyme Tetrahydrofolat (THF) tham gia vận chuyển nhóm 1 carbon chứa vitamin tiền chất nào?",["Acid Folic (Vitamin B9)","Biotin","Niacin","Thiamin"],0,"Giải thích: THF là dạng coenzyme hoạt động của Acid Folic (Vitamin B9), vận chuyển các nhóm một carbon ($- ext{CH}_3, - ext{CHO}$)."],
  ["Khi NAD+ nhận 2H (thu được NADH + H+), mật độ quang học (OD) thay đổi mạnh nhất ở bước sóng nào?",["260 nm","340 nm","450 nm","540 nm"],1,"Giải thích: NADH dạng khử có đỉnh hấp thụ ánh sáng đặc trưng tại bước sóng 340 nm, dùng để đo động học enzyme trong quang phổ kế."],
  ["Trung tâm hoạt động (TTHĐ) của enzyme được định nghĩa là gì?",["Toàn bộ bề mặt ngoài của apoenzyme","Vùng không gian đặc biệt kết hợp với cơ chất và chuyển cơ chất thành sản phẩm","Vùng liên kết với chất ức chế dị lập thể","Chuỗi nucleotide điều hòa phiên mã"],1,"Giải thích: TTHĐ là vùng đặc hiệu nơi cơ chất gắn vào và xảy ra phản ứng biến đổi cơ chất thành sản phẩm."],
  ["Các gốc axit amin nào sau đây thường tham gia cấu tạo nên Trung tâm hoạt động của enzyme?",["Alanine, Valine, Leucine","Serine, Histidine, Cysteine, Lysine","Glycine, Proline, Isoleucine","Methionine, Phenylalanine"],1,"Giải thích: Các gốc axit amin chứa nhóm chức hoạt động như Ser (OH), His (Imidazol), Cys (SH), Lys (NH2), Glu/Asp (COOH) thường tạo TTHĐ."],
  ["Mô hình 'Chìa khóa - Ổ khóa' mô tả TTHĐ và cơ chất khớp cố định được Emil Fischer đề xuất vào năm nào?",["1894","1958","1932","1975"],0,"Giải thích: Mô hình Chìa khóa - Ổ khóa (Lock-and-key model) do Fischer đề xuất năm 1894 giả định cấu hình TTHĐ cố định hoàn toàn ăn khớp cơ chất."],
  ["Mô hình 'Tiếp xúc cảm ứng' (Induced-fit model) khẳng định TTHĐ biến đổi linh hoạt khi tiếp xúc cơ chất do ai đề xuất?",["Emil Fischer (1894)","Daniel Koshland (1958)","Michaelis và Menten (1913)","Lineweaver và Burk (1934)"],1,"Giải thích: Koshland đề xuất mô hình Tiếp xúc cảm ứng năm 1958: TTHĐ chỉ thực sự hình thành dạng tối ưu khi tiếp xúc với cơ chất."],
  ["Mỗi chuỗi polypeptide riêng biệt trong một phân tử enzyme có cấu trúc phức tạp được gọi là gì?",["Bán đơn vị (Subunit)","Cofactor","Zymogen","Holoenzyme"],0,"Giải thích: Mỗi chuỗi polypeptide trong phân tử enzyme đa chuỗi được gọi là một bán đơn vị (subunit)."],
  ["Isoenzyme (Isozyme) được định nghĩa là gì?",["Các enzyme từ loài sinh vật khác nhau xúc tác phản","Các dạng phân tử khác nhau của cùng 1 enzyme, ứng khác nhau                                         xúc tác cùng 1 phản ứng nhưng tính chất động học/vật lý khác nhau","Phức hợp enzyme gắn với màng tế bào","Dạng tiền chất chưa hoạt hóa của enzyme"],1,"Giải thích: Isoenzyme là các dạng phân tử khác nhau của một enzyme, xúc tác cùng một phản ứng hóa học nhưng khác nhau về động học, điểm đẳng điện."],
  ["Enzyme Lactat Dehydrogenase (LDH) gồm bao nhiêu dạng Isoenzyme được cấu tạo từ 2 loại bán đơn vị H và M?",["3 dạng","4 dạng","5 dạng","6 dạng"],2,"Giải thích: LDH có 5 dạng Isoenzyme (LDH1 đến LDH5) kết hợp từ 4 bán đơn vị kiểu H (Heart) và M (Muscle): HHHH, HHHM, HHMM, HMMM, MMMM."],
  ["Isoenzyme LDH1 (HHHH) có ưu thế phân bố ở loại mô cơ quan nào trong cơ thể?",["Gan và cơ vân","Phổi và tụy","Cơ tim và hồng cầu","Thận và não"],2,"Giải thích: LDH1 (HHHH) và LDH2 (HHHM) phân bố chủ yếu ở cơ tim và hồng cầu; tăng cao rõ rệt trong nhồi máu cơ tim."],
  ["Isoenzyme LDH5 (MMMM) phân bố chủ yếu ở cơ quan nào?",["Cơ tim","Phổi","Gan và cơ vân","Thận"],2,"Giải thích: LDH5 (MMMM) chiếm ưu thế ở mô gan và cơ vân; tăng cao khi bị viêm gan cấp hoặc tổn thương cơ xương."],
  ["Isoenzyme LDH-X (còn gọi là LDH-C) xuất hiện đặc hiệu ở cơ quan nào của nam giới sau tuổi dậy thì?",["Tuyến tiền liệt","Tinh hoàn","Tuyến thượng thận","Tụy"],1,"Giải thích: LDH-X (LDH-C) xuất hiện đặc hiệu ở tế bào tinh hoàn người sau tuổi dậy thì."],
  ["Enzyme dị lập thể (Allosteric enzyme) có đặc điểm cấu trúc mấu chốt nào?",["Chỉ có 1 trung tâm hoạt động duy nhất","Ngoài TTHĐ còn có vị trí dị lập thể liên kết với chất điều hòa (hoạt hóa hoặc ức chế)","Không chứa thành phần protein","Không bị ảnh hưởng bởi nhiệt độ"],1,"Giải thích: Enzyme dị lập thể có thêm trung tâm dị lập thể riêng biệt để gắn chất điều hòa âm (ức chế) hoặc điều hòa dương (hoạt hóa)."],
  ["Enzyme có tác dụng làm tăng vận tốc phản ứng hóa học thông qua cơ chế sinh hóa mấu chốt nào?",["Làm tăng năng lượng tự do ΔG của phản ứng","Làm giảm năng lượng hoạt hóa (ΔG*) của trạng thái chuyển tiếp","Làm thay đổi hằng số cân bằng Keq của phản ứng","Cung cấp thêm nhiệt lượng cho môi trường"],1,"Giải thích: Enzyme làm tăng vận tốc phản ứng bằng cách làm giảm năng lượng hoạt hóa (ΔG*) cần thiết để đưa cơ chất lên trạng thái chuyển tiếp."],
  ["Hằng số Michaelis (Km) đại diện cho thông số nào trong động học enzyme?",["Vận tốc tối đa của phản ứng khi bão hòa cơ chất","Nồng độ cơ chất [S] tại đó vận tốc phản ứng đạt 1/2 Vmax","Nhiệt độ tối ưu cho phản ứng","Nồng độ chất ức chế giảm 50% hoạt độ"],1,"Giải thích: Km là nồng độ cơ chất [S] để phản ứng đạt một nửa vận tốc tối đa ($v = 1/2 V_{max}$)."],
  ["Nếu một enzyme có giá trị hằng số Km rất nhỏ đối với cơ chất A, điều đó có ý nghĩa gì?",["Ái lực của enzyme với cơ chất A rất yếu","Ái lực của enzyme với cơ chất A rất mạnh","Vận tốc tối đa Vmax rất nhỏ","Enzyme bị biến tính nhanh chóng"],1,"Giải thích: Km tỷ lệ nghịch với ái lực: Giá trị Km càng nhỏ thì ái lực giữa enzyme và cơ chất càng lớn (chỉ cần nồng độ cơ chất nhỏ đã đạt 1/2 Vmax)."],
  ["Đồ thị Lineweaver-Burk trong phân tích động học enzyme là dạng đồ thị nào?",["Đồ thị đường cong Hyperbol biểu diễn v theo [S]","Đồ thị nghịch đảo kép biểu diễn 1/v theo 1/[S]","Đồ thị hình chữ S (Sigmoid)","Đồ thị cột trực quan"],1,"Giải thích: Phương trình Lineweaver-Burk lấy nghịch đảo hai bên phương trình Michaelis-Menten tạo đồ thị đường thẳng $1/v$ theo $1/[S]$."],
  ["Nhiệt độ tối ưu cho hoạt tính của hầu hết các enzyme người trong cơ thể là khoảng bao nhiêu?",["0°C - 10°C","37°C - 40°C","60°C - 70°C","100°C"],1,"Giải thích: Nhiệt độ thích hợp nhất cho enzyme người hoạt động là 37°C - 40°C. Ở 100°C hầu hết enzyme protein bị biến tính mất hoạt tính hoàn toàn."],
  ["Chất ức chế thuận nghịch cạnh tranh (Competitive inhibitor) có đặc điểm sinh hóa nào?",["Gắn ngoài TTHĐ, làm giảm Vmax","Có cấu trúc tương tự cơ chất, cạnh tranh gắn TTHĐ, làm Km tăng nhưng Vmax không đổi","Phá hủy vĩnh viễn cấu trúc enzyme","Làm Km giảm và Vmax tăng"],1,"Giải thích: Chất ức chế cạnh tranh có cấu trúc giống cơ chất, cạnh tranh TTHĐ. Có thể đảo ngược ức chế bằng cách tăng nồng độ cơ chất (Km tăng, Vmax giữ nguyên)."],
  ["Chất ức chế không cạnh tranh (Non-competitive inhibitor) làm thay đổi các thông số động học như thế nào?",["Km tăng, Vmax không đổi","Km không đổi, Vmax giảm","Cả Km và Vmax đều tăng","Cả Km và Vmax đều không đổi"],1,"Giải thích: Chất ức chế không cạnh tranh gắn ngoài TTHĐ, làm giảm số lượng phân tử enzyme hoạt động làm Vmax giảm, nhưng không ảnh hưởng tới việc gắn cơ chất nên Km không đổi."],
  ["Sự ức chế enzyme Succinate dehydrogenase bởi Acid Malonic (Malonate) là ví dụ điển hình cho loại ức chế nào?",["Ức chế không thuận nghịch","Ức chế thuận nghịch cạnh tranh","Ức chế không cạnh tranh","Hoạt hóa dị lập thể"],1,"Giải thích: Malonate có cấu trúc tương tự Succinate nên cạnh tranh gắn vào TTHĐ của Succinate dehydrogenase (ức chế cạnh tranh)."],
  ["Thuốc kháng sinh Penicillin diệt vi khuẩn bằng cơ chế ức chế không thuận nghịch enzyme nào?",["Amylase","Glycopeptid transpeptidase","Lactat dehydrogenase","Pyruvate kinase"],1,"Giải thích: Penicillin gắn cộng hóa trị vào gốc Serine ở TTHĐ của glycopeptid transpeptidase, ngăn cản tạo liên kết chéo thành tế bào vi khuẩn."],
  ["Đơn vị hoạt độ enzyme Quốc tế (UI hay U) được định nghĩa là lượng enzyme chuyển hóa bao nhiêu cơ chất?",["1 mol cơ chất trong 1 giây","1 micromol (μmol) cơ chất trong 1 phút ở 25°C","1 gram cơ chất trong 1 giờ","1 millimol cơ chất trong 1 ngày"],1,"Giải thích: 1 U là lượng enzyme có khả năng xúc tác chuyển hóa 1 μmol cơ chất trong thời gian 1 phút ở điều kiện tiêu chuẩn 25°C."],
  ["Đơn vị Katal (kat) trong hệ SI biểu thị lượng enzyme xúc tác chuyển hóa bao nhiêu?",["1 micromol cơ chất / phút","1 mol cơ chất trong 1 giây (1 kat = 6 x 10^7 U)","1 mmol cơ chất / phút","100 mol cơ chất / giờ"],1,"Giải thích: Katal (kat) là đơn vị SI đại diện cho lượng enzyme biến đổi 1 mol cơ chất trong 1 giây."],
  ["Enzyme Alanin aminotransferase (ALT hay GPT) tăng rất cao trong máu là chỉ thị lâm sàng đặc hiệu cho tổn thương cơ quan nào?",["Cơ tim","Tế bào gan","Tụy tạng","Xương"],1,"Giải thích: ALT phân bố chủ yếu ở bào tương tế bào gan. Khi gan bị viêm hoặc hủy hoại, ALT giải phóng vào máu tăng rất cao."],
  ["Enzyme Aspartate aminotransferase (AST hay GOT) tăng cao thường gặp trong tổn thương những mô nào?",["Cơ tim, gan, cơ xương","Tuyến tiền liệt","Niêm mạc ruột","Phổi"],0,"Giải thích: AST có nhiều ở ti thể tế bào cơ tim, gan và cơ xương; tăng trong nhồi máu cơ tim, viêm gan."],
  ["Hoạt độ enzyme Amylase (AMS) tăng đột biến trong máu và nước tiểu là tiêu chuẩn vàng chẩn đoán bệnh lý cấp tính nào?",["Nhồi máu cơ tim cấp","Viêm tụy cấp","Xơ gan cổ trướng","Viêm thận mãn"],1,"Giải thích: Amylase do tuyến tụy và tuyến nước bọt tiết ra. Trong viêm tụy cấp, Amylase máu và nước tiểu tăng rất nhanh và cao."],
  ["Xét nghiệm enzyme Acid Phosphatase (ACP) trong huyết thanh gia tăng đặc hiệu trong chẩn đoán bệnh nào?",["Ung thư tiền liệt tuyến (nhất là khi có di căn)","Viêm gan B cấp","Nhồi máu cơ tim","Viêm tụy cấp"],0,"Giải thích: Acid phosphatase (ACP) có hàm lượng rất cao trong tuyến tiền liệt; tăng cao rõ rệt trong ung thư tiền liệt tuyến."],
  ["Xét nghiệm nồng độ Isoenzyme CK-MB (Creatine Kinase MB) được chỉ định ưu tiên để chẩn đoán sớm bệnh lý nào?",["Viêm gan virus","Nhồi máu cơ tim cấp","Ung thư dạ dày","Cường giáp"],1,"Giải thích: CK-MB là isoenzyme đặc hiệu của cơ tim, xuất hiện sớm và tăng cao trong máu sau khi bị nhồi máu cơ tim cấp."],
  ["Bệnh lý thiếu máu tan máu bộc phát khi dùng thuốc chống sốt nấm/chống malaria xảy ra ở người bị thiếu hụt di truyền enzyme nào?",["Glucose-6-Phosphate Dehydrogenase (G6PD)","Lactat Dehydrogenase (LDH)","Alanin Aminotransferase (ALT)","Amylase"],0,"Giải thích: Thiếu hụt enzyme G6PD di truyền làm hồng cầu không tạo đủ NADPH để bảo vệ màng, dẫn tới tan máu khi gặp chất oxy hóa (thuốc, đậu Fava)."],
  ["Enzyme Angiotensin-converting enzyme (ACE) giữ vai trò sinh lý quan trọng nào trong hệ tuần hoàn?",["Thủy phân tinh bột","Chuyển Angiotensin I thành Angiotensin II gây co mạch điều hòa huyết áp","Phân hủy lipid máu","Tổng hợp Glycogen"],1,"Giải thích: ACE xúc tác chuyển Angiotensin I thành Angiotensin II - một chất co mạch mạnh giúp nâng huyết áp."],
  ["Phản ứng đo màu hồng Quinoneimine ở bước sóng quang phổ thông qua sự kết hợp với enzyme thứ 2 Peroxidase áp dụng để làm gì?",["Xác định bản chất chuỗi DNA","Đo nồng độ cơ chất hoặc hoạt độ enzyme gián tiếp qua biến đổi mật độ quang","Cố định tế bào vi khuẩn","Tách chiết lipid màng"],1,"Giải thích: Phản ứng ghép nối với Peroxidase tạo màu hồng Quinoneimine đo quang phổ OD để xác định gián tiếp nồng độ các chất (như Glucose, Cholesterol...)."]
];

  ["Hormone được định nghĩa là chất thông tin hóa học có đặc điểm sinh học nào sau đây?",["Do tế bào chuyên biệt tiết ra, vận chuyển qua máu","Là chất xúc tác thủy phân thức ăn tại ruột điều hòa hoạt động mô đích","Chỉ có tác dụng tại chính tế bào tiết ra","Cung cấp năng lượng chính cho cơ thể"],0,"Giải thích: Hormone là chất thông tin hóa học do tuyến nội tiết tiết vào máu để điều hòa chuyển hóa, tăng trưởng ở mô đích xa."],
  ["Cơ chế điều hòa tự động nồng độ hormone trong máu chủ yếu dựa trên nguyên lý nào?",["Cơ chế khuếch tán thụ động","Cơ chế ức chế phản hồi âm tính (Negative Feedback)","Cơ chế thẩm thấu","Cơ chế biến tính protein"],1,"Giải thích: Hệ thống nội tiết duy trì hằng định nồng độ hormone nhờ cơ chế ức chế phản hồi (Feedback negative) vòng ngắn và vòng lớn."],
  ["Trục thần kinh - nội tiết trung tâm điều hòa hầu hết các tuyến nội tiết trong cơ thể là gì?",["Trục Vỏ não - Tủy sống - Thần kinh thực vật","Trục Vùng dưới đồi - Tuyến yên - Tuyến nội tiết đích","Trục Gan - Thận - Tuyến thượng thận","Trục Tụy - Dạ dày - Ruột"],1,"Giải thích: Trục Vùng dưới đồi (tiết RH/IH) -> Tuyến yên (tiết SH/Tropin) -> Tuyến nội tiết đích là trục điều hòa trung tâm."],
  ["Hormone Nhóm I theo cơ chế hoạt động liên kết với loại thụ thể (Receptor) nào ở tế bào đích?",["Thụ thể màng tế bào","Thụ thể nội bào (trong bào tương hoặc nhân tế bào)","Thụ thể tự do trong máu","Thụ thể màng đáy"],1,"Giải thích: Hormone Nhóm I tan trong lipid nên qua màng tế bào và gắn với thụ thể nội bào (cytosol hoặc nhân)."],
  ["Bản chất hóa học của các hormone thuộc Nhóm I (gắn thụ thể nội bào) là gì?",["Tan trong nước (Peptid, Protein)","Khống tan trong nước / Tan trong lipid (Steroid, Hormone Giáp T3, T4)","Các khí hòa tan","Nucleotide"],1,"Giải thích: Hormone Nhóm I có bản chất giống lipid (Steroid và Hormone Giáp T3, T4), khuếch tán qua màng lipid kép."],
  ["Phức hợp Hormone - Thụ thể nội bào sau khi hình thành gắn vào vùng nào trên DNA nhân tế bào?",["Vùng Promoter chung","Vùng yếu tố đáp ứng hormone (HRE - Hormone Response Element)","Vùng Telomere","Vùng Intron"],1,"Giải thích: Phức hợp H-R nội bào gắn đặc hiệu vào vùng HRE trên DNA nhân tế bào để khởi động hoặc ức chế phiên mã."],
  ["Tác dụng sinh học cuối cùng của các hormone Nhóm I trên tế bào đích diễn ra thông qua con đường nào?",["Tạo AMP vòng (cAMP)","Điều hòa sự phiên mã (tổng hợp ARNm) và dịch mã tạo protein/enzyme mới","Mở kênh ion Natri tức thì","Phân hủy màng tế bào"],1,"Giải thích: Tác dụng của Steroid và T3/T4 là thay đổi tốc độ tổng hợp protein/enzyme mới thông qua điều hòa phiên mã mARNm."],

  ["Bệnh lý Viêm tuyến giáp tự miễn mạn tính Hashimoto đặc trưng bởi chỉ số xét nghiệm huyết thanh nào tăng cao?",["Kháng thể Anti-TPO (Anti-Thyroid Peroxidase)","Kháng thể Insulin","Nồng độ Cortisol","Nồng độ Aldosterone"],0,"Giải thích: Viêm giáp Hashimoto có sự xuất hiện kháng thể chống lại tự nguyên tuyến giáp, xét nghiệm Anti-TPO tăng rất cao."],

  ["Tác dụng gây hạ đường huyết của Insulin dựa trên các cơ chế sinh hóa mấu chốt nào?",["Ức chế hấp thu glucose ở ruột","Tăng tính thấm vận chuyển glucose vào tế bào (cơ, mỡ) và tăng tổng hợp Glycogen","Tăng đào thải glucose qua nước tiểu","Chuyển glucose thành amino acid"],1,"Giải thích: Insulin làm gắn GLUT4 lên màng tế bào cơ/mỡ giúp đưa Glucose vào trong tế bào và kích thích glycogen synthase tổng hợp Glycogen."],

  ["Đặc điểm sinh hóa của nhóm Vitamin tan trong lipid (A, D, E, K) là gì?",["Dễ dàng đào thải qua thận mà không qua chuyển","Đóng vai trò chống oxy hóa, tiền chất giống hóa                                                   hormone, dễ tích tụ tại gan/mô mỡ","Đều đóng vai trò là coenzyme xúc tác phân cắt","Không tan trong dung môi hữu cơ"],1,"Giải thích: Vitamin tan trong dầu vận chuyển dạng lipoprotein, có vai trò chống oxy hóa/tiền chất hormone và dễ tích tụ tại gan gây độc khi quá liều."],
  ["Dạng coenzyme hoạt động sinh học của Vitamin B1 (Thiamin) trong tế bào là gì?",["Thiamin monophosphate","Thiamin pyrophosphate (Coenzyme TPP)","Flavin adenine dinucleotide","Pyridoxal phosphate"],1,"Giải thích: Vitamin B1 trong cơ thể được gắn 2 nhóm phosphate tạo thành Thiamin Pyrophosphate (Coenzyme TPP)."],

  ["Đối tượng lâm sàng nào có nguy cơ cao nhất bị thiếu hụt Vitamin B1?",["Người ăn nhiều rau xanh","Người nghiện rượu mãn tính, suy dinh dưỡng, truyền dịch Dextrose lâu ngày","Vận động viên thể thao","Trẻ em uống nhiều sữa"],1,"Giải thích: Nghiện rượu mãn tính kèm suy dinh dưỡng hoặc nuôi dưỡng tĩnh mạch bằng đường Dextrose kéo dài làm kiệt huệ dự trữ Vitamin B1."],
  ["Coenzyme TPP của Vitamin B1 tham gia xúc tác phản ứng quan trọng nào trong đường phân và chu trình Krebs?",["Thủy phân Peptid","Khử carboxyl oxy hóa Pyruvate thành Acetyl-CoA và alpha-Ketoglutarate","Tổng hợp Acid béo","Hydroxyl hóa Proline"],1,"Giải thích: TPP là coenzyme của các phức hợp đa enzyme Pyruvate dehydrogenase và alpha-Ketoglutarate dehydrogenase."],
  ["Vitamin B2 (Riboflavin) khi vào cơ thể biến đổi thành 2 dạng coenzyme hoạt động nào?",["NAD+ và NADP+","FMN (Flavin Mononucleotid) và FAD (Flavin Adenin Dinucleotid)","CoA và TPP","PLP và THF"],1,"Giải thích: Vitamin B2 biến đổi gắn ATP tạo thành FMN và FAD."],

  ["Bệnh Pellagra với hội chứng tam chứng 3D (Viêm da - Diarrhea/Tiêu chảy - Dementia/Sa sút trí tuệ) do thiếu Vitamin nào?",["Vitamin B1","Vitamin B3 (Niacin / PP)","Vitamin C","Vitamin A"],1,"Giải thích: Bệnh Pellagra đặc trưng bởi 3D: Dermatitis (viêm da đối xứng), Diarrhea (tiêu chảy) và Dementia (sa sút trí tuệ) do thiếu Vitamin B3."],

  ["Phụ nữ trước và trong thai kỳ bị thiếu hụt Acid Folic (Vitamin B9) có nguy cơ rất cao sinh con bị dị tật gì?",["Bệnh còi xương","Dị tật ống thần kinh (nứt đốt sống, vô não)","Bệnh máu khó đông","Bệnh đốm mắt Bitot"],1,"Giải thích: Thiếu Acid Folic giai đoạn đầu thai kỳ làm rối loạn khép ống thần kinh gây dị tật nứt đốt sống (spina bifida)."],

  ["Thiếu hụt Vitamin D ở trẻ em gây bệnh Còi xương, còn ở người lớn gây nên bệnh lý xương nào?",["Bệnh Gout","Bệnh Nhuyễn xương (Osteomalacia)","Bệnh Viêm khớp dạng thấp","Gãy xương tự phát"],1,"Giải thích: Thiếu Vitamin D làm giảm hấp thu Canxi: trẻ em bị còi xương (xương mềm biến dạng O/X), người lớn bị nhuyễn xương."],

  ["Vitamin K đóng vai trò coenzyme cho phản ứng Gamma-carboxylation các gốc Glutamate của yếu tố đông máu nào tại gan?",["Yếu tố I, III, V, VIII","Yếu tố II (Prothrombin), VII, IX, X","Yếu tố XI, XII, XIII","Fibrinogen và Thrombin"],1,"Giải thích: Vitamin K cần cho enzyme gamma-glutamyl carboxylase để hoạt hóa 4 yếu tố đông máu phụ thuộc vitamin K: II, VII, IX, X."],
